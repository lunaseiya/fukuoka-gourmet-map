<script>
const DATA_URL = "../data/spots.json";

const state = {
  spots: [],
  filter: "all",
  kidsLevel: 2,      // ★2026-10-19: 子連れ歓迎(2)→可まで(1)→すべて(0) の3段。初期は歓迎だけ
  kidsOnly: true,    // ★「子連れOK」は最初からON(2026-10-14)。filter とは独立して掛かる(日帰りOK等と併用できる)
  category: "gourmet",
  q: "",
  areas: new Set(),
  areasDraft: new Set(),
  ages: new Set(),   // 対象年齢の絞り込み(選んだ区分を**全部**満たす所だけ)
  markers: [],
  selectedId: null
};

// 投稿から1週間は NEW 扱い
function isNew(spot) {
  if (!spot.posted) return false;
  const d = new Date(spot.posted + "T00:00:00+09:00");
  return (Date.now() - d.getTime()) <= 7 * 24 * 60 * 60 * 1000;
}

async function loadSpots() {
  try {
    const res = await fetch(DATA_URL);
    if (!res.ok) throw new Error("fetch failed: " + res.status);
    const json = await res.json();
    return Array.isArray(json) ? json : [];
  } catch (e) {
    console.error("spots.json の読み込みに失敗しました", e);
    return [];
  }
}

// 子連れ設備の値は4通り。
//   true       … その店にある(確認済み)
//   "facility" … 店には無いが同じ建物(モール等)にある。飛牛下原店のように実質困らないケース
//   false      … 無いと確認した
//   null       … 未確認。推測で埋めない
const kidsHas = v => v === true || v === "facility";

const KIDS_FACILITY = [
  ["kidsChair", "🪑", "子供椅子"],
  ["kidsMenu",  "🍽", "キッズメニュー"],
  ["diaper",    "🚼", "おむつ替え"],
  ["kidsSpace", "🧸", "キッズスペース"],
  ["tatami",    "🧎", "座敷・小上がり"],
  ["sofa",        "🛋", "ソファ席"],
  ["horigotatsu", "🪵", "掘りごたつ"],
  ["stroller",  "👶", "ベビーカーOK"],
  ["babyKeep",    "🚻", "トイレに補助チェア"],
  ["kidsPlate",   "🥣", "子供用の食器"],
];

// ★子連れは「歓迎」と「可」の2段(2026-10-19ユーザー確定)
//   歓迎(2) = 店が子供のために用意しているものがある: 子供椅子・キッズメニュー・おむつ替え台(店の)・キッズスペース・普段使える座敷
//   可  (1) = 子供と座れる/入れるが店は大人向け: ソファ席・掘りごたつ・ベビーカー入店可・トイレの補助チェア・
//             建物(モール)のおむつ替え等、△(子供用の食器・板のソファ)は2つ以上で可。△1つだけは入れない
//   tatami:"banquet"(宴会用の座敷)は数えない。新項目が未入力の店は verdict の文言からも拾う
const KIDS_WELCOME = ["kidsChair", "kidsMenu", "diaper", "kidsSpace"];
const KIDS_CAN     = ["horigotatsu", "babyKeep", "stroller"];
const NEG = "(?!.{0,4}(なし|無し|はない|ありません))";
// ★喫煙可の店は無条件に「歓迎」にしない(2026-10-19ユーザー確定)。最大でも「可」
//   spot.smoking: "ok"=喫煙可 / "separate"=分煙 / "no"=禁煙 / 未入力は verdict の文言から拾う
function isSmokingOk(spot) {
  if (spot.smoking) return spot.smoking === "ok";
  return /(喫煙可|喫煙OK|全席喫煙|喫煙席あり|タバコOK|たばこOK)(?!.{0,2}(不可|なし))/.test(spot.verdict || "");
}
function kidsLevelOf(spot) {
  const lv = kidsLevelRaw(spot);
  return (lv === 2 && isSmokingOk(spot)) ? 1 : lv;
}
function kidsLevelRaw(spot) {
  const k = spot.kids || {};
  const v = spot.verdict || "";
  // 家族風呂・貸切風呂は家族のために用意された設備
  if (/家族風呂|家族湯|貸切風呂|貸切湯/.test((spot.genre || "") + v)) return 2;
  // 家族で行った遊び場・宿(赤ピン)は、設備を登録していなくても歓迎(飲食店は設備が要る)
  // (青ピンは取り込み時に with:"family" を仮置きしているため、withでは判定しない)
  if (!spot.wish && spot.with === "family" && spotCats(spot).some(c => c !== "gourmet")) return 2;
  if (KIDS_WELCOME.some(key => k[key] === true) || k.tatami === true) return 2;
  if (k.kidsChair == null && new RegExp("(キッズチェア|子供椅子|子ども椅子|子供イス|ベビーチェア)" + NEG).test(v)) return 2;
  if (k.kidsMenu == null && new RegExp("(お子様メニュー|お子さまメニュー|キッズメニュー|お子様ランチ|お子さまランチ|おこさまセット|お子様セット)" + NEG).test(v)) return 2;
  if (k.kidsSpace == null && new RegExp("(キッズスペース|キッズルーム|プレイルーム)" + NEG).test(v)) return 2;
  // ここから「可」
  if (KIDS_CAN.some(key => kidsHas(k[key])) || k.sofa === true) return 1;
  if (KIDS_WELCOME.some(key => k[key] === "facility")) return 1;   // 建物にはあるが店のものではない
  if (k.sofa == null && new RegExp("ソファ" + NEG).test(v)) return 1;
  if (k.horigotatsu == null && /掘りごたつ|掘り炬燵/.test(v)) return 1;
  if (k.babyKeep == null && /ベビーキープ|補助便座|補助チェア/.test(v)) return 1;
  let weak = 0;
  if (k.sofa === "board") weak++;
  if (kidsHas(k.kidsPlate)) weak++;
  if (k.kidsPlate == null && /取り皿|取り分け|子(供|ども)用の?(食器|お?皿)/.test(v)) weak++;
  return weak >= 2 ? 1 : 0;
}
// 歓迎の根拠になる項目か(チップを濃く出す)
const isWelcomeKey = (key, val) => val === true && (KIDS_WELCOME.includes(key) || key === "tatami");

function kidsFacilityHtml(spot) {
  const k = spot.kids || {};
  const yes = [], no = [];
  for (const [key, icon, label] of KIDS_FACILITY) {
    const v = k[key];
    if (key === "tatami" && v === "banquet") { yes.push(`<span class="kf kf-k">${icon} ${label}<span class="kf-s">宴会用</span></span>`); continue; }
    if (key === "sofa" && v === "board") { yes.push(`<span class="kf kf-k">${icon} ${label}<span class="kf-s">板張り</span></span>`); continue; }
    if (v === true) yes.push(`<span class="kf ${isWelcomeKey(key, v) ? "kf-w" : "kf-k"}">${icon} ${label}</span>`);
    else if (v === "facility") yes.push(`<span class="kf kf-f">${icon} ${label}<span class="kf-s">建物内</span></span>`);
    else if (v === false) no.push(`<span class="kf kf-n">${icon} ${label}<span class="kf-s">なし</span></span>`);
  }
  if (k.noise === "ok") yes.push(`<span class="kf kf-k">🔉 騒いでも平気</span>`);
  if (isSmokingOk(spot)) no.push(`<span class="kf kf-n">🚬 喫煙可</span>`);
  const lv = kidsLevelOf(spot);
  // 点数は運用モードだけに出す(お客さんには段の名前だけ)
  const top = isKidsTop(spot)
    ? `<span class="kl kl-2">🌟 子連れ大歓迎${document.body.classList.contains("admin") ? " " + kidsScore(spot) + "点" : ""}</span>` : "";
  const badge = top ? top : lv === 2 ? `<span class="kl kl-2">👪 子連れ歓迎</span>` : lv === 1 ? `<span class="kl kl-1">🙆 子連れ可</span>` : "";
  // 「なし」は、他に確認できた設備がある店でだけ出す。
  // 単独で出すと、そもそも座敷を期待しない店(カウンターのラーメン屋等)にまで
  // 灰色のチップが並んで邪魔になるだけで、判断の足しにならない
  if (!yes.length && !badge) return "";
  return `<div class="card-kidsrow">${badge}${yes.join("")}${yes.length ? no.join("") : ""}</div>`;
}

// ★子連れ大歓迎(4段目・2026-10-27ユーザー確定。同日お客さんにも公開)
//   歓迎は「どれか1つ」で届くので、もう1段上を作る。点数は運用モードだけに出す。
//   条件 = 歓迎(喫煙可でない) + 点数7以上。キッズスペースは必須にしない(丸源ラーメンを大歓迎にするため・同日ユーザー)
//   点数: キッズスペース3 / キッズメニュー2 / 離乳食2 / バウンサー2 /
//         子供椅子・おむつ替え・座敷・掘りごたつ・ベビーカー・ソファ・子供用食器・麺切りカッター・ベビーキープ・おもちゃ付き 各1
//   kids 欄に無い項目は verdict と points の文言からも拾う(離乳食・おもちゃ付きは kids 欄に項目が無い)
const KIDS_SCORE = { kidsSpace: 3, kidsMenu: 2, kidsChair: 1, diaper: 1, tatami: 1, horigotatsu: 1, stroller: 1, sofa: 1, kidsPlate: 1, babyKeep: 1 };
function kidsScore(spot) {
  const k = spot.kids || {};
  const v = (spot.verdict || "") + " " + (spot.points || []).join(" ");
  let n = Object.entries(KIDS_SCORE).reduce((a, [key, p]) => a + (k[key] === true ? p : 0), 0);
  if (k.kidsMenu !== true && /お子様メニュー|お子さま(ラーメン|ランチ|メニュー)|キッズメニュー|お子様ランチ/.test(v)) n += 2;
  if (k.kidsChair !== true && /子供椅子|キッズチェア|ベビーチェア|ハイチェア/.test(v)) n += 1;
  if (/離乳食/.test(v) && !/離乳食.{0,4}(なし|ない|不可)/.test(v)) n += 2;
  if (k.kidsPlate !== true && /子(供|ども)用の?(食器|取り皿|お?皿|カトラリー)|子供取り皿/.test(v)) n += 1;
  // 2026-10-27ユーザー: わざわざ子供のために置いている道具は別に数える
  if (/麺切り|ヌードルカッター|麺カッター/.test(v)) n += 1;
  if (/バウンサー/.test(v) && !/バウンサー.{0,4}(なし|ない)/.test(v)) n += 2;
  if (/おもちゃ付|おもちゃの?プレゼント|おもちゃがもらえ/.test(v)) n += 1;
  return n;
}
function isKidsTop(spot) {
  return kidsLevelOf(spot) === 2 && kidsScore(spot) >= 7;
}

// 子連れ可以上か(直リンクで開くときの判定などに使う)
function isKidsOk(spot) { return kidsLevelOf(spot) >= 1; }

// 泊まれる施設か(明示フラグ optional: spot.stay)
function canStay(s) {
  if (s.stay === true) return true;
  if (s.stay === false) return false;
  return /旅館|ホテル|宿|リゾート|ペンション|民宿|別邸/.test((s.genre || "") + (s.name || ""));
}
// 日帰り入浴ができるか(明示フラグ optional: spot.dayUse)
function canDayUse(s) {
  if (s.dayUse === true) return true;
  if (s.dayUse === false) return false;
  const v = s.verdict || "";
  // 「日帰り不可」等の否定表現が先に来る場合は除外
  if (/日帰り[^。]{0,12}(不可|いたしており|できません|なし|していません)/.test(v)) return false;
  if (/日帰り|立ち寄り湯|外来入浴/.test(v)) return true;
  if (/日帰り|スーパー銭湯|銭湯|温浴|スパ|健康ランド|公衆浴場|家族湯|家族風呂|貸切風呂|サウナ|砂むし/.test(s.genre || "")) return true;
  // 入浴料が書かれている＝外来利用できるとみなす(「大人1,500円」「小人700円」等)
  return /(大人|小人|子供|中学生|小学生)[^。]{0,10}[0-9,]{3,6}\s*円/.test(v);
}

// スポットの所属カテゴリ(お食事/宿・温泉/遊び場)  ※おでかけ要素は遊び場に集約
// 1スポットが複数タブに載ることがある(例: 一蘭の森=工場見学だがラーメンを食べに行く場所でもある)。
// その場合は cats:["play","gourmet"] のように配列で持たせる。cats が無ければ従来の category 単独。
const CAT_LABEL = { gourmet: "🍜 お食事", onsen: "♨ 宿・温泉", play: "🎡 遊び場" };
function spotCats(s) {
  if (Array.isArray(s.cats) && s.cats.length) return s.cats;
  if (s.category === "onsen") return ["onsen"];
  if (s.category === "play") return ["play"];
  return ["gourmet"];
}
// 主カテゴリ(バッジ判定など「1つに決めたい」場面用)
function spotCat(s) { return spotCats(s)[0]; }

// 検索は表記ゆれを吸収するため、カタカナ→ひらがな・大小文字・全半角を寄せて比較する
function normalize(s) {
  return (s || "").toLowerCase()
    .replace(/[ァ-ヶ]/g, c => String.fromCharCode(c.charCodeAt(0) - 0x60))
    .replace(/[！-～]/g, c => String.fromCharCode(c.charCodeAt(0) - 0xfee0))
    .replace(/[\s　・･ー\-()（）「」]/g, "");
}
function searchBlob(s) {
  return normalize([s.name, s.area, s.city, s.pref, s.genre, s.verdict].join(" "));
}
function matchQuery(s, q) {
  const terms = q.split(/[\s　]+/).filter(Boolean).map(normalize).filter(Boolean);
  if (!terms.length) return true;
  const blob = searchBlob(s);
  return terms.every(t => blob.includes(t));
}

function applyFilters(spots) {
  // 検索中はカテゴリ・絞り込みを無視して全件から探す(タブを跨いで見つけたいため)
  if (state.q.trim()) return spots.filter(s => matchQuery(s, state.q));
  return spots.filter(s => {
    if (isExpired(s)) return false;            // 会期切れの企画展は自動で消す
    if (!spotCats(s).includes(state.category)) return false;
    // すべて=赤(訪問済み)+青(行きたい)を同時表示。タブで絞り込み
    if (state.filter === "visited" && s.wish) return false;
    // 子連れOKは赤(実績)+青(下調べで設備の裏が取れた店)の両方を出す(2026-08-27仕様変更)
    // 2026-10-14: 単独のフィルタ値ではなく state.kidsOnly(初期ON)として他の絞り込みと併用する
    // 2026-10-19: state.kidsLevel = 2(歓迎だけ・初期) / 1(可まで) / 0(すべて)
    // 2026-10-27: 3 = 大歓迎だけ
    if (state.kidsLevel === 3) { if (!isKidsTop(s)) return false; }
    else if (state.kidsLevel && kidsLevelOf(s) < state.kidsLevel) return false;
    if (state.filter === "kids" && !isKidsOk(s)) return false;
    if (state.filter === "limited" && !isLimited(s)) return false;
    if (state.filter === "fukko" && !isFukko(s)) return false;
    if (state.filter === "wish" && !s.wish) return false;
    if (state.filter === "dayuse" && !canDayUse(s)) return false;
    if (state.filter === "stay" && !canStay(s)) return false;
    if (state.areas.size && !state.areas.has(s.city)) return false;
    // 年齢は「除外フィルター」(2026-10-12変更)。年齢タグが付いていて合わない所だけ外し、
    // 未確定(ages無し)は残す。以前の「選んだ区分を全部満たす所だけ」だと未確定が多い今は
    // 情報がほぼ消えて使えなかった。残した未確定にはカードに「年齢の目安なし」と出す
    if (state.ages.size && Array.isArray(s.ages) && s.ages.length
        && ![...state.ages].every(a => s.ages.includes(a))) return false;
    return true;
  });
}

// 楽天トラベル(A8)アフィリエイトリンク。宿泊・温泉系のカードに表示
const AFF_RAKUTEN_TRAVEL = "https://rpx.a8.net/svt/ejp?a8mat=4BA7X5+1FSQEQ+2HOM+6L1YA&rakuten=y&a8ejpredirect=http%3A%2F%2Fhb.afl.rakuten.co.jp%2Fhgc%2F0eb4779e.5d30c5ba.0eb4779f.b871e4e3%2Fa26081745747_4BA7X5_1FSQEQ_2HOM_6L1YA%3Fpc%3Dhttp%253A%252F%252Ftravel.rakuten.co.jp%252F%26m%3Dhttp%253A%252F%252Ftravel.rakuten.co.jp%252F";
// 楽天トラベルは宿泊予約サイトなので、実際に泊まれる施設にだけボタンを出す。
// (日帰り専用のスーパー銭湯・家族湯に宿泊予約リンクを出すのは紹介になっておらず、
//  楽天アフィリエイト規約の「紹介目的以外の掲載」に触れるため)
function isStaySpot(spot) {
  return canStay(spot);
}

function webUrl(spot) {
  // 公式サイトが登録されていればそれを、無ければGoogleマップの該当スポットを開く
  if (spot.web) return spot.web;
  const q = encodeURIComponent(spot.name + " " + (spot.city || ""));
  if (spot.lat && spot.lng) {
    return `https://www.google.com/maps/search/?api=1&query=${q}&center=${spot.lat},${spot.lng}`;
  }
  return `https://www.google.com/maps/search/?api=1&query=${q}`;
}

function videoLinksHtml(spot, cls) {
  const video = spot.video;
  const items = [];
  if (video && video.youtube) items.push(`<a href="${video.youtube}" target="_blank" rel="noopener">YouTube</a>`);
  if (video && video.tiktok) items.push(`<a href="${video.tiktok}" target="_blank" rel="noopener">TikTok</a>`);
  if (video && video.instagram) items.push(`<a href="${video.instagram}" target="_blank" rel="noopener">Instagram</a>`);
  items.push(`<a class="web-btn" href="${webUrl(spot)}" target="_blank" rel="noopener">🌐 詳細</a>`);
  // 食べログは「詳細」とは別ボタンにする(詳細=公式サイト/地図、食べログ=口コミ・予約)
  if (spot.tabelog) {
    // バリューコマースの食べログ提携は 2026/11/01 で終了 → 11/2 以降は広告ではないので PR 札を出さない
    const tabelogPr = new Date() < new Date("2026-11-02T00:00:00+09:00");
    items.push(`<a class="tabelog-btn" href="${spot.tabelog}" target="_blank" rel="noopener">食べログ</a>${tabelogPr ? `<span class="pr-badge">PR</span>` : ""}`);
  }
  // アソビューのWEBチケット(生URL→LinkSwitchが自動変換)
  if (spot.asoview) {
    items.push(`<a class="ticket-btn" href="${spot.asoview}" target="_blank" rel="noopener">チケットを買う</a><span class="pr-badge">PR</span>`);
  }
  // 公式サイトの席予約。提携が無く報酬も発生しないのでPR表記は付けない
  if (spot.reserve) {
    items.push(`<a class="reserve-btn" href="${spot.reserve}" target="_blank" rel="noopener">席を予約</a>`);
  }
  // 公式フロアマップ(モール等)。画像は複製せずリンクで飛ばす(2026-10-24)
  if (spot.floormap) {
    items.push(`<a class="floormap-btn" href="${spot.floormap}" target="_blank" rel="noopener">フロアマップ(公式)</a>`);
  }
  if (isStaySpot(spot)) {
    // その宿のじゃらんページが分かっていれば直リンクする。
    // トップページ着地より成約率が高いので、booking があるときは楽天(トップ)は出さない。
    if (spot.booking) {
      items.push(`<a class="aff-jalan" href="${spot.booking}" target="_blank" rel="nofollow noopener">じゃらんで予約</a><span class="pr-badge">PR</span>`);
    } else {
      items.push(`<a class="aff-rakuten" href="${AFF_RAKUTEN_TRAVEL}" target="_blank" rel="nofollow noopener">楽天トラベル</a><span class="pr-badge">PR</span>`);
    }
  }
  return `<div class="${cls}">${items.join("")}</div>`;
}

function escapeHtml(str) {
  if (str === null || str === undefined) return "";
  return String(str)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;");
}

// verdict は **強調** 記法を使って書いてある(197件)。エスケープした後に
// **〜** だけを <strong> に戻す。エスケープ済みなので新たなタグ注入は起きない
function escapeRich(str) {
  return escapeHtml(str).replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
}

// 店紹介の表示(2026-10-27ユーザー確定「パッと見られて、詳細も見られる」)。
// points(子連れポイントの箇条書き。先頭が ⚠ なら注意)と memo(1文目だけ見せ、残りは「詳しく」で開く)があればそれを使い、
// 無い店は従来の verdict の文章をそのまま出す。verdict は検索・子連れ判定の材料として残す(金額入りでも画面には出ない)
function verdictHtml(spot) {
  const pts = spot.points || [];
  if (!pts.length && !spot.memo) {
    return spot.verdict ? `<div class="card-verdict">${escapeRich(spot.verdict)}</div>` : "";
  }
  const li = pts.map(p => {
    const warn = /^⚠/.test(p);
    return `<li class="${warn ? "pt-warn" : "pt-ok"}">${escapeHtml(p.replace(/^⚠\s*/, ""))}</li>`;
  }).join("");
  let memo = "";
  if (spot.memo) {
    const m = spot.memo.match(/^(.+?[。！!？?])\s*([\s\S]*)$/);
    const head = m ? m[1] : spot.memo, rest = m ? m[2].trim() : "";
    memo = `<div class="card-memo">${escapeHtml(head)}${rest
      ? `<details class="memo-more" onclick="event.stopPropagation()"><summary>詳しく</summary>${escapeHtml(rest)}</details>` : ""}</div>`;
  }
  return `<div class="card-verdict">${li ? `<ul class="card-points">${li}</ul>` : ""}${memo}</div>`;
}

// ジャンル文字列から「のれん」の見た目(絵文字・色・札の文字)を決める
function norenStyle(spot) {
  const g = (spot.genre || "") + (spot.category || "");
  const has = (...words) => words.some(w => g.includes(w));
  if (spot.category === "onsen" || has("温泉", "銭湯", "スパ", "サウナ", "湯")) return { cls: "ph-onsen", emoji: "♨️", label: "湯" };
  if (has("ラーメン", "つけ麺", "豚骨")) return { cls: "ph-ramen", emoji: "🍜", label: "麺" };
  if (has("うどん", "そば", "蕎麦")) return { cls: "ph-ramen", emoji: "🍜", label: "麺" };
  if (has("カフェ", "喫茶", "パン", "スイーツ", "ドーナツ", "ケーキ", "デザート")) return { cls: "ph-cafe", emoji: "☕", label: "甘味" };
  if (has("居酒屋", "屋台", "酒場", "焼鳥", "焼き鳥", "串", "おでん", "餃子")) return { cls: "ph-izakaya", emoji: "🏮", label: "酒場" };
  if (has("焼肉", "ホルモン", "ステーキ", "ハンバーグ")) return { cls: "ph-izakaya", emoji: "🍖", label: "肉" };
  if (has("寿司", "鮨", "海鮮", "魚")) return { cls: "ph-food", emoji: "🍣", label: "海鮮" };
  if (has("モール", "ショッピング", "百貨店")) return { cls: "ph-mall", emoji: "🛍️", label: "モール" };
  if (has("ホテル", "旅館", "宿", "リゾート")) return { cls: "ph-hotel", emoji: "🏨", label: "宿" };
  if (has("公園", "遊", "ミュージアム", "こども", "施設", "テーマ", "動物", "水族館")) return { cls: "ph-play", emoji: "🎡", label: "遊び場" };
  return { cls: "ph-food", emoji: "🍴", label: "食事処" };
}

// 期間限定であることをカードの先頭で目立たせる。開くだけで「今だけ」が伝わるように
function limitedHtml(spot) {
  const c = campaignOf(spot);
  const left = daysLeft(spot);
  if (!c && !isEventOnly(spot)) return "";
  if (isEventOnly(spot) && left === null) return "";
  const soon = (left ?? 99) <= 14 ? " soon" : "";
  const rest = (left ?? 99) <= 30 ? `<b>あと${Math.max(0, left)}日</b>` : "";
  if (c) {
    const until = c.untilLabel || c.until;
    // 開始日が入っていれば「◯月◯日〜◯月◯日」の期間表示にする。
    // ハッピーセットのように2週間で入れ替わるものは、いつ始まったかも知りたいため
    const span = c.fromLabel ? `${escapeHtml(c.fromLabel)}〜${escapeHtml(until)}`
                             : `${escapeHtml(until)}まで`;
    return `<div class="ltd-band${soon}">
        <span class="ltd-icon">🤝</span>
        <span class="ltd-main">${escapeHtml(c.title || "コラボ開催中")}</span>
        <span class="ltd-sub">${span} ${rest}</span>
        ${c.note ? `<span class="ltd-note">${escapeHtml(c.note)}</span>` : ""}
        ${c.url ? `<a class="ltd-link" href="${escapeHtml(c.url)}" target="_blank" rel="noopener">詳細</a>` : ""}
      </div>`;
  }
  // 企画展は**まだ始まっていないもの**も登録する(巡回展など先の予定が分かるため)。
  // 開始日が未来なら「◯月◯日から」と出し、残り日数ではなく開幕までの日数を見せる。
  // 開始済みなら従来どおり「◯月◯日まで」
  const nowMs = Date.now();
  const startMs = spot.from ? new Date(spot.from + "T00:00:00+09:00").getTime() : null;
  const notYet = startMs !== null && !isNaN(startMs) && startMs > nowMs;
  if (notYet) {
    const d = Math.ceil((startMs - nowMs) / 86400000);
    return `<div class="ltd-band">
        <span class="ltd-icon">📅</span>
        <span class="ltd-main">これから開催</span>
        <span class="ltd-sub">${escapeHtml(spot.fromLabel || spot.from)}〜${escapeHtml(spot.untilLabel || spot.until)}
          ${d <= 60 ? `<b>あと${d}日で開幕</b>` : ""}</span>
      </div>`;
  }
  const span = spot.fromLabel
    ? `${escapeHtml(spot.fromLabel)}〜${escapeHtml(spot.untilLabel || spot.until)}`
    : `${escapeHtml(spot.untilLabel || spot.until)}まで`;
  return `<div class="ltd-band${soon}">
      <span class="ltd-icon">⏳</span>
      <span class="ltd-main">期間限定の開催</span>
      <span class="ltd-sub">${span} ${rest}</span>
    </div>`;
}

const AGE_LABEL = { baby: "👶 乳幼児(0〜2歳)", toddler: "🧒 幼児(3〜6歳)", kids: "🎒 小人(小学生)" };
// 写真の出典(photoCredits)。自分で撮っていない写真はCCライセンスの帰属表示が必須なので、
// サムネ・ギャラリーにこの配列があるスポットはカードに「写真: 作者 / ライセンス」を出す(2026-10-12)
function photoCreditHtml(spot) {
  if (!Array.isArray(spot.photoCredits) || !spot.photoCredits.length) return "";
  const seen = new Set();
  const items = spot.photoCredits.filter(c => c && c.author).filter(c => {
    const k = c.author + "|" + (c.lic || ""); if (seen.has(k)) return false; seen.add(k); return true;
  }).map(c => {
    const a = c.url ? `<a href="${escapeHtml(c.url)}" target="_blank" rel="noopener">${escapeHtml(c.author)}</a>` : escapeHtml(c.author);
    const l = c.lic ? (c.licurl ? ` / <a href="${escapeHtml(c.licurl)}" target="_blank" rel="noopener">${escapeHtml(c.lic)}</a>` : ` / ${escapeHtml(c.lic)}`) : "";
    return a + l;
  });
  return `<div class="card-credit">📷 写真: ${items.join("、")}(Wikimedia Commons)</div>`;
}

function ageBadgesHtml(spot) {
  if (!Array.isArray(spot.ages) || !spot.ages.length) {
    // 年齢で絞っている最中に残った未確定スポットは、その旨を薄く出す(除外フィルター化に伴う・2026-10-12)
    return state.ages.size ? `<div><span class="b-age unk">年齢の目安なし</span></div>` : "";
  }
  return `<div>${["baby", "toddler", "kids"].filter(a => spot.ages.includes(a))
    .map(a => `<span class="b-age">${AGE_LABEL[a]}</span>`).join("")}</div>`;
}

// ★視聴者のコメント(リクエスト)で行った店の札【2026-10-25】
//   spots.json: "request": {"by": "〇〇さん", "via": "instagram|tiktok|youtube", "date": "YYYY-MM-DD"}
//   by が無ければ札だけ。他人の写真は載せない方針なので、参加の痕跡は名前(ハンドル)の文字だけで残す
const REQUEST_VIA = { instagram: "Instagram", tiktok: "TikTok", youtube: "YouTube" };
function requestHtml(spot) {
  const r = spot.request;
  if (!r) return "";
  const via = REQUEST_VIA[r.via] || "";
  const who = r.by ? `${escapeHtml(r.by)}の${via ? via + "の" : ""}コメントから` : "";
  return `<div class="card-request"><span class="t-req">💬 リクエストで行った店</span>${who ? `<span>${who}</span>` : ""}</div>`;
}

function cardHtml(spot) {
  // ⚠ここで解析イベントを送ってはいけない【2026-10-14】。cardHtml は一覧(renderList)でも1枚ずつ呼ばれるので、
  //   絞り込みのたびに全カード分の spot_open が飛び、28日で9,610件という実態と無関係な数になっていた。
  //   「読まれた店」の計測は openDetail() 側で送る
  const area = spot.area ? escapeHtml(spot.area) : "";
  const cityArea = [spot.city ? escapeHtml(spot.city) : "", area].filter(Boolean).join("・");
  // 訪問済みだが動画がまだ無い店
  const v = spot.video || {};
  const noVideo = !spot.wish && !spot.memo && !v.youtube && !v.tiktok && !v.instagram;
  const ph = norenStyle(spot);
  const thumb = spot.thumb
    ? `<img class="card-thumb" src="thumbs/${escapeHtml(spot.thumb)}" alt="" loading="lazy">`
    : `<div class="card-thumb ph ${ph.cls}"><span class="ph-emoji">${ph.emoji}</span><span class="ph-label">${ph.label}</span></div>`;
  const parent = spot.in ? state.spots.find(p => p.id === spot.in) : null;
  return `
    ${thumb}
    <div class="card-body">
      <div class="card-top">
        <div class="card-name">${escapeHtml(spot.name)}</div>
        <div class="card-genre">${escapeHtml(spot.genre || "")}</div>
      </div>
      <div class="card-area">${cityArea}</div>
      ${requestHtml(spot)}
      ${kidsFacilityHtml(spot)}
      ${verdictHtml(spot)}
      ${photoCreditHtml(spot)}
      ${spot.bathAge ? `<div class="card-bath">♨ ${escapeHtml(spot.bathAge)}</div>` : (spot.category === "onsen" ? `<div class="card-bath">♨ 子供の年齢制限・オムツ可否: 記載無し(要問合せ)</div>` : "")}
      ${fukkoHtml(spot)}${limitedHtml(spot)}${isNew(spot) ? `<span class="b-new">NEW</span>` : ""}${spot.wish ? `<span class="b-wish">下調べ済み</span>` : ""}${noVideo ? `<span class="b-prep">🎬 動画準備中</span>` : ""}${parent ? `<span class="b-in" data-jump="${escapeHtml(parent.id)}">📍${escapeHtml(parent.name)} 内</span>` : ""}${spotCats(spot).includes("onsen") && canStay(spot) ? `<span class="b-stay">🛏 泊まれる</span>` : ""}${spotCats(spot).includes("onsen") && canDayUse(spot) ? `<span class="b-day">♨ 日帰りOK</span>` : ""}${state.q.trim() ? `<span class="b-cat">${CAT_LABEL[spotCat(spot)]}</span>` : ""}${spotCats(spot).length > 1 ? `<span class="b-both">${spotCats(spot).includes("gourmet") ? "🍜お食事にも" : "🎡遊び場にも"}</span>` : ""}${ageBadgesHtml(spot)}
      ${videoLinksHtml(spot, "card-links")}
    </div>
  `;
}

function areaTabSpots(spots) {
  return spots.filter(s => {
    if (isExpired(s)) return false;            // 会期切れの企画展は自動で消す
    if (!spotCats(s).includes(state.category)) return false;
    if (state.filter === "visited" && s.wish) return false;
    if (state.filter === "kids" && !isKidsOk(s)) return false;
    if (state.filter === "limited" && !isLimited(s)) return false;
    if (state.filter === "fukko" && !isFukko(s)) return false;
    if (state.filter === "wish" && !s.wish) return false;
    if (state.filter === "dayuse" && !canDayUse(s)) return false;
    if (state.filter === "stay" && !canStay(s)) return false;
    return true;
  });
}

function populateAreaSelect(spots) {
  const tabSpots = areaTabSpots(spots);
  const prefBy = {};
  tabSpots.forEach(s => { if (s.city && !prefBy[s.city]) prefBy[s.city] = s.pref || "福岡県"; });
  const cities = Object.keys(prefBy);
  const WARDS = ["福岡市東区", "福岡市博多区", "福岡市中央区", "福岡市南区", "福岡市城南区", "福岡市早良区", "福岡市西区"];
  const PREFS = ["佐賀県", "長崎県", "大分県", "熊本県", "宮崎県", "鹿児島県", "山口県", "広島県", "岡山県", "愛媛県", "大阪府"];
  const rank = c => {
    const w = WARDS.indexOf(c);
    if (w >= 0) return w;
    if (prefBy[c] === "福岡県") return 100;
    const p = PREFS.indexOf(prefBy[c]);
    return 200 + (p >= 0 ? p : PREFS.length);
  };
  cities.sort((a, b) => rank(a) - rank(b) || a.localeCompare(b, "ja"));
  const countBy = {};
  tabSpots.forEach(s => { if (s.city) countBy[s.city] = (countBy[s.city] || 0) + 1; });
  // 選択中で消えた市区を落とす
  [...state.areas].forEach(a => { if (!cities.includes(a)) state.areas.delete(a); });
  state.areasDraft = new Set(state.areas);
  const box = document.getElementById("areaListBox");
  let html = ""; let lastGroup = "";
  cities.forEach(c => {
    const g = rank(c) < 100 ? "福岡市" : (prefBy[c] === "福岡県" ? "福岡県内" : prefBy[c]);
    if (g !== lastGroup) { html += `<div class="area-group">${g}</div>`; lastGroup = g; }
    const label = prefBy[c] === "福岡県" ? c : c;
    html += `<label class="area-item"><input type="checkbox" value="${escapeHtml(c)}" ${state.areasDraft.has(c) ? "checked" : ""}><span>${escapeHtml(label)}</span><span class="cnt">${countBy[c]}</span></label>`;
  });
  box.innerHTML = html || `<div class="memo-hint">このタブに市区データがありません</div>`;
  box.querySelectorAll("input[type=checkbox]").forEach(cb => {
    cb.addEventListener("change", () => {
      if (cb.checked) state.areasDraft.add(cb.value); else state.areasDraft.delete(cb.value);
    });
  });
  updateAreaBtn();
}

function updateAreaBtn() {
  const b = document.getElementById("areaBtn");
  b.textContent = state.areas.size ? `市区で絞る(${state.areas.size})` : "市区で絞る";
  b.classList.toggle("active", state.areas.size > 0);
}

function clearMarkers() {
  state.markers.forEach(m => m.marker.remove());
  state.markers = [];
}

// ===== 詳細カード(ピン/リスト共通の詳細表示) =====
function updatePinHighlight() {
  state.markers.forEach(({ spot, items, marker }) => {
    // まとめたピンは中に選択中の店が含まれていれば強調する
    const on = spot ? spot.id === state.selectedId
                    : !!(items && items.some(s => s.id === state.selectedId));
    marker.getElement().classList.toggle("pin-selected", on);
  });
}

// ===== ★統合ボトムシート(peek / half / full × list / detail)【2026-10-14】 =====
const Sheet = (() => {
  const el = document.getElementById("bsheet");
  const head = el.querySelector(".bs-head");
  const body = el.querySelector(".bs-body");
  let st = "peek", mode = "list", prevBeforeDetail = "peek";
  const hdrH = () => (document.querySelector("header") || {}).offsetHeight || 0;
  function peekH() {
    // 頭 + (ホーム画面案内が出ていればその分) + 先頭カード(NEWの店)1枚ぶん。長いカードは200pxで切る
    const a = document.getElementById("a2hs");
    const extra = (a && !a.hidden) ? a.offsetHeight + 8 : 0;
    const first = document.querySelector("#list .card");
    const card = first ? Math.min(first.offsetHeight, 200) : 56;
    return head.offsetHeight + extra + card + 16;
  }
  function hFor(s) {
    const H = window.innerHeight;
    if (s === "full") return Math.max(200, H - hdrH() - 6);
    if (s === "half") return Math.round(H * 0.52);
    // ★詳細モードの peek は「つまみ+店名の帯」だけ。下にスワイプしてここまで畳むと地図が全部見える
    //   (2026-10-24ユーザー要望「この画面から下のリストをしまいたい。スワイプすれば隠せる感じで」。
    //    それまで詳細モードは half/full の2段しかなく、下に引いても half で止まっていた)
    if (mode === "detail") return head.offsetHeight + 10;
    // ★一覧モードの min も同じ「つまみ+帯」だけ(2026-10-25)。peek より下へ引くとここで止まる
    if (s === "min") return head.offsetHeight + 10;
    return Math.min(peekH(), Math.round(H * 0.45));
  }
  // いちばん畳んだ段(ドラッグの下限・スナップ先の候補に使う)。詳細モードは peek が帯だけなので min を持たない
  const lowest = () => (mode === "detail" ? "peek" : "min");
  function set(s) {
    st = s; el.dataset.state = s;
    el.style.height = hFor(s) + "px";
  }
  function refresh() { set(st); }
  function setMode(m) { mode = m; el.dataset.mode = m; }
  function openDetailMode() {
    // 畳んだ詳細から別のピンを押したときは、一覧に戻る先(prevBeforeDetail)を上書きしない
    if (mode !== "detail") prevBeforeDetail = st;
    setMode("detail"); body.scrollTop = 0; set((st === "peek" || st === "min") ? "half" : st);
  }
  function closeDetailMode() { setMode("list"); body.scrollTop = 0; set(prevBeforeDetail); }

  // ドラッグ: つまみ(.bs-head)から。peek のときはシートのどこからでも
  let y0 = null, h0 = 0, dragging = false, moved = false;
  el.addEventListener("touchstart", e => {
    if (!(st === "peek" || st === "min" || head.contains(e.target))) return;
    y0 = e.touches[0].clientY; h0 = el.offsetHeight; dragging = true; moved = false;
    el.style.transition = "none";
  }, { passive: true });
  el.addEventListener("touchmove", e => {
    if (!dragging) return;
    const dy = y0 - e.touches[0].clientY;
    if (Math.abs(dy) > 6) moved = true;
    if (!moved) return;
    const h = Math.max(Math.round(hFor(lowest()) * 0.7), Math.min(hFor("full"), h0 + dy));
    el.style.height = h + "px";
    e.preventDefault();
  }, { passive: false });
  const endDrag = () => {
    if (!dragging) return;
    dragging = false; el.style.transition = "";
    if (!moved) { refresh(); return; }
    const h = el.offsetHeight;
    // 一覧モードは min(帯だけ)→peek→half→full の4段、詳細モードは peek(店名の帯だけ)→half→full の3段(2026-10-24/25)
    const states = mode === "detail" ? ["peek", "half", "full"] : ["min", "peek", "half", "full"];
    // 行き先は「いまの高さに一番近い段」。いちばん下の段より下へ引いたらその段に戻す
    const best = states.map(s => [s, Math.abs(hFor(s) - h)]).sort((a, b) => a[1] - b[1])[0][0];
    set(best);
    try { window.icTrack && window.icTrack("sheet_drag", { to: best, mode: mode }); } catch (e) {}
    setTimeout(() => { moved = false; }, 50);
  };
  el.addEventListener("touchend", endDrag);
  el.addEventListener("touchcancel", endDrag);
  // つまみをタップ: peek⇄half(詳細モードでは half⇄full)
  head.addEventListener("click", () => {
    if (moved) return;
    if (st === "peek" || st === "min") set("half");       // 畳んだ帯をタップ → 開く(一覧・詳細とも)
    else if (mode === "detail") set(st === "full" ? "half" : "full");
    else set("peek");
  });
  window.addEventListener("resize", refresh);
  return { set, refresh, setMode, openDetailMode, closeDetailMode, get state() { return st; }, get mode() { return mode; } };
})();

// まとめピンのリスト(#clusterBox)の✕。⚠以前は openDetail() の中で登録していたため、
// 詳細カードを一度も開いていない状態ではボタンが効かなかった(2026-10-16ユーザー指摘)。起動時に1回だけ登録する
// 開閉は複数の場所から行うので、class の変化を見て body.cl-open を合わせる(一覧シートを隠す用)
new MutationObserver(() => {
  document.body.classList.toggle("cl-open", document.getElementById("clusterBox").classList.contains("open"));
}).observe(document.getElementById("clusterBox"), { attributes: true, attributeFilter: ["class"] });
document.getElementById("clusterClose").addEventListener("click", (ev) => {
  ev.stopPropagation();
  document.getElementById("clusterBox").classList.remove("open");
});

function openDetail(spot) {
  // 施設リストが開いたままだと、同じ下寄せのシート同士が重なって詳細カードが隠れてしまう
  const cbox = document.getElementById("clusterBox");
  if (cbox) cbox.classList.remove("open");
  const detail = document.getElementById("detail");
  // 写真ギャラリー(横スワイプ、タップで拡大)
  const photosHtml = (spot.photos && spot.photos.length) ? `
    <div class="card-photos">${spot.photos.map(p => `<img src="photos/${escapeHtml(p)}" loading="lazy" data-photo="${escapeHtml(p)}" alt="">`).join("")}</div>` : "";
  // この施設内に登録されているスポット(親→子リンク)
  // 情報が充実しているもの(動画あり>写真あり>訪問済み>ひとことあり)を上に並べる
  const childScore = c => {
    const v = c.video || {};
    let n = 0;
    if (v.youtube || v.tiktok || v.instagram) n += 8;
    if (c.photos && c.photos.length) n += 4;
    if (!c.wish) n += 2;
    if (c.verdict) n += 1;
    return n;
  };
  const children = state.spots.filter(s => s.in === spot.id)
    .sort((a, b) => childScore(b) - childScore(a) || (a.name || "").localeCompare(b.name || "", "ja"));
  const childrenHtml = children.length ? `
    <div class="detail-children">
      <div class="dc-title">この施設内のスポット</div>
      ${children.map(c => {
        const v = c.video || {};
        const mark = (v.youtube || v.tiktok || v.instagram) ? "🎬" : (c.photos && c.photos.length ? "📷" : "");
        return `<button class="dc-item" data-jump="${escapeHtml(c.id)}"><span>${mark}${escapeHtml(c.name)}</span><span class="dc-genre">${escapeHtml(c.genre || "")}</span></button>`;
      }).join("")}
    </div>` : "";
  // 関連スポット(同チェーンの動画がある店など)
  const relatedSpots = (spot.related || []).map(id => state.spots.find(s => s.id === id)).filter(Boolean);
  const relatedHtml = relatedSpots.length ? `
    <div class="detail-children">
      <div class="dc-title">関連スポット(同チェーン等)</div>
      ${relatedSpots.map(c => { const v = c.video || {}; const hasV = v.youtube || v.tiktok || v.instagram; return `<button class="dc-item" data-jump="${escapeHtml(c.id)}"><span>${escapeHtml(c.name)}${hasV ? " 🎬動画あり" : ""}</span><span class="dc-genre">${escapeHtml(c.genre || "")}</span></button>`; }).join("")}
    </div>` : "";
  detail.innerHTML = `
    <div class="detail-grip"></div>
    <button class="detail-close" id="detailClose">✕</button>
    <div class="card">${cardHtml(spot)}</div>
    ${photosHtml}
    ${childrenHtml}
    ${relatedHtml}
  `;
  detail.classList.add("open");
  // シートの頭に店名を出す。畳んだとき(peek)に「どの店の詳細をしまっているか」が帯だけで分かるように(2026-10-24)
  const dt = document.querySelector("#bsheet .bs-detail-title");
  if (dt) dt.textContent = spot.name || "お店の詳細";
  Sheet.openDetailMode();   // 同じシートの中身を詳細に切り替える(2026-10-14)
  // どのスポットが読まれているかを解析に送る(analytics.js が未設定なら何もしない)。
  // 詳細を開いたときだけ送る = 「読まれた店」の数になる(一覧描画では送らない・2026-10-14)
  try { window.icTrack && window.icTrack("spot_open", { spot: spot.name, id: spot.id, city: spot.city || "" }); } catch (e) {}
  try { window.showA2hs && window.showA2hs("detail"); } catch (e) {}
  document.getElementById("detailClose").addEventListener("click", closeDetail);
  bindJumpLinks(detail);
  detail.querySelectorAll("[data-photo]").forEach(el => {
    el.addEventListener("click", (e) => {
      e.stopPropagation();
      Lightbox.open("photos/" + el.dataset.photo);
    });
  });
}

// ===== ★拡大表示(ライトボックス)のピンチズーム【2026-10-23ユーザー要望】 =====
//   「フロアマップの写真を開いても何の店が入っているか読めない」→ 画像の上で
//   ピンチ(2本指)/ドラッグ(拡大中)/ダブルタップ(等倍⇄2.5倍)/ホイール(PC)/＋－ボタン で拡大縮小。
//   等倍のときに背景をタップ、または✕で閉じる。拡大中のタップでは閉じない(誤操作防止)
const Lightbox = (() => {
  const box = document.getElementById("lightbox");
  const img = document.getElementById("lightboxImg");
  const MAX = 6;
  let scale = 1, tx = 0, ty = 0;            // 画像の表示倍率と平行移動(画面座標・px)
  let base = { w: 0, h: 0, x: 0, y: 0 };   // 等倍のときの画像の大きさと左上
  const ptrs = new Map();                   // pointerId → {x,y}
  let pinch0 = null, lastTap = 0, moved = false, downAt = 0;

  function fitBase() {
    // 画面に収まる大きさ(等倍)を求める。transform-origin が左上なので、中央寄せも平行移動で行う
    const W = box.clientWidth, H = box.clientHeight;
    const iw = img.naturalWidth || 1, ih = img.naturalHeight || 1;
    const r = Math.min(W / iw, H / ih, 1);
    base = { w: iw * r, h: ih * r, x: (W - iw * r) / 2, y: (H - ih * r) / 2 };
    img.style.width = base.w + "px"; img.style.height = base.h + "px";
    img.style.maxWidth = "none"; img.style.maxHeight = "none";
    img.style.position = "absolute"; img.style.left = "0"; img.style.top = "0";
  }
  function clamp() {
    // 拡大した画像が画面より大きいときは端まで、小さいときは中央に固定する
    const W = box.clientWidth, H = box.clientHeight;
    const w = base.w * scale, h = base.h * scale;
    if (w <= W) tx = (W - w) / 2; else tx = Math.min(0, Math.max(W - w, tx));
    if (h <= H) ty = (H - h) / 2; else ty = Math.min(0, Math.max(H - h, ty));
  }
  function apply() {
    clamp();
    img.style.transform = `translate(${tx}px, ${ty}px) scale(${scale})`;
    box.classList.toggle("zoomed", scale > 1.02);
  }
  function reset() { scale = 1; tx = base.x; ty = base.y; apply(); }
  function zoomAt(factor, cx, cy) {
    // 画面上の点 (cx,cy) を固定したまま拡大縮小する
    const s2 = Math.min(MAX, Math.max(1, scale * factor));
    const k = s2 / scale;
    tx = cx - (cx - tx) * k; ty = cy - (cy - ty) * k; scale = s2;
    apply();
  }

  function open(src) {
    img.src = src;
    box.classList.add("open");
    scale = 1;
    const ready = () => { fitBase(); reset(); };
    if (img.complete && img.naturalWidth) ready(); else img.onload = ready;
    try { window.icTrack && window.icTrack("photo_open", {}); } catch (e) {}
  }
  function close() {
    box.classList.remove("open");
    img.src = ""; img.style.transform = ""; ptrs.clear(); pinch0 = null;
  }

  box.addEventListener("pointerdown", (e) => {
    if (e.target.closest("button")) return;
    box.setPointerCapture(e.pointerId);
    ptrs.set(e.pointerId, { x: e.clientX, y: e.clientY });
    moved = false; downAt = Date.now();
    if (ptrs.size === 2) {
      const [a, b] = [...ptrs.values()];
      pinch0 = { d: Math.hypot(a.x - b.x, a.y - b.y), s: scale,
                 cx: (a.x + b.x) / 2, cy: (a.y + b.y) / 2, tx, ty };
    }
    e.preventDefault();
  });
  box.addEventListener("pointermove", (e) => {
    if (!ptrs.has(e.pointerId)) return;
    const prev = ptrs.get(e.pointerId);
    ptrs.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (ptrs.size === 2 && pinch0) {
      // ピンチ: 2本指の中点を固定して距離の比で倍率を変える
      const [a, b] = [...ptrs.values()];
      const d = Math.hypot(a.x - b.x, a.y - b.y);
      const cx = (a.x + b.x) / 2, cy = (a.y + b.y) / 2;
      const s2 = Math.min(MAX, Math.max(1, pinch0.s * d / Math.max(1, pinch0.d)));
      const k = s2 / pinch0.s;
      tx = cx - (pinch0.cx - pinch0.tx) * k; ty = cy - (pinch0.cy - pinch0.ty) * k; scale = s2;
      moved = true; apply();
    } else if (ptrs.size === 1 && scale > 1.02) {
      // ドラッグ: 拡大中だけ動かす
      const dx = e.clientX - prev.x, dy = e.clientY - prev.y;
      if (Math.abs(dx) + Math.abs(dy) > 2) moved = true;
      tx += dx; ty += dy; apply();
    }
    e.preventDefault();
  });
  const up = (e) => {
    if (!ptrs.has(e.pointerId)) return;
    ptrs.delete(e.pointerId);
    if (ptrs.size < 2) pinch0 = null;
    if (ptrs.size === 0 && !moved && Date.now() - downAt < 350) {
      const now = Date.now();
      if (now - lastTap < 320) {
        // ダブルタップ: 等倍⇄2.5倍(タップした場所を中心に)
        if (scale > 1.02) reset(); else zoomAt(2.5, e.clientX, e.clientY);
        lastTap = 0;
      } else {
        lastTap = now;
        // シングルタップ: 等倍で画像の外(背景)なら閉じる。ダブルタップ判定のため少し待つ
        setTimeout(() => {
          if (lastTap !== now) return;
          const onImg = e.clientX >= tx && e.clientX <= tx + base.w * scale && e.clientY >= ty && e.clientY <= ty + base.h * scale;
          if (scale <= 1.02 && !onImg) close();
        }, 330);
      }
    }
  };
  box.addEventListener("pointerup", up);
  box.addEventListener("pointercancel", up);
  box.addEventListener("wheel", (e) => {
    e.preventDefault();
    zoomAt(e.deltaY < 0 ? 1.2 : 1 / 1.2, e.clientX, e.clientY);
  }, { passive: false });
  document.getElementById("lbClose").addEventListener("click", (e) => { e.stopPropagation(); close(); });
  document.getElementById("lbZoomIn").addEventListener("click", (e) => { e.stopPropagation(); zoomAt(1.6, box.clientWidth / 2, box.clientHeight / 2); });
  document.getElementById("lbZoomOut").addEventListener("click", (e) => { e.stopPropagation(); zoomAt(1 / 1.6, box.clientWidth / 2, box.clientHeight / 2); });
  window.addEventListener("resize", () => { if (box.classList.contains("open") && img.naturalWidth) { fitBase(); reset(); } });
  document.addEventListener("keydown", (e) => { if (e.key === "Escape" && box.classList.contains("open")) close(); });
  return { open, close };
})();

// 親子リンク([data-jump])のクリックで対象スポットへ飛ぶ
function bindJumpLinks(root) {
  root.querySelectorAll("[data-jump]").forEach(el => {
    el.addEventListener("click", (e) => {
      e.stopPropagation();
      const target = state.spots.find(s => s.id === el.dataset.jump);
      if (target) jumpToSpot(target);
    });
  });
}

function jumpToSpot(spot) {
  // 検索中はカテゴリ横断で出しているので、タブ切り替えはしない
  if (state.q.trim()) { renderAll(); focusSpot(spot); window.scrollTo({ top: 0, behavior: "smooth" }); return; }
  // 別カテゴリのスポットならタブを切り替える
  const cat = spotCat(spot);
  if (cat !== state.category) {
    state.category = cat;
    document.querySelectorAll(".cat-btn").forEach(b => b.classList.toggle("active", b.dataset.cat === cat));
    syncCatClass();
    populateAreaSelect(state.spots);
  }
  // 現在のフィルタで対象が表示されない場合は「すべて」に戻す
  if (!applyFilters(state.spots).some(s => s.id === spot.id)) {
    state.filter = "all";
    state.areas = new Set();
    state.ages = new Set();
    document.querySelectorAll(".age-btn").forEach(b => b.classList.remove("active"));
    updateAreaBtn();
    document.querySelectorAll(".filter-btn[data-filter]").forEach(b => b.classList.toggle("active", b.dataset.filter === "all"));
    if (state.kidsLevel === 3 ? !isKidsTop(spot) : kidsLevelOf(spot) < state.kidsLevel) setKidsLevel(kidsLevelOf(spot));   // 対象外の段の店へ飛ぶときは段を下げて見えるようにする
  }
  renderAll();
  focusSpot(spot);
  window.scrollTo({ top: 0, behavior: "smooth" });
}

function closeDetail() {
  document.getElementById("detail").classList.remove("open");
  state.selectedId = null;
  renderList();
  updatePinHighlight();
  Sheet.closeDetailMode();   // 一覧に戻す(開く前の段に戻る)
}

function focusSpot(spot) {
  state.selectedId = spot.id;
  renderList();
  updatePinHighlight();
  openDetail(spot);
  if (spot.lat !== null && spot.lng !== null && spot.lat !== undefined && spot.lng !== undefined && window._map) {
    // シートが下半分を覆うので、ピンが見える上半分の真ん中に来るよう上へずらす(offset は一時的で padding と違い残らない)
    window._map.flyTo({ center: [spot.lng, spot.lat], zoom: 15, essential: true, offset: [0, -Math.round(window.innerHeight * 0.2)] });
  }
}

function renderList() {
  const list = document.getElementById("list");
  const countEl = document.getElementById("count");
  // 並び順: NEW(投稿1週間以内) → 赤ピン(訪問済み・登録順のまま) → 青ピン(新しく登録した順)
  // spots.json は追記で増えるので、配列の後ろほど新しい登録(2026-10-07ユーザー要望)
  // 並び: NEW(投稿7日以内) → 最近登録した青ピン(14日以内・新しい順) → 赤ピン(登録順) → 残りの青ピン(新しい順)
  const order = new Map(state.spots.map((s, i) => [s, i]));
  const recentBlue = (s) => !!(s.wish && s.added &&
    (Date.now() - new Date(s.added + "T00:00:00+09:00").getTime()) <= 14 * 24 * 60 * 60 * 1000);
  const rank = (s) => isNew(s) ? 0 : recentBlue(s) ? 1 : !s.wish ? 2 : 3;
  const filtered = applyFilters(state.spots).slice().sort((a, b) =>
    (rank(a) - rank(b)) ||
    (rank(a) === 1 ? (b.added.localeCompare(a.added) || order.get(b) - order.get(a)) :
     a.wish ? order.get(b) - order.get(a) : order.get(a) - order.get(b)));

  countEl.textContent = !state.spots.length ? ""
    : state.q.trim() ? `「${state.q.trim()}」の検索結果 ${filtered.length}件(全カテゴリから)`
    : `${filtered.length}件表示中(全${state.spots.length}件)`;

  if (!state.spots.length) {
    list.innerHTML = `<div class="empty">まだ登録されたお店がありません。<br>data/spots.json に追加すると、ここと地図に表示されます。</div>`;
    return;
  }
  if (!filtered.length) {
    list.innerHTML = state.q.trim()
      ? `<div class="empty">「${escapeHtml(state.q.trim())}」に一致するお店はありませんでした。<br>店名の一部・エリア名・ジャンルでも探せます。</div>`
      : `<div class="empty">条件に合うお店が見つかりませんでした。</div>`;
    return;
  }

  // ★検索中は「結果リスト」を出す【2026-10-23ユーザー要望】
  //   カード(写真・ひとこと付き)だと1画面に2件しか入らず、検索して何が出たのか見渡せない。
  //   店名・ジャンル・市区・札だけの1行にして、店名に当たったものを先頭に並べる。
  //   タップで focusSpot → 地図がその店へ飛んで詳細が開く(詳細の✕で結果リストに戻る)
  if (state.q.trim()) {
    const terms = state.q.split(/[\s　]+/).filter(Boolean).map(normalize).filter(Boolean);
    const nameHit = s => { const n = normalize(s.name); return terms.filter(t => n.includes(t)).length; };
    const sorted = filtered.slice().sort((a, b) =>
      (nameHit(b) - nameHit(a)) || ((a.wish ? 1 : 0) - (b.wish ? 1 : 0)) || (order.get(a) - order.get(b)));
    const hl = (name) => {
      // 一致した語を黄色マーカーで示す(表記ゆれ吸収前の原文に対して、ひらがな/カタカナ・大小文字を無視して探す)
      let html = escapeHtml(name);
      for (const raw of state.q.split(/[\s　]+/).filter(Boolean)) {
        const re = new RegExp(raw.replace(/[.*+?^${}()|[\]\\]/g, "\\$&"), "i");
        if (re.test(html)) { html = html.replace(re, m => `<mark>${m}</mark>`); }
      }
      return html;
    };
    list.innerHTML = `<div class="sr-lead">タップするとその場所へ地図が移動します</div>` + sorted.map(s => {
      const v = s.video || {};
      const tags = [
        isKidsTop(s) ? `<span class="sr-tag k2">🌟子連れ大歓迎</span>` : kidsLevelOf(s) === 2 ? `<span class="sr-tag k2">子連れ歓迎</span>` : kidsLevelOf(s) === 1 ? `<span class="sr-tag k1">子連れ可</span>` : "",
        (v.youtube || v.tiktok || v.instagram) ? `<span class="sr-tag vd">🎬 動画</span>` : "",
        isLimited(s) ? `<span class="sr-tag">⏳ 期間限定</span>` : "",
        (s.lat === null || s.lat === undefined) ? `<span class="sr-tag">📍地図なし</span>` : ""
      ].join("");
      const sub = [s.genre, [s.city, s.area].filter(Boolean).join(" ")].filter(Boolean).join(" ・ ");
      return `<button class="sr-item${s.id === state.selectedId ? " selected" : ""}" data-id="${escapeHtml(s.id)}" type="button">
        <span class="sr-pin">${s.wish ? "🔵" : "🔴"}</span>
        <span class="sr-main">
          <span class="sr-name">${hl(s.name)}</span>
          <span class="sr-sub">${escapeHtml(sub)}</span>
          ${tags ? `<span class="sr-tags">${tags}</span>` : ""}
        </span>
        <span class="sr-go">地図で見る ›</span>
      </button>`;
    }).join("");
    list.querySelectorAll(".sr-item").forEach(el => {
      el.addEventListener("click", () => {
        const spot = state.spots.find(s => s.id === el.dataset.id);
        if (!spot) return;
        document.getElementById("q").blur();     // キーボードを閉じて地図を見せる
        try { window.icTrack && window.icTrack("search_pick", { q: state.q.trim(), id: spot.id }); } catch (e) {}
        focusSpot(spot);
      });
    });
    Sheet.refresh();
    return;
  }

  list.innerHTML = filtered.map(s => `
    <div class="card${s.id === state.selectedId ? " selected" : ""}" data-id="${escapeHtml(s.id)}">
      ${cardHtml(s)}
    </div>
  `).join("");

  list.querySelectorAll(".card").forEach(el => {
    el.addEventListener("click", () => {
      const spot = state.spots.find(s => s.id === el.dataset.id);
      if (spot) {
        focusSpot(spot);
        // リストから選んだら地図までスクロールで戻す(ハイライトを見せる)
        window.scrollTo({ top: 0, behavior: "smooth" });
      }
    });
  });
  bindJumpLinks(list);
  Sheet.refresh();   // 先頭カードの高さで peek の高さが決まる
}

// 同じ場所に集まったピンは1つにまとめ、中に件数を出す。
// 福岡空港やモールのように「1施設に何十軒も入る」場所で、
// ピンが積み重なってタップできなくなるのを防ぐ目的。
const CLUSTER_PX = 44;   // この画素数より近いピン同士はまとめる

// 期間限定の情報は2種類ある。
//  campaign … 常設の店で開催中のコラボ(スシロー×キティ等)。終わっても店は残るので
//             会期が切れたら campaign だけ無効化し、スポット自体は残す
//  until    … スポットそのものが期間限定(企画展など)。会期が切れたら地図から消す
function campaignOf(spot) {
  const c = spot.campaign;
  if (!c || !c.until) return null;
  const d = new Date(c.until + "T23:59:59+09:00");
  if (isNaN(d) || d < new Date()) return null;   // 終わったコラボは無かったことにする
  return c;
}
function isEventOnly(spot) { return !!spot.until; }
function isLimited(spot) { return isEventOnly(spot) || !!campaignOf(spot); }

/* ───────── 九州ふっこう応援割(2026-10-01 宿泊分〜) ─────────
   国交省155億円を九州7県に配分する旅行支援。

   ⚠**2つの別物を混同しないこと**(2026-09-15に実地で確認):
     ① 対象施設かどうか … **宿ごとに参加登録する方式**。同じ県でも未参加の宿は対象外
     ② クーポン枠       … **県単位の予算**。上限に達すると、対象施設であっても
                          予約画面に「当該都道府県の…クーポンは予算上限に達したため停止」と出て
                          割引が使えなくなる
   熊本・長崎は 2026-09-15 10:00 に販売開始し、**同日のうちにじゃらん・楽天とも枠が尽きた**。
   なので「対象」と出すだけでは予約できると誤解させる。帯に②の注意を必ず併記する。

   ⚠**対象施設の一覧は県によって公表されている**(memoryの「公表されない」は誤り):
     熊本県 https://kumamoto-ouenwari.com/yoshiki/ichiran.pdf … 295施設。tools/fukko_apply_official.py で突合
     長崎県 … 一覧の公表なし
   ⚠**じゃらんは特設ページ型**(対象宿を選ぶと支払画面で自動割引)なので、
     宿ページに「応援割プラン」は並ばない。tools/fukko_watch.py の判定はこれを外す。

   データ形は spots.json の宿に:
     "fukko": { "checked":"2026-09-15", "url":"<宿のじゃらんURL>",
                "official":"<公式一覧での表記>", "source":"<出典URL>", "note":"任意" }
   fukko が無い = 未確認。**勝手に対象扱いしない**(誤情報で予約させないため) */
const FUKKO_RATE = {           // 県 → 割引率(%)
  熊本県: 60, 鹿児島県: 60,
  福岡県: 50, 佐賀県: 50, 長崎県: 50, 大分県: 50, 宮崎県: 50,
};
// クーポンの残りを見に行く先。**枠は県単位でサイトごとに別配分**なので両方出す
const FUKKO_RAKUTEN = {
  熊本県: "kumamoto", 鹿児島県: "kagoshima", 福岡県: "fukuoka",
  佐賀県: "saga", 長崎県: "nagasaki", 大分県: "oita", 宮崎県: "miyazaki",
};
const FUKKO_JALAN = "https://www.jalan.net/kyushu-shien/";
const FUKKO_START = "2026-10-01";
function fukkoRate(spot) { return FUKKO_RATE[spot.pref] || null; }
// 「対象と確認できた宿」だけ true。県が対象でも確認前は false のまま
function isFukko(spot) {
  return !!(spot.fukko && fukkoRate(spot));
}
// まだ始まっていない期間なら「10月1日から」と出したいので開始前か判定する
function fukkoNotStarted() {
  return new Date() < new Date(FUKKO_START + "T00:00:00+09:00");
}
// カード先頭の帯。割引率と上限は県から自動で決まるので手入力しない
function fukkoHtml(spot) {
  if (!isFukko(spot)) return "";
  const r = fukkoRate(spot);
  const f = spot.fukko;
  const head = fukkoNotStarted() ? "10月1日の宿泊分から対象" : "九州ふっこう応援割の対象施設";
  const rk = FUKKO_RAKUTEN[spot.pref];
  // ⚠「対象施設」と「いま予約できるか」は別。枠は**県単位**で尽きるので必ず併記する
  return `<div class="fk-band">
      <span class="fk-icon">🏨</span>
      <span class="fk-main">${head}</span>
      <span class="fk-rate">${r}%OFF</span>
      <span class="fk-sub">上限 1人あたり 宿泊のみ2万円 / 交通付き2泊以上3万円 / 2県以上3万5千円</span>
      <span class="fk-caution">⚠クーポン枠は<b>${escapeHtml(spot.pref || "県")}単位</b>で、上限に達すると対象施設でも割引が出ません。<b>予約サイトごとに別枠</b>なので、片方が終了でも他方に残っていることがあります</span>
      ${f.note ? `<span class="fk-note">${escapeHtml(f.note)}</span>` : ""}
      <span class="fk-links">クーポンの残りを確認:
        <a href="${FUKKO_JALAN}" rel="nofollow noopener" target="_blank">じゃらん</a>
        ${rk ? ` / <a href="https://travel.rakuten.co.jp/special/kyushuouen/${rk}/" rel="nofollow noopener" target="_blank">楽天トラベル</a>` : ""}
      </span>
      ${f.url ? `<a class="ltd-link" href="${escapeHtml(f.url)}" rel="nofollow noopener" target="_blank">この宿を見る</a><span class="pr-badge">PR</span>` : ""}
    </div>`;
}
function isExpired(spot) {
  if (!spot.until) return false;                 // campaign は期限切れでもスポットは残す
  const d = new Date(spot.until + "T23:59:59+09:00");
  return !isNaN(d) && d < new Date();
}
// 残り日数(campaign を優先。過ぎていれば負)
function daysLeft(spot) {
  const c = campaignOf(spot);
  const u = c ? c.until : spot.until;
  if (!u) return null;
  const d = new Date(u + "T23:59:59+09:00");
  return Math.ceil((d - new Date()) / 86400000);
}
function limitedLabel(spot) {
  const c = campaignOf(spot);
  if (c) return c.label || c.title || "コラボ開催中";
  return (spot.untilLabel || spot.until) + "まで";
}

function makePinEl(spot) {
  const el = document.createElement("div");
  el.className = "pin";
  // ピンの色は「行った(赤)/調べた(青)」を必ず保つ。期間限定は金リングで足す
  el.style.background = spot.wish ? "#2b5cc4" : "#d63031";
  if (isEventOnly(spot)) el.classList.add("pin-eventonly");
  if (isKidsTop(spot)) {
    const st = document.createElement("span");
    st.className = "pin-top-label";
    st.textContent = "🌟";
    el.appendChild(st);
  }
  if (!isLimited(spot) && isFukko(spot)) {
    el.classList.add("pin-fukko");
    const fl = document.createElement("span");
    fl.className = "pin-fukko-label";
    fl.textContent = "🏨";
    el.appendChild(fl);
  }
  if (isLimited(spot)) {
    el.classList.add("pin-campaign");
    const lab = document.createElement("span");
    lab.className = "pin-campaign-label";
    lab.textContent = campaignOf(spot) ? "🤝" : "⏳";
    el.appendChild(lab);
  }
  if (isNew(spot)) {
    el.classList.add("pin-new");
    const lab = document.createElement("span");
    lab.className = "pin-new-label";
    lab.textContent = "NEW";
    el.appendChild(lab);
  }
  return el;
}

function makeClusterEl(items) {
  const el = document.createElement("div");
  el.className = "pin-cluster";
  // 訪問済み(赤)の割合をリングで出す。
  // 以前は「全員が訪問済みでないと赤にしない」判定だったため、広域で
  // まとめられると必ず青になり、実績が無いマップに見えてしまっていた。
  // 赤429/青967 なので多数決でも青に倒れる。割合をそのまま見せるのが正しい
  const red = items.filter(s => !s.wish).length;
  const pct = Math.round((red / items.length) * 100);
  el.style.background =
    `conic-gradient(#d63031 0 ${pct}%, #2b5cc4 ${pct}% 100%)`;
  const inner = document.createElement("span");
  inner.className = "pc-inner";
  inner.textContent = items.length;
  // 中の丸は「1件でも行っていれば赤」。行った実績がある場所だと分かるようにする
  if (red > 0) inner.classList.add("pc-red");
  el.appendChild(inner);
  el.title = `${items.length}件のうち ${red}件は訪問済み`;
  return el;
}

function renderMarkers() {
  clearMarkers();
  const map = window._map;
  if (!map) return;
  const filtered = applyFilters(state.spots).filter(s => s.lat !== null && s.lng !== null && s.lat !== undefined && s.lng !== undefined);

  // ① まず「同じ施設に入っている店」を1つの単位にまとめる。
  //    施設を最小単位として扱うので、いくらズームしてもここは分散させない
  //    (福岡空港のように1棟に何十軒も入る場所は、バラすと同じ施設だと分からなくなるため)
  const byParent = {};
  const singles = [];
  filtered.forEach(s => {
    if (s.in && state.spots.some(p => p.id === s.in)) {
      (byParent[s.in] = byParent[s.in] || []).push(s);
    } else singles.push(s);
  });
  const units = [];   // {items, lat, lng, facility}
  Object.keys(byParent).forEach(pid => {
    const kids = byParent[pid];
    if (kids.length === 1) { singles.push(kids[0]); return; }
    const par = state.spots.find(p => p.id === pid);
    units.push({
      items: kids, facility: par || null,
      lat: par ? par.lat : kids.reduce((a, s) => a + s.lat, 0) / kids.length,
      lng: par ? par.lng : kids.reduce((a, s) => a + s.lng, 0) / kids.length
    });
  });
  singles.forEach(s => units.push({ items: [s], facility: null, lat: s.lat, lng: s.lng }));

  // ② その上で、画面上で近い単位同士をまとめる(ズームすれば単位ごとにほどける)
  const pts = units.map(u => ({ u, pt: map.project([u.lng, u.lat]) }));
  const used = new Array(pts.length).fill(false);
  const groups = [];
  for (let i = 0; i < pts.length; i++) {
    if (used[i]) continue;
    const g = [pts[i]];
    used[i] = true;
    for (let j = i + 1; j < pts.length; j++) {
      if (used[j]) continue;
      const dx = pts[i].pt.x - pts[j].pt.x, dy = pts[i].pt.y - pts[j].pt.y;
      if (dx * dx + dy * dy < CLUSTER_PX * CLUSTER_PX) { g.push(pts[j]); used[j] = true; }
    }
    groups.push(g);
  }

  groups.forEach(g => {
    const us = g.map(x => x.u);
    const items = us.flatMap(u => u.items);
    const lng = us.reduce((a, u) => a + u.lng, 0) / us.length;
    const lat = us.reduce((a, u) => a + u.lat, 0) / us.length;

    if (items.length === 1) {
      const spot = items[0];
      const el = makePinEl(spot);
      const marker = new maplibregl.Marker({ element: el }).setLngLat([spot.lng, spot.lat]).addTo(map);
      el.addEventListener("click", (ev) => { ev.stopPropagation(); focusSpot(spot); });
      state.markers.push({ spot, marker });
      return;
    }
    // 単位が1つだけ = 同じ施設のまとまり。ズームしても割れないので、押したら必ずリストを出す
    const soleFacility = us.length === 1 && us[0].facility ? us[0].facility : null;
    const el = makeClusterEl(items);
    if (soleFacility) el.classList.add("pc-facility");
    const marker = new maplibregl.Marker({ element: el }).setLngLat([lng, lat]).addTo(map);
    el.addEventListener("click", (ev) => {
      ev.stopPropagation();
      if (soleFacility) showClusterList(items, soleFacility);
      else openCluster(items, [lng, lat]);
    });
    state.markers.push({ spot: null, items, marker });
  });
  updatePinHighlight();
}

// まとめたピンをタップしたとき。まだ広げられるならズームし、
// これ以上ズームしても離れない(同じ建物内など)ならリストを出す
function openCluster(items, center) {
  const map = window._map;
  const z = map.getZoom();
  const spread = Math.max(
    ...items.map(a => Math.max(...items.map(b => Math.abs(a.lat - b.lat) + Math.abs(a.lng - b.lng))))
  );
  if (z < 17.5 && spread > 0.0004) {
    map.flyTo({ center, zoom: Math.min(18, z + 2.5), essential: true });
    return;
  }
  showClusterList(items);
}

function showClusterList(items, facility) {
  const box = document.getElementById("clusterBox");
  const parent = facility || (items[0].in ? state.spots.find(s => s.id === items[0].in) : null);
  const sameParent = parent && items.every(s => s.in === parent.id);
  document.getElementById("clusterTitle").textContent =
    sameParent ? `${parent.name} 内のスポット` : "この場所のスポット";
  document.getElementById("clusterCount").textContent = `${items.length}件`;
  // ⚠**施設そのもの(親)の行を必ず先頭に出す**【2026-09-21ユーザー指摘】。
  //   親のカテゴリは1つしか持てないので、例えばイオンモール香椎浜(play)を
  //   「お食事」タブで見ると**子の飲食店だけが並んで親が出てこない**。
  //   ベビールームや駐車場といった**施設側の情報にたどり着けない**ので、
  //   タブに関係なく先頭に固定する。件数は子の数のままにする(親は別枠なので数えない)。
  const facilityRow = (sameParent && !items.some(s => s.id === parent.id))
    ? `<button class="cl-item cl-facility" data-cid="${escapeHtml(parent.id)}">
         <span class="cl-top">
           <span class="cl-name">🏬 ${escapeHtml(parent.name)}</span>
           <span class="cl-genre">施設の情報</span>
         </span>
         <span class="cl-tags">
           ${isKidsTop(parent) ? `<span class="cl-tag t-kids">🌟子連れ大歓迎</span>` : kidsLevelOf(parent) === 2 ? `<span class="cl-tag t-kids">子連れ歓迎</span>` : kidsLevelOf(parent) === 1 ? `<span class="cl-tag t-kids1">子連れ可</span>` : ""}
           ${(parent.photos || []).length ? `<span class="cl-tag t-photo">📷 写真${parent.photos.length}枚</span>` : ""}
           <span class="cl-tag t-open">授乳室・トイレなど ›</span>
         </span>
       </button>`
    : "";
  document.getElementById("clusterList").innerHTML = facilityRow + items
    // 動画あり > 訪問済み > 子連れOK を上に。同条件ならジャンル順
    .slice().sort((a, b) => {
      const sc = s => {
        const v = s.video || {};
        return ((v.youtube || v.tiktok || v.instagram) ? 4 : 0) + (!s.wish ? 2 : 0) + (kidsLevelOf(s) === 2 ? 1 : 0);
      };
      return sc(b) - sc(a) || (a.genre || "").localeCompare(b.genre || "", "ja");
    })
    .map(s => {
      const v = s.video || {};
      const tags = [
        s.wish ? `<span class="cl-tag t-wish">🔵 下調べ済み</span>`
               : `<span class="cl-tag t-visited">🔴 訪問済み</span>`,
        isLimited(s) ? `<span class="cl-tag t-ltd">${campaignOf(s) ? "🤝 コラボ中" : "⏳ 期間限定"}</span>` : "",
        isFukko(s) ? `<span class="cl-tag t-fk">🏨 復興割${fukkoRate(s)}%OFF</span>` : "",
        isKidsTop(s) ? `<span class="cl-tag t-kids">🌟子連れ大歓迎</span>` : kidsLevelOf(s) === 2 ? `<span class="cl-tag t-kids">子連れ歓迎</span>` : kidsLevelOf(s) === 1 ? `<span class="cl-tag t-kids1">子連れ可</span>` : "",
        (v.youtube || v.tiktok || v.instagram) ? `<span class="cl-tag t-video">🎬 動画あり</span>` : ""
      ].join("");
      return `<button class="cl-item" data-cid="${escapeHtml(s.id)}">
        <span class="cl-top">
          <span class="cl-name">${escapeHtml(s.name)}</span>
          <span class="cl-genre">${escapeHtml(s.genre || "")}</span>
        </span>
        <span class="cl-tags">${tags}</span>
      </button>`;
    }).join("");
  box.querySelectorAll("[data-cid]").forEach(b => {
    b.addEventListener("click", () => {
      const sp = state.spots.find(x => x.id === b.dataset.cid);
      box.classList.remove("open");
      if (!sp) return;
      // ⚠**今のタブに載っていないスポットは `jumpToSpot` で開く**(2026-09-21)。
      //   施設の行は別カテゴリのことがあり(お食事タブ→イオンモールは遊び場)、
      //   `focusSpot` だけだと次の renderAll で詳細カードが閉じてしまう。
      //   `jumpToSpot` はタブと絞り込みを対象に合わせてから開く。
      if (applyFilters(state.spots).some(x => x.id === sp.id)) focusSpot(sp);
      else jumpToSpot(sp);
    });
  });
  box.classList.add("open");
}

function renderAll() {
  // フィルタ変更で選択中の店が対象外になったら詳細カードを閉じる
  if (state.selectedId !== null && !applyFilters(state.spots).some(s => s.id === state.selectedId)) {
    document.getElementById("detail").classList.remove("open");
    state.selectedId = null;
    Sheet.closeDetailMode();
  }
  renderMarkers();
  renderList();
}

function initMap(spots) {
  const withCoords = spots.filter(s => s.lat !== null && s.lng !== null && s.lat !== undefined && s.lng !== undefined);
  // ターゲットは福岡県民のため、初期表示は常に福岡県(福岡都市圏中心)
  const center = [130.45, 33.55];

  const map = new maplibregl.Map({
    container: "map",
    style: {
      version: 8,
      sources: {
        osm: {
          type: "raster",
          tiles: ["https://tile.openstreetmap.org/{z}/{x}/{y}.png"],
          tileSize: 256,
          attribution: "&copy; OpenStreetMap contributors"
        }
      },
      layers: [
        { id: "osm", type: "raster", source: "osm" }
      ]
    },
    center: center,
    zoom: 8.7
  });
  map.addControl(new maplibregl.NavigationControl({ showCompass: false }), "top-right");
  // 現在地ボタン(Googleマップ風。押すと現在地へ移動+青ドット表示)
  const geolocate = new maplibregl.GeolocateControl({
    positionOptions: { enableHighAccuracy: true },
    trackUserLocation: true,
    showUserLocation: true,
    fitBoundsOptions: { maxZoom: 13 }
  });
  map.addControl(geolocate, "top-right");
  window._map = map;

  // ズーム/移動のたびにまとめ直す(寄れば自然にピンがほどける)
  let _reMark = null;
  map.on("moveend", () => {
    clearTimeout(_reMark);
    _reMark = setTimeout(() => { if (state.spots.length) renderMarkers(); }, 120);
  });

  map.on("load", () => {
    renderAll();
    // 開いた時に現在地を中央へ(位置情報が許可されている場合のみ。拒否時は福岡全域表示のまま)
    try { geolocate.trigger(); } catch (e) {}
  });
  map.on("click", (e) => {
    // 地図の空きエリアタップで詳細カードを閉じる
    if (state.selectedId !== null) closeDetail();
  });
}


// ===== 市区パネル =====
document.getElementById("areaBtn").addEventListener("click", () => {
  populateAreaSelect(state.spots);
  document.getElementById("areaBack").classList.add("open");
});
document.getElementById("areaBack").addEventListener("click", (e) => {
  if (e.target.id === "areaBack") document.getElementById("areaBack").classList.remove("open");
});
document.getElementById("areaClear").addEventListener("click", () => {
  state.areasDraft = new Set();
  document.querySelectorAll("#areaListBox input[type=checkbox]").forEach(cb => cb.checked = false);
});
document.getElementById("areaApply").addEventListener("click", () => {
  state.areas = new Set(state.areasDraft);
  document.getElementById("areaBack").classList.remove("open");
  updateAreaBtn();
  renderAll();
});

// 検索ボックス。入力のたびに全件から絞り込む(件数が1000弱なので遅延不要)
const qInput = document.getElementById("q");
const qClear = document.getElementById("qClear");
let _fitTimer = null;
function applyQuery() {
  const was = state.q.trim();
  state.q = qInput.value;
  qClear.classList.toggle("on", !!state.q);
  // 検索中はカテゴリ・絞り込みの見た目を無効化して、全件検索であることを示す
  document.querySelector(".cat-toggle").style.opacity = state.q.trim() ? .4 : "";
  document.querySelector(".filters").style.opacity = state.q.trim() ? .4 : "";
  document.body.classList.toggle("searching", !!state.q.trim());
  renderAll();
  // ★検索したら「何が起きたか」が見えるようにする【2026-10-23ユーザー要望】
  //   それまでは絞り込んだピンが立つだけで、シートは peek(先頭1枚)のまま・地図も動かなかった。
  //   ①シートを half に上げて結果リストを見せる ②結果のピンが全部入る範囲へ地図を寄せる
  //   ③検索語を消したら peek に戻す(地図はそのまま)
  if (state.q.trim()) {
    if (Sheet.mode === "detail") closeDetail();
    if (Sheet.state === "peek") Sheet.set("half");
    clearTimeout(_fitTimer);
    _fitTimer = setTimeout(fitToResults, 250);     // 1文字ごとに飛ばさない
  } else if (was) {
    clearTimeout(_fitTimer);
    if (Sheet.mode !== "detail") Sheet.set("peek");
  }
}
function fitToResults() {
  const map = window._map;
  if (!map || !state.q.trim()) return;
  const pts = applyFilters(state.spots).filter(s => s.lat !== null && s.lat !== undefined && s.lng !== null && s.lng !== undefined);
  if (!pts.length) return;
  // シートが画面の下52%を覆うので、その分を下の余白にしてピンが隠れないようにする
  const sheetH = document.getElementById("bsheet").offsetHeight || Math.round(window.innerHeight * 0.52);
  const mapH = document.getElementById("map").offsetHeight || window.innerHeight;
  const bottom = Math.min(sheetH + 24, Math.max(0, mapH - 120));
  if (pts.length === 1) {
    map.flyTo({ center: [pts[0].lng, pts[0].lat], zoom: 15, essential: true, offset: [0, -Math.round(bottom / 2)] });
    return;
  }
  const b = new maplibregl.LngLatBounds();
  pts.forEach(s => b.extend([s.lng, s.lat]));
  map.fitBounds(b, { padding: { top: 24, left: 24, right: 24, bottom }, maxZoom: 15, duration: 600, essential: true });
}
qInput.addEventListener("input", applyQuery);
// Enter(キーボードの🔍)で確定したらキーボードを閉じて、地図と結果リストを見せる
qInput.addEventListener("search", () => { applyQuery(); if (state.q.trim()) { qInput.blur(); clearTimeout(_fitTimer); fitToResults(); } });
qInput.addEventListener("keydown", (e) => { if (e.key === "Enter") { e.preventDefault(); qInput.blur(); applyQuery(); clearTimeout(_fitTimer); fitToResults(); } });
qClear.addEventListener("click", () => { qInput.value = ""; applyQuery(); qInput.focus(); });

// タブに応じて body に cat-gourmet / cat-onsen / cat-play を付ける。
// 温泉専用フィルタと年齢の行の表示切替がこのクラスを見る。年齢の行が隠れるタブへ移ったら
// 年齢の選択も解除する(見えないフィルタが効いたままにしない)(2026-10-12)
function syncCatClass() {
  ["gourmet", "onsen", "play"].forEach(c => document.body.classList.toggle("cat-" + c, state.category === c));
  if (state.ages.size && !["play", "onsen"].includes(state.category)) {
    state.ages = new Set();
    document.querySelectorAll(".age-btn").forEach(b => b.classList.remove("active"));
  }
}
syncCatClass();

document.querySelectorAll(".cat-btn").forEach(btn => {
  btn.addEventListener("click", () => {
    document.querySelectorAll(".cat-btn").forEach(b => b.classList.remove("active"));
    btn.classList.add("active");
    state.category = btn.dataset.cat;
    syncCatClass();
    // 温泉タブ専用フィルタを選んだまま他タブへ移ったら「すべて」に戻す
    if (state.category !== "onsen" && (state.filter === "dayuse" || state.filter === "stay" || state.filter === "fukko")) {
      state.filter = "all";
      document.querySelectorAll(".filter-btn[data-filter]").forEach(b => b.classList.toggle("active", b.dataset.filter === "all"));
    }
    populateAreaSelect(state.spots);
    renderAll();
  });
});

// 対象年齢: トグル式・複数選択可
document.querySelectorAll(".age-btn").forEach(btn => {
  btn.addEventListener("click", () => {
    const a = btn.dataset.age;
    if (state.ages.has(a)) state.ages.delete(a); else state.ages.add(a);
    btn.classList.toggle("active", state.ages.has(a));
    renderAll();
  });
});

// 絞り込みピル(data-filter を持つものだけ。子連れOKと市区は別扱い)
// 2026-10-14: 顧客画面には「すべて」が無いので、ONのピルをもう一度押すと「すべて」に戻る
document.querySelectorAll(".filter-btn[data-filter]").forEach(btn => {
  btn.addEventListener("click", () => {
    const next = (state.filter === btn.dataset.filter && btn.dataset.filter !== "all") ? "all" : btn.dataset.filter;
    state.filter = next;
    document.querySelectorAll(".filter-btn[data-filter]").forEach(b => b.classList.toggle("active", b.dataset.filter === next));
    populateAreaSelect(state.spots);
    renderAll();
  });
});

// ★子連れボタン(2026-10-19): 押すたびに 歓迎 → 可まで → すべて → 歓迎…
const KIDS_BTN_LABEL = { 3: "🌟 子連れ大歓迎", 2: "👪 子連れ歓迎", 1: "🙆 子連れ可まで", 0: "👪 すべて" };
function setKidsLevel(lv) {
  state.kidsLevel = lv;
  state.kidsOnly = lv > 0;   // 旧フラグ(他の箇所の参照用)
  const b = document.getElementById("kidsBtn");
  if (b) {
    b.textContent = KIDS_BTN_LABEL[lv];
    b.classList.toggle("active", lv > 0);
    b.classList.toggle("kids-lv1", lv === 1);
    b.setAttribute("aria-pressed", String(lv > 0));
  }
}
function setKidsOnly(on) { setKidsLevel(on ? 2 : 0); }
document.getElementById("kidsBtn").addEventListener("click", () => {
  // 歓迎 → 可まで → すべて → 大歓迎 → 歓迎…(2026-10-27 大歓迎をお客さんにも公開)
  const lv = state.kidsLevel;
  setKidsLevel(lv === 3 ? 2 : lv === 2 ? 1 : lv === 1 ? 0 : 3);
  try { window.icTrack && window.icTrack("kids_toggle", { on: state.kidsLevel }); } catch (e) {}
  populateAreaSelect(state.spots);
  renderAll();
});

// ★🔍で検索欄を出し入れ。文字が入っているあいだは閉じない(閉じるには✕で消す)
document.getElementById("searchToggle").addEventListener("click", () => {
  const h = document.querySelector("header");
  const open = !h.classList.contains("search-open");
  if (!open && state.q.trim()) { document.getElementById("q").focus(); return; }
  h.classList.toggle("search-open", open);
  const t = document.getElementById("searchToggle");
  t.classList.toggle("on", open); t.setAttribute("aria-expanded", String(open));
  if (open) setTimeout(() => document.getElementById("q").focus(), 50);
});

// ★運用モード(?admin=1 で入り、?admin=0 で抜ける。localStorage に記憶)
(function () {
  const p = new URLSearchParams(location.search).get("admin");
  try {
    if (p === "1") localStorage.setItem("map_admin", "1");
    if (p === "0") localStorage.removeItem("map_admin");
    if (localStorage.getItem("map_admin") === "1") {
      document.body.classList.add("admin");
      setKidsOnly(false);   // 運用時は全件から始める(下調べの店も見たい)
    }
  } catch (e) {}
})();



// URL の #spot=<id> で来たときに、そのスポットのカードを開く。
// スポット個別ページの「地図で見る」ボタンと、SNS投稿からの直リンクがここを通る。
// ⚠この処理が無く、スポットページ1,600枚超の「地図で見る」が効いていなかった(2026-09-10に発覚)。
// タブ(お食事/宿・温泉/遊び場)や絞り込みで対象外になっていると開けないので、
// スポットのカテゴリへタブを切り替え、絞り込みとエリアは「すべて」に戻してから開く。
// (例: 公園は play タブなので、初期表示の gourmet タブのままでは見えない)
function openFromHash() {
  const m = /(?:^|[#&])spot=([^&]+)/.exec(location.hash || "");
  if (!m) return;
  let id;
  try { id = decodeURIComponent(m[1]); } catch (e) { id = m[1]; }
  const sp = state.spots.find(s => s.id === id);
  if (!sp) return;

  const cats = spotCats(sp);
  if (!cats.includes(state.category)) {
    state.category = cats[0];
    document.querySelectorAll(".cat-btn").forEach(b =>
      b.classList.toggle("active", b.dataset.cat === state.category));
    syncCatClass();
  }
  state.q = "";
  state.filter = "all";
  document.querySelectorAll(".filter-btn[data-filter]").forEach(b =>
    b.classList.toggle("active", b.dataset.filter === "all"));
  state.areas.clear();
  state.areasDraft.clear();
  if (state.kidsLevel === 3 ? !isKidsTop(sp) : kidsLevelOf(sp) < state.kidsLevel) setKidsLevel(kidsLevelOf(sp));   // 対象外の段の店へ飛ぶときは段を下げて見えるようにする
  populateAreaSelect(state.spots);
  renderAll();
  focusSpot(sp);
}

window.addEventListener("hashchange", openFromHash);

// ★「ホーム画面に追加」の案内(a2hs = add to home screen)【2026-10-14】
//   出す条件: ホーム画面起動でない / 30日以内に✕していない / 詳細を1回開いた or 12秒経過
//   文言: アプリ内ブラウザ(Instagram/TikTok/Facebook/LINE)→「ブラウザで開く」案内
//         iPhone の Safari → 共有ボタンの手順 / それ以外 → beforeinstallprompt があれば「追加する」ボタン
//   送る解析イベント: a2hs_shown(kind) / a2hs_click / a2hs_dismiss
(function () {
  const box = document.getElementById("a2hs");
  if (!box) return;
  const KEY = "a2hs_dismissed_at";
  const standalone = (window.matchMedia && window.matchMedia("(display-mode: standalone)").matches) || navigator.standalone === true;
  let dismissedAt = 0;
  try { dismissedAt = Number(localStorage.getItem(KEY)) || 0; } catch (e) {}
  if (standalone || Date.now() - dismissedAt < 30 * 864e5) { window.showA2hs = function () {}; return; }

  const ua = navigator.userAgent || "";
  const inApp = /Instagram|FBAN|FBAV|FB_IAB|TikTok|musical_ly|BytedanceWebview|Line\//i.test(ua);
  const ios = /iPhone|iPad|iPod/.test(ua);
  const text = document.getElementById("a2hsText");
  const btn = document.getElementById("a2hsBtn");
  let deferred = null;
  window.addEventListener("beforeinstallprompt", e => { e.preventDefault(); deferred = e; if (!box.hidden) btn.hidden = false; });

  let kind;
  if (inApp) { kind = "inapp"; text.textContent = "ブラウザで開くとホーム画面に追加できます(右上の「…」→ ブラウザで開く)。次からすぐ開けます"; }
  else if (ios) { kind = "ios"; text.textContent = "共有ボタン(□↑)→「ホーム画面に追加」で、次からアプリのようにすぐ開けます"; }
  else { kind = "other"; text.textContent = "ホーム画面に追加すると、次からアプリのようにすぐ開けます"; }

  let shown = false;
  window.showA2hs = function (why) {
    if (shown) return;
    shown = true;
    box.hidden = false;
    if (deferred) btn.hidden = false;
    try { Sheet.refresh(); } catch (e) {}
    try { window.icTrack && window.icTrack("a2hs_shown", { kind: kind, why: why || "" }); } catch (e) {}
  };
  setTimeout(() => window.showA2hs("timer"), 12000);

  btn.addEventListener("click", async () => {
    try { window.icTrack && window.icTrack("a2hs_click", { kind: kind }); } catch (e) {}
    if (!deferred) return;
    deferred.prompt();
    try { await deferred.userChoice; } catch (e) {}
    deferred = null; btn.hidden = true;
  });
  document.getElementById("a2hsClose").addEventListener("click", () => {
    box.hidden = true;
    try { Sheet.refresh(); } catch (e) {}
    try { localStorage.setItem(KEY, String(Date.now())); } catch (e) {}
    try { window.icTrack && window.icTrack("a2hs_dismiss", { kind: kind }); } catch (e) {}
  });
})();

(async function main() {
  const spots = await loadSpots();
  state.spots = spots;
  populateAreaSelect(spots);
  initMap(spots);
  if (!spots.length) {
    renderList();
  }
  openFromHash();
  Sheet.refresh();
  // header の高さが変わったら(🔍の開閉・タブで年齢行が出入り)地図の大きさとシートの段を合わせ直す
  if (window.ResizeObserver) {
    new ResizeObserver(() => { try { window._map && window._map.resize(); } catch (e) {} Sheet.refresh(); })
      .observe(document.querySelector("header"));
  }
})();
</script>
