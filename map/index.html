<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>福岡グルメマップ</title>
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">
<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<style>
  :root {
    --accent: #d63031;
    --accent-soft: #ffe3e3;
    --text: #222;
    --muted: #767676;
    --border: #e5e5e5;
    --bg: #fafafa;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    font-family: "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans JP", "Yu Gothic", Meiryo, sans-serif;
    color: var(--text);
    background: var(--bg);
    -webkit-text-size-adjust: 100%;
  }
  header {
    position: sticky; top: 0; z-index: 20;
    background: #fff;
    border-bottom: 1px solid var(--border);
    padding: 10px 12px 8px;
  }
  h1 {
    font-size: 15px;
    margin: 0 0 8px;
    font-weight: 700;
    color: var(--text);
  }
  .cat-toggle {
    display: flex;
    gap: 0;
    margin-bottom: 8px;
    border: 1px solid var(--border);
    border-radius: 10px;
    overflow: hidden;
    width: fit-content;
  }
  .cat-btn {
    border: none;
    background: #fff;
    color: var(--text);
    padding: 8px 16px;
    font-size: 13px;
    font-weight: 700;
    cursor: pointer;
  }
  .cat-btn.active {
    background: #2d3436;
    color: #fff;
  }
  .b-new {
    display: inline-block;
    margin-right: 6px;
    font-size: 11px;
    font-weight: 800;
    background: #ffd32a;
    color: #6d4c00;
    border-radius: 999px;
    padding: 2px 9px;
    animation: newpulse 1.6s ease-in-out infinite;
  }
  @keyframes newpulse {
    0%, 100% { opacity: 1; }
    50% { opacity: .55; }
  }
  .pin-new {
    animation: pinpulse 1.6s ease-in-out infinite;
  }
  @keyframes pinpulse {
    0%, 100% { box-shadow: 0 1px 3px rgba(0,0,0,.4), 0 0 0 0 rgba(255,211,42,.9); }
    50% { box-shadow: 0 1px 3px rgba(0,0,0,.4), 0 0 0 9px rgba(255,211,42,0); }
  }
  .pin-new-label {
    position: absolute;
    top: -14px;
    left: 10px;
    transform: rotate(45deg);
    background: #ffd32a;
    color: #6d4c00;
    font-size: 9px;
    font-weight: 800;
    border-radius: 6px;
    padding: 0 4px;
    line-height: 14px;
    pointer-events: none;
  }
  .card-bath {
    margin-top: 6px;
    font-size: 12px;
    color: #b05a00;
    background: #fff3e3;
    border-radius: 8px;
    padding: 4px 8px;
    display: inline-block;
  }
  .filters {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
    align-items: center;
  }
  .filter-btn {
    border: 1px solid var(--border);
    background: #fff;
    color: var(--text);
    padding: 7px 14px;
    border-radius: 999px;
    font-size: 13px;
    white-space: nowrap;
    cursor: pointer;
  }
  .filter-btn.active {
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
  }
  #map {
    width: 100%;
    height: 46vh;
    min-height: 260px;
  }
  #count {
    font-size: 12px;
    color: var(--muted);
    padding: 8px 14px 0;
  }
  #list {
    padding: 8px 10px 40px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .card {
    background: #fff;
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 12px 14px;
    cursor: pointer;
    transition: box-shadow .15s, border-color .15s;
    display: flex;
    gap: 12px;
    align-items: flex-start;
  }
  .card-thumb {
    flex: 0 0 64px;
    width: 64px;
    height: 84px;
    object-fit: cover;
    border-radius: 8px;
    background: var(--border);
  }
  /* サムネが無い店の「のれん風」プレースホルダー */
  .ph {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 3px;
    position: relative;
    overflow: hidden;
    color: #fff;
  }
  .ph::before {
    content: "";
    position: absolute; inset: 0;
    background:
      repeating-linear-gradient(90deg, transparent 0 20px, rgba(255,255,255,.10) 20px 21px),
      linear-gradient(180deg, rgba(255,255,255,.10) 0 6px, transparent 6px);
  }
  .ph-emoji { font-size: 26px; line-height: 1; }
  .ph-label {
    font-size: 9px;
    font-weight: 700;
    letter-spacing: .15em;
    opacity: .9;
    writing-mode: vertical-rl;
    max-height: 42px;
    overflow: hidden;
  }
  .ph-onsen  { background: linear-gradient(170deg, #2c4a6e, #1d3350); }
  .ph-ramen  { background: linear-gradient(170deg, #a63a3a, #6e2222); }
  .ph-cafe   { background: linear-gradient(170deg, #8a6d4b, #5d472e); }
  .ph-izakaya{ background: linear-gradient(170deg, #b3572d, #7a3618); }
  .ph-hotel  { background: linear-gradient(170deg, #3e4a72, #272f4e); }
  .ph-play   { background: linear-gradient(170deg, #3f7a55, #27503a); }
  .ph-food   { background: linear-gradient(170deg, #566270, #39424d); }
  .card-body { flex: 1; min-width: 0; }
  .b-wish {
    display: inline-block;
    margin-top: 6px;
    margin-right: 6px;
    font-size: 11px;
    background: #e3ecff;
    color: #2b5cc4;
    border-radius: 999px;
    padding: 2px 9px;
  }
  .card.selected {
    border-color: var(--accent);
    box-shadow: 0 0 0 2px var(--accent-soft);
  }
  .card-top {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 8px;
  }
  .card-name {
    font-size: 15px;
    font-weight: 700;
  }
  .card-genre {
    font-size: 12px;
    color: var(--muted);
    white-space: nowrap;
  }
  .card-area {
    font-size: 12px;
    color: var(--muted);
    margin-top: 2px;
  }
  .card-verdict {
    font-size: 13px;
    margin-top: 6px;
    line-height: 1.5;
  }
  .card-kids {
    display: inline-block;
    margin-top: 6px;
    font-size: 11px;
    background: #eef7ee;
    color: #2f7a2f;
    border-radius: 999px;
    padding: 2px 9px;
  }
  .card-links {
    margin-top: 8px;
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
  }
  .card-links a {
    font-size: 12px;
    color: var(--accent);
    text-decoration: none;
    border: 1px solid var(--accent-soft);
    background: var(--accent-soft);
    padding: 4px 10px;
    border-radius: 999px;
  }
  .empty {
    padding: 40px 20px;
    text-align: center;
    color: var(--muted);
    font-size: 14px;
    line-height: 1.7;
  }
  .web-btn {
    background: #2d3436 !important;
    color: #fff !important;
    border-color: #2d3436 !important;
  }
  /* 選択中ピンの強調(赤リング) */
  .pin-selected {
    box-shadow: 0 1px 3px rgba(0,0,0,.4), 0 0 0 4px #fff, 0 0 0 7px var(--accent) !important;
    z-index: 5;
  }
  /* ピン/リストタップで下から出る詳細カード */
  #detail {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 30;
    background: #fff;
    border-radius: 16px 16px 0 0;
    box-shadow: 0 -4px 24px rgba(0,0,0,.25);
    padding: 10px 16px calc(16px + env(safe-area-inset-bottom));
    max-height: 45vh; overflow-y: auto;
    transform: translateY(110%);
    transition: transform .22s ease;
  }
  #detail.open { transform: translateY(0); }
  #detail .card { border: none; padding: 0 24px 0 0; cursor: default; }
  .detail-grip {
    width: 40px; height: 4px; border-radius: 2px;
    background: var(--border); margin: 0 auto 10px;
  }
  .detail-close {
    position: absolute; top: 12px; right: 12px;
    border: none; background: var(--bg); color: var(--muted);
    width: 30px; height: 30px; border-radius: 50%;
    font-size: 15px; line-height: 30px; text-align: center;
    cursor: pointer; padding: 0;
  }
  .sheet-back {
    position: fixed; inset: 0; background: rgba(0,0,0,.45);
    z-index: 40; display: none;
  }
  .sheet-back.open { display: block; }
  .sheet {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 41;
    background: #fff; border-radius: 16px 16px 0 0;
    max-height: 78vh; overflow-y: auto; padding: 14px 16px 20px;
    box-shadow: 0 -4px 24px rgba(0,0,0,.25);
  }
  .sheet h2 { font-size: 15px; margin: 0 0 10px; }
  .sheet-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-bottom: 8px; }
  .sheet-actions { display: flex; gap: 8px; }
  .sheet-actions button {
    font-size: 13px; border: 1px solid var(--border); background: #fff;
    border-radius: 999px; padding: 6px 14px; cursor: pointer;
  }
  .sheet-actions button.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 700; }
  .area-group { font-size: 11px; color: var(--muted); margin: 10px 0 4px; font-weight: 700; }
  .area-item { display: flex; align-items: center; gap: 8px; padding: 7px 2px; font-size: 14px; border-bottom: 1px solid var(--bg); }
  .area-item input { width: 18px; height: 18px; }
  .area-item .cnt { color: var(--muted); font-size: 12px; margin-left: auto; }
  .memo-form label { display: block; font-size: 12px; color: var(--muted); margin: 10px 0 3px; }
  .memo-form input[type=text], .memo-form input[type=date], .memo-form textarea, .memo-form select {
    width: 100%; font: inherit; font-size: 14px; padding: 8px 10px;
    border: 1px solid var(--border); border-radius: 8px; background: #fff;
  }
  .memo-form textarea { resize: vertical; }
  .memo-kids { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 4px; }
  .memo-kids label { display: flex; align-items: center; gap: 4px; font-size: 13px; color: var(--text); margin: 0; }
  .memo-hint { font-size: 11.5px; color: var(--muted); line-height: 1.6; margin-top: 6px; }
  .pick-banner {
    position: fixed; top: 0; left: 0; right: 0; z-index: 50;
    background: #2d3436; color: #fff; text-align: center;
    padding: 10px; font-size: 13px; display: none;
  }
  .pick-banner.open { display: block; }
  .b-memo {
    display: inline-block; margin-top: 6px; margin-right: 6px; font-size: 11px;
    background: #f3e8ff; color: #7b2ff2; border-radius: 999px; padding: 2px 9px;
  }
  .b-prep {
    display: inline-block; margin-top: 6px; margin-right: 6px; font-size: 11px;
    background: #f0f0f0; color: #666; border-radius: 999px; padding: 2px 9px;
  }
  .memo-list-item { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 6px 0; font-size: 13px; border-bottom: 1px solid var(--bg); }
  .memo-list-item button { font-size: 11px; border: 1px solid var(--border); background: #fff; border-radius: 999px; padding: 3px 10px; cursor: pointer; }
  .map-foot {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 8px;
    padding: 4px 10px 0;
  }
  .legend {
    font-size: 11px;
    color: var(--muted);
    display: flex;
    align-items: center;
    gap: 4px;
    white-space: nowrap;
  }
  .lg-dot {
    width: 10px; height: 10px;
    border-radius: 50% 50% 50% 0;
    transform: rotate(-45deg);
    display: inline-block;
    margin: 0 3px 0 6px;
  }
  .lg-dot:first-child { margin-left: 0; }
  .lg-red { background: #d63031; }
  .lg-blue { background: #2b5cc4; }
  .osm-credit {
    font-size: 10px;
    color: var(--muted);
    text-align: right;
  }
  .osm-credit a { color: var(--muted); }
</style>
</head>
<body>

<header>
  <h1>福岡グルメマップ</h1>
  <div class="cat-toggle">
    <button class="cat-btn active" data-cat="gourmet">🍜 グルメ・おでかけ</button>
    <button class="cat-btn" data-cat="onsen">♨ 日帰り温泉</button>
    <button class="cat-btn" data-cat="play">🎡 遊び場</button>
  </div>
  <div class="filters">
    <button class="filter-btn active" data-filter="all">すべて</button>
    <button class="filter-btn" data-filter="visited">訪問済み</button>
    <button class="filter-btn" data-filter="kids">子連れOK</button>
    <button class="filter-btn" data-filter="wish">下調べ</button>
    <button class="filter-btn" id="areaBtn">市区で絞る</button>
    <button class="filter-btn" id="memoBtn">＋メモ登録</button>
  </div>
</header>

<div id="map"></div>
<div class="map-foot">
  <div class="legend">
    <span class="lg-dot lg-red"></span>行った店
    <span class="lg-dot lg-blue"></span>下調べ済み
  </div>
  <div class="osm-credit">地図データ: © <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a> contributors</div>
</div>

<div id="count"></div>
<div id="list"></div>

<div id="detail"></div>


<div class="pick-banner" id="pickBanner">地図をタップして位置を指定してください(タップでピンが立ちます)</div>

<div class="sheet-back" id="areaBack">
  <div class="sheet" id="areaSheet">
    <div class="sheet-head">
      <h2>市区で絞る(複数選択OK)</h2>
      <div class="sheet-actions">
        <button id="areaClear">クリア</button>
        <button class="primary" id="areaApply">適用</button>
      </div>
    </div>
    <div id="areaListBox"></div>
  </div>
</div>

<div class="sheet-back" id="memoBack">
  <div class="sheet memo-form" id="memoSheet">
    <div class="sheet-head">
      <h2>来店メモを登録</h2>
      <div class="sheet-actions">
        <button id="memoClose">閉じる</button>
        <button class="primary" id="memoSave">保存</button>
      </div>
    </div>
    <label>店名 *</label>
    <input type="text" id="mName" placeholder="例: ○○食堂 香椎店">
    <label>ジャンル</label>
    <input type="text" id="mGenre" placeholder="例: ラーメン / 定食 / カフェ">
    <label>市区(エリア)</label>
    <input type="text" id="mCity" placeholder="例: 福岡市東区">
    <label>位置</label>
    <div class="sheet-actions" style="margin:2px 0 4px">
      <button id="mPick">📍 地図をタップして指定</button>
      <span id="mLatLng" style="font-size:12px;color:var(--muted);align-self:center">未指定</span>
    </div>
    <label>訪問日</label>
    <input type="date" id="mDate">
    <label>カテゴリ</label>
    <select id="mCat"><option value="">グルメ・おでかけ</option><option value="onsen">日帰り温泉</option><option value="play">遊び場</option></select>
    <label>子連れ情報</label>
    <div class="memo-kids">
      <label><input type="checkbox" id="mChair">子供椅子</label>
      <label><input type="checkbox" id="mTatami">座敷</label>
      <label><input type="checkbox" id="mDiaper">オムツ替え</label>
      <label><input type="checkbox" id="mStroller">ベビーカー可</label>
    </div>
    <label>ひとことメモ(席・駐車場・提供speed等)</label>
    <textarea id="mVerdict" rows="3" placeholder="例: 座敷あり・P10台・提供10分。子連れでも安心"></textarea>

    <div id="memoListWrap" style="margin-top:16px">
      <div class="sheet-head"><h2>この端末のメモ(<span id="memoCount">0</span>件)</h2>
        <div class="sheet-actions"><button id="memoCopy">本登録用にコピー</button></div>
      </div>
      <div class="memo-hint">メモはこの端末のブラウザに保存され、地図に紫バッジ付きで表示されます。「本登録用にコピー」した内容をClaudeに貼ると、全端末で見られる正式データに登録されます。</div>
      <div id="memoList"></div>
    </div>
  </div>
</div>

<script>
const DATA_URL = "../data/spots.json";

const state = {
  spots: [],
  filter: "all",
  category: "gourmet",
  areas: new Set(),
  areasDraft: new Set(),
  markers: [],
  selectedId: null,
  picking: false,
  pickMarker: null,
  pickPos: null
};

const MEMO_KEY = "aq_memo_spots";
const PASS_KEY = "aq_memo_unlocked";
function loadMemos() {
  try { return JSON.parse(localStorage.getItem(MEMO_KEY) || "[]"); } catch (e) { return []; }
}
function saveMemos(list) { localStorage.setItem(MEMO_KEY, JSON.stringify(list)); }
function mergedSpots(base) {
  const ids = new Set(base.map(s => s.id));
  return base.concat(loadMemos().filter(m => !ids.has(m.id)));
}

// 投稿から1週間は NEW 扱い
function isNew(spot) {
  if (!spot.posted) return false;
  const d = new Date(spot.posted + "T00:00:00+09:00");
  return (Date.now() - d.getTime()) <= 7 * 24 * 60 * 60 * 1000;
}

async function loadSpots() {
  try {
    const res = await fetch(DATA_URL);
    if (!res.ok) throw new Error("fetch failed: " + res.status);
    const json = await res.json();
    return mergedSpots(Array.isArray(json) ? json : []);
  } catch (e) {
    console.error("spots.json の読み込みに失敗しました", e);
    return mergedSpots([]);
  }
}

function isKidsOk(spot) {
  // 行きたい(未訪問)スポットは、ネットで設備の裏が取れたものだけ子連れOK扱いにする
  // (取り込み時に with:"family" を仮置きしているため、withでは判定しない)
  if (spot.wish) {
    const k = spot.kids || {};
    return ["stroller", "diaper", "tatami", "kidsChair"].some(key => k[key] === true);
  }
  return spot.with === "family" || (spot.kids !== null && spot.kids !== undefined);
}

// スポットの所属カテゴリ(グルメ・おでかけ/日帰り温泉/遊び場)
function spotCat(s) {
  if (s.category === "onsen") return "onsen";
  if (s.category === "play") return "play";
  return "gourmet";
}

function applyFilters(spots) {
  return spots.filter(s => {
    if (spotCat(s) !== state.category) return false;
    // すべて=赤(訪問済み)+青(行きたい)を同時表示。タブで絞り込み
    if (state.filter === "visited" && s.wish) return false;
    if (state.filter === "kids" && (!isKidsOk(s) || s.wish)) return false;
    if (state.filter === "wish" && !s.wish) return false;
    if (state.areas.size && !state.areas.has(s.city)) return false;
    return true;
  });
}

function webUrl(spot) {
  // 公式サイトが登録されていればそれを、無ければGoogleマップの該当スポットを開く
  if (spot.web) return spot.web;
  const q = encodeURIComponent(spot.name + " " + (spot.city || ""));
  if (spot.lat && spot.lng) {
    return `https://www.google.com/maps/search/?api=1&query=${q}&center=${spot.lat},${spot.lng}`;
  }
  return `https://www.google.com/maps/search/?api=1&query=${q}`;
}

function videoLinksHtml(spot, cls) {
  const video = spot.video;
  const items = [];
  if (video && video.youtube) items.push(`<a href="${video.youtube}" target="_blank" rel="noopener">YouTube</a>`);
  if (video && video.tiktok) items.push(`<a href="${video.tiktok}" target="_blank" rel="noopener">TikTok</a>`);
  if (video && video.instagram) items.push(`<a href="${video.instagram}" target="_blank" rel="noopener">Instagram</a>`);
  items.push(`<a class="web-btn" href="${webUrl(spot)}" target="_blank" rel="noopener">🌐 詳細</a>`);
  return `<div class="${cls}">${items.join("")}</div>`;
}

function escapeHtml(str) {
  if (str === null || str === undefined) return "";
  return String(str)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;");
}

// ジャンル文字列から「のれん」の見た目(絵文字・色・札の文字)を決める
function norenStyle(spot) {
  const g = (spot.genre || "") + (spot.category || "");
  const has = (...words) => words.some(w => g.includes(w));
  if (spot.category === "onsen" || has("温泉", "銭湯", "スパ", "サウナ", "湯")) return { cls: "ph-onsen", emoji: "♨️", label: "湯" };
  if (has("ラーメン", "つけ麺", "豚骨")) return { cls: "ph-ramen", emoji: "🍜", label: "麺" };
  if (has("うどん", "そば", "蕎麦")) return { cls: "ph-ramen", emoji: "🍜", label: "麺" };
  if (has("カフェ", "喫茶", "パン", "スイーツ", "ドーナツ", "ケーキ", "デザート")) return { cls: "ph-cafe", emoji: "☕", label: "甘味" };
  if (has("居酒屋", "屋台", "酒場", "焼鳥", "焼き鳥", "串", "おでん", "餃子")) return { cls: "ph-izakaya", emoji: "🏮", label: "酒場" };
  if (has("焼肉", "ホルモン", "ステーキ", "ハンバーグ")) return { cls: "ph-izakaya", emoji: "🍖", label: "肉" };
  if (has("寿司", "鮨", "海鮮", "魚")) return { cls: "ph-food", emoji: "🍣", label: "海鮮" };
  if (has("ホテル", "旅館", "宿", "リゾート")) return { cls: "ph-hotel", emoji: "🏨", label: "宿" };
  if (has("公園", "遊", "ミュージアム", "こども", "施設", "テーマ", "動物", "水族館")) return { cls: "ph-play", emoji: "🎡", label: "遊び場" };
  return { cls: "ph-food", emoji: "🍴", label: "食事処" };
}

function cardHtml(spot) {
  const area = spot.area ? escapeHtml(spot.area) : "";
  const cityArea = [spot.city ? escapeHtml(spot.city) : "", area].filter(Boolean).join("・");
  const kidsOk = isKidsOk(spot);
  // 訪問済みだが動画がまだ無い店
  const v = spot.video || {};
  const noVideo = !spot.wish && !spot.memo && !v.youtube && !v.tiktok && !v.instagram;
  const ph = norenStyle(spot);
  const thumb = spot.thumb
    ? `<img class="card-thumb" src="thumbs/${escapeHtml(spot.thumb)}" alt="" loading="lazy">`
    : `<div class="card-thumb ph ${ph.cls}"><span class="ph-emoji">${ph.emoji}</span><span class="ph-label">${ph.label}</span></div>`;
  return `
    ${thumb}
    <div class="card-body">
      <div class="card-top">
        <div class="card-name">${escapeHtml(spot.name)}</div>
        <div class="card-genre">${escapeHtml(spot.genre || "")}</div>
      </div>
      <div class="card-area">${cityArea}</div>
      ${spot.verdict ? `<div class="card-verdict">${escapeHtml(spot.verdict)}</div>` : ""}
      ${spot.bathAge ? `<div class="card-bath">♨ ${escapeHtml(spot.bathAge)}</div>` : (spot.category === "onsen" ? `<div class="card-bath">♨ 子供の年齢制限・オムツ可否: 記載無し(要問合せ)</div>` : "")}
      ${isNew(spot) ? `<span class="b-new">NEW</span>` : ""}${spot.memo ? `<span class="b-memo">メモ</span>` : ""}${spot.wish ? `<span class="b-wish">下調べ済み</span>` : ""}${noVideo ? `<span class="b-prep">🎬 動画準備中</span>` : ""}${kidsOk ? `<div class="card-kids">子連れOK</div>` : ""}
      ${videoLinksHtml(spot, "card-links")}
    </div>
  `;
}

function areaTabSpots(spots) {
  return spots.filter(s => {
    if (spotCat(s) !== state.category) return false;
    if (state.filter === "visited" && s.wish) return false;
    if (state.filter === "kids" && (!isKidsOk(s) || s.wish)) return false;
    if (state.filter === "wish" && !s.wish) return false;
    return true;
  });
}

function populateAreaSelect(spots) {
  const tabSpots = areaTabSpots(spots);
  const prefBy = {};
  tabSpots.forEach(s => { if (s.city && !prefBy[s.city]) prefBy[s.city] = s.pref || "福岡県"; });
  const cities = Object.keys(prefBy);
  const WARDS = ["福岡市東区", "福岡市博多区", "福岡市中央区", "福岡市南区", "福岡市城南区", "福岡市早良区", "福岡市西区"];
  const PREFS = ["佐賀県", "長崎県", "大分県", "熊本県", "宮崎県", "鹿児島県", "山口県", "広島県", "岡山県", "愛媛県", "大阪府"];
  const rank = c => {
    const w = WARDS.indexOf(c);
    if (w >= 0) return w;
    if (prefBy[c] === "福岡県") return 100;
    const p = PREFS.indexOf(prefBy[c]);
    return 200 + (p >= 0 ? p : PREFS.length);
  };
  cities.sort((a, b) => rank(a) - rank(b) || a.localeCompare(b, "ja"));
  const countBy = {};
  tabSpots.forEach(s => { if (s.city) countBy[s.city] = (countBy[s.city] || 0) + 1; });
  // 選択中で消えた市区を落とす
  [...state.areas].forEach(a => { if (!cities.includes(a)) state.areas.delete(a); });
  state.areasDraft = new Set(state.areas);
  const box = document.getElementById("areaListBox");
  let html = ""; let lastGroup = "";
  cities.forEach(c => {
    const g = rank(c) < 100 ? "福岡市" : (prefBy[c] === "福岡県" ? "福岡県内" : prefBy[c]);
    if (g !== lastGroup) { html += `<div class="area-group">${g}</div>`; lastGroup = g; }
    const label = prefBy[c] === "福岡県" ? c : c;
    html += `<label class="area-item"><input type="checkbox" value="${escapeHtml(c)}" ${state.areasDraft.has(c) ? "checked" : ""}><span>${escapeHtml(label)}</span><span class="cnt">${countBy[c]}</span></label>`;
  });
  box.innerHTML = html || `<div class="memo-hint">このタブに市区データがありません</div>`;
  box.querySelectorAll("input[type=checkbox]").forEach(cb => {
    cb.addEventListener("change", () => {
      if (cb.checked) state.areasDraft.add(cb.value); else state.areasDraft.delete(cb.value);
    });
  });
  updateAreaBtn();
}

function updateAreaBtn() {
  const b = document.getElementById("areaBtn");
  b.textContent = state.areas.size ? `市区で絞る(${state.areas.size})` : "市区で絞る";
  b.classList.toggle("active", state.areas.size > 0);
}

function clearMarkers() {
  state.markers.forEach(m => m.marker.remove());
  state.markers = [];
}

// ===== 詳細カード(ピン/リスト共通の詳細表示) =====
function updatePinHighlight() {
  state.markers.forEach(({ spot, marker }) => {
    marker.getElement().classList.toggle("pin-selected", spot.id === state.selectedId);
  });
}

function openDetail(spot) {
  const detail = document.getElementById("detail");
  detail.innerHTML = `
    <div class="detail-grip"></div>
    <button class="detail-close" id="detailClose">✕</button>
    <div class="card">${cardHtml(spot)}</div>
  `;
  detail.classList.add("open");
  document.getElementById("detailClose").addEventListener("click", closeDetail);
}

function closeDetail() {
  document.getElementById("detail").classList.remove("open");
  state.selectedId = null;
  renderList();
  updatePinHighlight();
}

function focusSpot(spot) {
  state.selectedId = spot.id;
  renderList();
  updatePinHighlight();
  openDetail(spot);
  if (spot.lat !== null && spot.lng !== null && spot.lat !== undefined && spot.lng !== undefined && window._map) {
    window._map.flyTo({ center: [spot.lng, spot.lat], zoom: 15, essential: true });
  }
}

function renderList() {
  const list = document.getElementById("list");
  const countEl = document.getElementById("count");
  // NEW(投稿1週間以内)をリスト最上部に
  const filtered = applyFilters(state.spots).slice().sort((a, b) => (isNew(b) ? 1 : 0) - (isNew(a) ? 1 : 0));

  countEl.textContent = state.spots.length
    ? `${filtered.length}件表示中(全${state.spots.length}件)`
    : "";

  if (!state.spots.length) {
    list.innerHTML = `<div class="empty">まだ登録されたお店がありません。<br>data/spots.json に追加すると、ここと地図に表示されます。</div>`;
    return;
  }
  if (!filtered.length) {
    list.innerHTML = `<div class="empty">条件に合うお店が見つかりませんでした。</div>`;
    return;
  }

  list.innerHTML = filtered.map(s => `
    <div class="card${s.id === state.selectedId ? " selected" : ""}" data-id="${escapeHtml(s.id)}">
      ${cardHtml(s)}
    </div>
  `).join("");

  list.querySelectorAll(".card").forEach(el => {
    el.addEventListener("click", () => {
      const spot = state.spots.find(s => s.id === el.dataset.id);
      if (spot) {
        focusSpot(spot);
        // リストから選んだら地図までスクロールで戻す(ハイライトを見せる)
        window.scrollTo({ top: 0, behavior: "smooth" });
      }
    });
  });
}

function renderMarkers() {
  clearMarkers();
  if (!window._map) return;
  const filtered = applyFilters(state.spots).filter(s => s.lat !== null && s.lng !== null && s.lat !== undefined && s.lng !== undefined);

  filtered.forEach(spot => {
    const el = document.createElement("div");
    el.style.width = "22px";
    el.style.height = "22px";
    el.style.borderRadius = "50% 50% 50% 0";
    el.style.transform = "rotate(-45deg)";
    el.style.background = spot.wish ? "#2b5cc4" : "#d63031";
    el.style.border = "2px solid #fff";
    el.style.boxShadow = "0 1px 3px rgba(0,0,0,.4)";
    el.style.cursor = "pointer";
    if (isNew(spot)) {
      el.classList.add("pin-new");
      const lab = document.createElement("span");
      lab.className = "pin-new-label";
      lab.textContent = "NEW";
      el.appendChild(lab);
    }

    const marker = new maplibregl.Marker({ element: el })
      .setLngLat([spot.lng, spot.lat])
      .addTo(window._map);

    el.addEventListener("click", (e) => {
      e.stopPropagation();
      focusSpot(spot);
    });

    state.markers.push({ spot, marker });
  });
  updatePinHighlight();
}

function renderAll() {
  // フィルタ変更で選択中の店が対象外になったら詳細カードを閉じる
  if (state.selectedId !== null && !applyFilters(state.spots).some(s => s.id === state.selectedId)) {
    document.getElementById("detail").classList.remove("open");
    state.selectedId = null;
  }
  renderMarkers();
  renderList();
}

function initMap(spots) {
  const withCoords = spots.filter(s => s.lat !== null && s.lng !== null && s.lat !== undefined && s.lng !== undefined);
  // ターゲットは福岡県民のため、初期表示は常に福岡県(福岡都市圏中心)
  const center = [130.45, 33.55];

  const map = new maplibregl.Map({
    container: "map",
    style: {
      version: 8,
      sources: {
        osm: {
          type: "raster",
          tiles: ["https://tile.openstreetmap.org/{z}/{x}/{y}.png"],
          tileSize: 256,
          attribution: "&copy; OpenStreetMap contributors"
        }
      },
      layers: [
        { id: "osm", type: "raster", source: "osm" }
      ]
    },
    center: center,
    zoom: 8.7
  });
  map.addControl(new maplibregl.NavigationControl({ showCompass: false }), "top-right");
  window._map = map;

  map.on("load", () => {
    renderAll();
  });
  map.on("click", (e) => {
    if (state.picking) { onMapPick(e.lngLat); return; }
    // 地図の空きエリアタップで詳細カードを閉じる
    if (state.selectedId !== null) closeDetail();
  });
}


// ===== 市区パネル =====
document.getElementById("areaBtn").addEventListener("click", () => {
  populateAreaSelect(state.spots);
  document.getElementById("areaBack").classList.add("open");
});
document.getElementById("areaBack").addEventListener("click", (e) => {
  if (e.target.id === "areaBack") document.getElementById("areaBack").classList.remove("open");
});
document.getElementById("areaClear").addEventListener("click", () => {
  state.areasDraft = new Set();
  document.querySelectorAll("#areaListBox input[type=checkbox]").forEach(cb => cb.checked = false);
});
document.getElementById("areaApply").addEventListener("click", () => {
  state.areas = new Set(state.areasDraft);
  document.getElementById("areaBack").classList.remove("open");
  updateAreaBtn();
  renderAll();
});

// ===== メモ登録 =====
const MEMO_PASS = "0319";
function memoUnlocked() { return sessionStorage.getItem(PASS_KEY) === "1"; }
document.getElementById("memoBtn").addEventListener("click", () => {
  if (!memoUnlocked()) {
    const p = prompt("管理パスワードを入力してください");
    if (p !== MEMO_PASS) { if (p !== null) alert("パスワードが違います"); return; }
    sessionStorage.setItem(PASS_KEY, "1");
  }
  openMemoSheet();
});
function openMemoSheet() {
  document.getElementById("mDate").value = new Date().toISOString().slice(0, 10);
  renderMemoList();
  document.getElementById("memoBack").classList.add("open");
}
document.getElementById("memoClose").addEventListener("click", () => {
  document.getElementById("memoBack").classList.remove("open");
});
document.getElementById("memoBack").addEventListener("click", (e) => {
  if (e.target.id === "memoBack") document.getElementById("memoBack").classList.remove("open");
});

// 位置指定モード
document.getElementById("mPick").addEventListener("click", () => {
  state.picking = true;
  document.getElementById("memoBack").classList.remove("open");
  document.getElementById("pickBanner").classList.add("open");
});
function onMapPick(lngLat) {
  state.pickPos = { lat: +lngLat.lat.toFixed(6), lng: +lngLat.lng.toFixed(6) };
  if (state.pickMarker) state.pickMarker.remove();
  const el = document.createElement("div");
  el.style.cssText = "width:22px;height:22px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);background:#7b2ff2;border:2px solid #fff;box-shadow:0 1px 3px rgba(0,0,0,.4)";
  state.pickMarker = new maplibregl.Marker({ element: el }).setLngLat([state.pickPos.lng, state.pickPos.lat]).addTo(window._map);
  state.picking = false;
  document.getElementById("pickBanner").classList.remove("open");
  document.getElementById("mLatLng").textContent = `${state.pickPos.lat}, ${state.pickPos.lng}`;
  document.getElementById("memoBack").classList.add("open");
}

function slugify(name) {
  return "memo-" + Date.now().toString(36);
}
document.getElementById("memoSave").addEventListener("click", () => {
  const name = document.getElementById("mName").value.trim();
  if (!name) { alert("店名を入力してください"); return; }
  const kids = {
    stroller: document.getElementById("mStroller").checked || null,
    diaper: document.getElementById("mDiaper").checked || null,
    tatami: document.getElementById("mTatami").checked || null,
    kidsChair: document.getElementById("mChair").checked || null,
    serveMin: null, noise: null
  };
  const entry = {
    id: slugify(name), name: name, memo: true,
    area: null, city: document.getElementById("mCity").value.trim() || null, pref: null,
    genre: document.getElementById("mGenre").value.trim() || null,
    lat: state.pickPos ? state.pickPos.lat : null,
    lng: state.pickPos ? state.pickPos.lng : null,
    visited: document.getElementById("mDate").value || null,
    with: "family", kids: kids,
    verdict: document.getElementById("mVerdict").value.trim() || null,
    video: { youtube: null, tiktok: null, instagram: null },
    thumb: null
  };
  const cat = document.getElementById("mCat").value;
  if (cat) entry.category = cat;
  const memos = loadMemos();
  memos.push(entry);
  saveMemos(memos);
  // フォームリセット
  ["mName", "mGenre", "mCity", "mVerdict"].forEach(i => document.getElementById(i).value = "");
  ["mChair", "mTatami", "mDiaper", "mStroller"].forEach(i => document.getElementById(i).checked = false);
  if (state.pickMarker) { state.pickMarker.remove(); state.pickMarker = null; }
  state.pickPos = null;
  document.getElementById("mLatLng").textContent = "未指定";
  state.spots = mergedSpots(state.spots.filter(s => !s.memo));
  renderMemoList();
  renderAll();
  alert("メモを保存しました(この端末のみ)。正式登録は「本登録用にコピー」でClaudeへ");
});

function renderMemoList() {
  const memos = loadMemos();
  document.getElementById("memoCount").textContent = memos.length;
  document.getElementById("memoList").innerHTML = memos.map(m => `
    <div class="memo-list-item"><span>${escapeHtml(m.name)}${m.lat ? "" : "(位置未指定)"}</span>
    <button data-del="${m.id}">削除</button></div>`).join("") || `<div class="memo-hint">まだメモはありません</div>`;
  document.querySelectorAll("#memoList [data-del]").forEach(b => {
    b.addEventListener("click", () => {
      saveMemos(loadMemos().filter(m => m.id !== b.dataset.del));
      state.spots = mergedSpots(state.spots.filter(s => !s.memo));
      renderMemoList(); renderAll();
    });
  });
}
document.getElementById("memoCopy").addEventListener("click", () => {
  const memos = loadMemos();
  if (!memos.length) { alert("メモがありません"); return; }
  const text = "【来店メモの本登録依頼】\n" + JSON.stringify(memos, null, 1);
  if (navigator.clipboard && window.isSecureContext) {
    navigator.clipboard.writeText(text).then(() => alert("コピーしました。Claudeのチャットに貼ってください"));
  } else {
    prompt("以下を全選択してコピーしてください", text);
  }
});

document.querySelectorAll(".cat-btn").forEach(btn => {
  btn.addEventListener("click", () => {
    document.querySelectorAll(".cat-btn").forEach(b => b.classList.remove("active"));
    btn.classList.add("active");
    state.category = btn.dataset.cat;
    populateAreaSelect(state.spots);
    renderAll();
  });
});

document.querySelectorAll(".filter-btn").forEach(btn => {
  btn.addEventListener("click", () => {
    document.querySelectorAll(".filter-btn").forEach(b => b.classList.remove("active"));
    btn.classList.add("active");
    state.filter = btn.dataset.filter;
    populateAreaSelect(state.spots);
    renderAll();
  });
});



(async function main() {
  const spots = await loadSpots();
  state.spots = spots;
  populateAreaSelect(spots);
  initMap(spots);
  if (!spots.length) {
    renderList();
  }
})();
</script>
