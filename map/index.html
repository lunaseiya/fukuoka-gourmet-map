<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>福岡グルメマップ</title>
<link rel="apple-touch-icon" href="../icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="../icons/favicon-32.png">
<link rel="manifest" href="../manifest.json">
<meta name="apple-mobile-web-app-title" content="福岡子育てグルメ">
<meta name="theme-color" content="#d63031">
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">
<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<style>
  :root {
    --accent: #d63031;
    --accent-soft: #ffe3e3;
    --text: #222;
    --muted: #767676;
    --border: #e5e5e5;
    --bg: #fafafa;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    font-family: "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans JP", "Yu Gothic", Meiryo, sans-serif;
    color: var(--text);
    background: var(--bg);
    -webkit-text-size-adjust: 100%;
  }
  header {
    position: sticky; top: 0; z-index: 20;
    background: #fff;
    border-bottom: 1px solid var(--border);
    padding: 10px 12px 8px;
  }
  h1 {
    font-size: 15px;
    margin: 0 0 8px;
    font-weight: 700;
    color: var(--text);
  }
  .cat-toggle {
    display: flex;
    gap: 0;
    margin-bottom: 8px;
    border: 1px solid var(--border);
    border-radius: 10px;
    overflow: hidden;
    width: fit-content;
  }
  .cat-btn {
    border: none;
    background: #fff;
    color: var(--text);
    padding: 8px 16px;
    font-size: 13px;
    font-weight: 700;
    cursor: pointer;
  }
  .cat-btn.active {
    background: #2d3436;
    color: #fff;
  }
  .b-new {
    display: inline-block;
    margin-right: 6px;
    font-size: 11px;
    font-weight: 800;
    background: #ffd32a;
    color: #6d4c00;
    border-radius: 999px;
    padding: 2px 9px;
    animation: newpulse 1.6s ease-in-out infinite;
  }
  @keyframes newpulse {
    0%, 100% { opacity: 1; }
    50% { opacity: .55; }
  }
  .pin {
    width: 22px; height: 22px;
    border-radius: 50% 50% 50% 0;
    transform: rotate(-45deg);
    border: 2px solid #fff;
    box-shadow: 0 1px 3px rgba(0,0,0,.4);
    cursor: pointer;
  }
  /* まとめたピン(中に件数) */
  .pin-cluster {
    min-width: 34px; height: 34px;
    padding: 0 6px;
    border-radius: 999px;
    border: 2px solid #fff;
    box-shadow: 0 2px 6px rgba(0,0,0,.35);
    color: #fff;
    font-size: 14px;
    font-weight: 800;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
  }
  .pc-blue { background: #2b5cc4; }
  /* 同じ施設のまとまり。押すと必ずリストが出るので、丸ピンと形を変えて区別する */
  .pin-cluster.pc-facility {
    border-radius: 9px;
    min-width: 38px;
    height: 30px;
  }
  .pin-cluster.pc-facility::before { content: "🏢"; font-size: 11px; margin-right: 3px; }
  .pc-red  { background: #d63031; }
  /* まとめたピンの中身リスト(下から出るシート) */
  #clusterBox {
    position: fixed; left: 0; right: 0; bottom: 0;
    z-index: 60;
    background: #fff;
    border-radius: 16px 16px 0 0;
    box-shadow: 0 -4px 20px rgba(0,0,0,.2);
    max-height: 70vh;
    max-height: 70dvh;   /* iOSはvhがブラウザUIを含むので画面外にはみ出す */
    display: flex; flex-direction: column;
    transform: translateY(101%);
    transition: transform .22s ease;
  }
  #clusterBox.open { transform: translateY(0); }
  .cl-head {
    display: flex; align-items: center; gap: 8px;
    padding: 12px 14px 8px;
    border-bottom: 1px solid var(--border);
    flex: 0 0 auto;
  }
  .cl-head h2 { font-size: 15px; margin: 0; flex: 1; font-weight: 700; }
  .cl-head .n { font-size: 12px; color: var(--muted); }
  .cl-close {
    border: none; background: #f0f0f0; color: var(--text);
    width: 30px; height: 30px; border-radius: 50%;
    font-size: 15px; cursor: pointer;
  }
  #clusterList {
    flex: 1 1 auto;
    min-height: 0;              /* これが無いとflex子が縮まずスクロールしない */
    overflow-y: auto;
    overscroll-behavior: contain;
    -webkit-overflow-scrolling: touch;
    padding: 2px 10px 24px;
  }
  .cl-item {
    display: block; width: 100%;
    text-align: left;
    padding: 10px 10px 9px;
    border: none; border-bottom: 1px solid var(--border);
    background: #fff;
    font-family: inherit; font-size: 14px; color: var(--text);
    cursor: pointer;
  }
  .cl-item:active { background: var(--accent-soft); }
  .cl-top { display: flex; gap: 10px; align-items: baseline; }
  .cl-name { flex: 1; font-weight: 600; line-height: 1.35; }
  .cl-genre { font-size: 11px; color: var(--muted); white-space: nowrap; }
  .cl-tags { margin-top: 5px; display: flex; gap: 5px; flex-wrap: wrap; }
  .cl-tag {
    font-size: 10.5px;
    border-radius: 999px;
    padding: 2px 8px;
    white-space: nowrap;
  }
  .t-visited { background: #ffe3e3; color: #b02525; }   /* 赤ピン=訪問済み */
  .t-wish    { background: #e3ecff; color: #2b5cc4; }   /* 青ピン=下調べ済み */
  .t-kids    { background: #eef7ee; color: #2f7a2f; }
  .t-video   { background: #fff3e3; color: #b05a00; }
  .pin-new {
    animation: pinpulse 1.6s ease-in-out infinite;
  }
  @keyframes pinpulse {
    0%, 100% { box-shadow: 0 1px 3px rgba(0,0,0,.4), 0 0 0 0 rgba(255,211,42,.9); }
    50% { box-shadow: 0 1px 3px rgba(0,0,0,.4), 0 0 0 9px rgba(255,211,42,0); }
  }
  .pin-new-label {
    position: absolute;
    top: -14px;
    left: 10px;
    transform: rotate(45deg);
    background: #ffd32a;
    color: #6d4c00;
    font-size: 9px;
    font-weight: 800;
    border-radius: 6px;
    padding: 0 4px;
    line-height: 14px;
    pointer-events: none;
  }
  .card-bath {
    margin-top: 6px;
    font-size: 12px;
    color: #b05a00;
    background: #fff3e3;
    border-radius: 8px;
    padding: 4px 8px;
    display: inline-block;
  }
  .searchbar {
    position: relative;
    margin-bottom: 8px;
  }
  .searchbar input {
    width: 100%;
    padding: 9px 34px 9px 12px;
    font-size: 15px;   /* 16px未満だとiOSで拡大されるので注意 */
    font-family: inherit;
    color: var(--text);
    background: #fff;
    border: 1px solid var(--border);
    border-radius: 10px;
    -webkit-appearance: none;
  }
  .searchbar input:focus {
    outline: none;
    border-color: var(--accent);
    box-shadow: 0 0 0 2px var(--accent-soft);
  }
  .searchbar input::-webkit-search-cancel-button { display: none; }
  #qClear {
    position: absolute;
    top: 50%; right: 6px;
    transform: translateY(-50%);
    display: none;
    border: none;
    background: transparent;
    color: var(--muted);
    font-size: 15px;
    padding: 4px 6px;
    cursor: pointer;
  }
  #qClear.on { display: block; }
  /* 検索中は全カテゴリを横断するので、どのタブの結果かを示す */
  .b-cat {
    display: inline-block;
    margin-top: 6px;
    margin-right: 6px;
    font-size: 11px;
    background: #f0efe8;
    color: #6b6552;
    border-radius: 999px;
    padding: 2px 9px;
  }
  .filters {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
    align-items: center;
  }
  .filter-btn {
    border: 1px solid var(--border);
    background: #fff;
    color: var(--text);
    padding: 7px 14px;
    border-radius: 999px;
    font-size: 13px;
    white-space: nowrap;
    cursor: pointer;
  }
  .filter-btn.active {
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
  }
  #map {
    width: 100%;
    height: 46vh;
    min-height: 260px;
  }
  #count {
    font-size: 12px;
    color: var(--muted);
    padding: 8px 14px 0;
  }
  #list {
    padding: 8px 10px 40px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .card {
    background: #fff;
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 12px 14px;
    cursor: pointer;
    transition: box-shadow .15s, border-color .15s;
    display: flex;
    gap: 12px;
    align-items: flex-start;
  }
  .card-thumb {
    flex: 0 0 64px;
    width: 64px;
    height: 84px;
    object-fit: cover;
    border-radius: 8px;
    background: var(--border);
  }
  /* サムネが無い店の「のれん風」プレースホルダー */
  .ph {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 3px;
    position: relative;
    overflow: hidden;
    color: #fff;
  }
  .ph::before {
    content: "";
    position: absolute; inset: 0;
    background:
      repeating-linear-gradient(90deg, transparent 0 20px, rgba(255,255,255,.10) 20px 21px),
      linear-gradient(180deg, rgba(255,255,255,.10) 0 6px, transparent 6px);
  }
  .ph-emoji { font-size: 26px; line-height: 1; }
  .ph-label {
    font-size: 9px;
    font-weight: 700;
    letter-spacing: .15em;
    opacity: .9;
    writing-mode: vertical-rl;
    max-height: 42px;
    overflow: hidden;
  }
  .ph-onsen  { background: linear-gradient(170deg, #2c4a6e, #1d3350); }
  .ph-ramen  { background: linear-gradient(170deg, #a63a3a, #6e2222); }
  .ph-cafe   { background: linear-gradient(170deg, #8a6d4b, #5d472e); }
  .ph-izakaya{ background: linear-gradient(170deg, #b3572d, #7a3618); }
  .ph-hotel  { background: linear-gradient(170deg, #3e4a72, #272f4e); }
  .ph-play   { background: linear-gradient(170deg, #3f7a55, #27503a); }
  .ph-food   { background: linear-gradient(170deg, #566270, #39424d); }
  .ph-mall   { background: linear-gradient(170deg, #7a4d8f, #4e2f5e); }
  .card-body { flex: 1; min-width: 0; }
  .b-both {
    display: inline-block;
    margin-top: 6px;
    margin-right: 6px;
    font-size: 11px;
    background: #eef3ff;
    color: #4a5f8a;
    border-radius: 999px;
    padding: 2px 9px;
  }
  .b-wish {
    display: inline-block;
    margin-top: 6px;
    margin-right: 6px;
    font-size: 11px;
    background: #e3ecff;
    color: #2b5cc4;
    border-radius: 999px;
    padding: 2px 9px;
  }
  .card.selected {
    border-color: var(--accent);
    box-shadow: 0 0 0 2px var(--accent-soft);
  }
  .card-top {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 8px;
  }
  .card-name {
    font-size: 15px;
    font-weight: 700;
  }
  .card-genre {
    font-size: 12px;
    color: var(--muted);
    white-space: nowrap;
  }
  .card-area {
    font-size: 12px;
    color: var(--muted);
    margin-top: 2px;
  }
  .card-verdict {
    font-size: 13px;
    margin-top: 6px;
    line-height: 1.5;
  }
  .card-kids {
    display: inline-block;
    margin-top: 6px;
    font-size: 11px;
    background: #eef7ee;
    color: #2f7a2f;
    border-radius: 999px;
    padding: 2px 9px;
  }
  .card-links {
    margin-top: 8px;
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
  }
  .card-links a {
    font-size: 12px;
    color: var(--accent);
    text-decoration: none;
    border: 1px solid var(--accent-soft);
    background: var(--accent-soft);
    padding: 4px 10px;
    border-radius: 999px;
  }
  .empty {
    padding: 40px 20px;
    text-align: center;
    color: var(--muted);
    font-size: 14px;
    line-height: 1.7;
  }
  .web-btn {
    background: #2d3436 !important;
    color: #fff !important;
    border-color: #2d3436 !important;
  }
  /* 楽天トラベルのアフィリエイトボタン(PR) */
  .aff-rakuten {
    background: #bf0000 !important;
    color: #fff !important;
    border-color: #bf0000 !important;
  }
  .aff-rakuten::before { content: "🏨 "; }
  /* 食べログの店舗ページへ */
  .tabelog-btn {
    background: #e8730c !important;
    color: #fff !important;
    border-color: #e8730c !important;
  }
  .tabelog-btn::before { content: "🍽 "; }
  /* アソビュー等のWEBチケット */
  .ticket-btn {
    background: #00a5a0 !important;
    color: #fff !important;
    border-color: #00a5a0 !important;
  }
  .ticket-btn::before { content: "🎟 "; }
  /* 公式サイトの席予約(アフィリエイトではないのでPRバッジは付けない) */
  .reserve-btn {
    background: #1a7f5a !important;
    color: #fff !important;
    border-color: #1a7f5a !important;
  }
  .reserve-btn::before { content: "🪑 "; }
  .pr-badge {
    font-size: 10px;
    color: var(--muted);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 1px 4px;
    align-self: center;
  }
  /* 選択中ピンの強調(赤リング) */
  .pin-selected {
    box-shadow: 0 1px 3px rgba(0,0,0,.4), 0 0 0 4px #fff, 0 0 0 7px var(--accent) !important;
    z-index: 5;
  }
  /* ピン/リストタップで下から出る詳細カード */
  #detail {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 30;
    background: #fff;
    border-radius: 16px 16px 0 0;
    box-shadow: 0 -4px 24px rgba(0,0,0,.25);
    padding: 10px 16px calc(16px + env(safe-area-inset-bottom));
    max-height: 45vh; overflow-y: auto;
    transform: translateY(110%);
    transition: transform .22s ease;
  }
  #detail.open { transform: translateY(0); }
  #detail .card { border: none; padding: 0 24px 0 0; cursor: default; }
  .detail-grip {
    width: 40px; height: 4px; border-radius: 2px;
    background: var(--border); margin: 0 auto 10px;
  }
  .detail-close {
    position: absolute; top: 12px; right: 12px;
    border: none; background: var(--bg); color: var(--muted);
    width: 30px; height: 30px; border-radius: 50%;
    font-size: 15px; line-height: 30px; text-align: center;
    cursor: pointer; padding: 0;
  }
  .sheet-back {
    position: fixed; inset: 0; background: rgba(0,0,0,.45);
    z-index: 40; display: none;
  }
  .sheet-back.open { display: block; }
  .sheet {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 41;
    background: #fff; border-radius: 16px 16px 0 0;
    max-height: 78vh; overflow-y: auto; padding: 14px 16px 20px;
    box-shadow: 0 -4px 24px rgba(0,0,0,.25);
  }
  .sheet h2 { font-size: 15px; margin: 0 0 10px; }
  .sheet-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-bottom: 8px; }
  .sheet-actions { display: flex; gap: 8px; }
  .sheet-actions button {
    font-size: 13px; border: 1px solid var(--border); background: #fff;
    border-radius: 999px; padding: 6px 14px; cursor: pointer;
  }
  .sheet-actions button.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 700; }
  .area-group { font-size: 11px; color: var(--muted); margin: 10px 0 4px; font-weight: 700; }
  .area-item { display: flex; align-items: center; gap: 8px; padding: 7px 2px; font-size: 14px; border-bottom: 1px solid var(--bg); }
  .area-item input { width: 18px; height: 18px; }
  .area-item .cnt { color: var(--muted); font-size: 12px; margin-left: auto; }
  .b-prep {
    display: inline-block; margin-top: 6px; margin-right: 6px; font-size: 11px;
    background: #f0f0f0; color: #666; border-radius: 999px; padding: 2px 9px;
  }
  /* 施設内スポットの親チップ */
  .b-in {
    display: inline-block; margin-top: 6px; margin-right: 6px; font-size: 11px;
    background: #eef1f7; color: #44506a; border-radius: 999px; padding: 2px 9px;
    cursor: pointer;
  }
  .b-day {
    display: inline-block; margin-top: 6px; margin-right: 6px; font-size: 11px;
    background: #e6f4f7; color: #1f6f80; border-radius: 999px; padding: 2px 9px;
  }
  .b-stay {
    display: inline-block; margin-top: 6px; margin-right: 6px; font-size: 11px;
    background: #f2ecff; color: #5b3fa8; border-radius: 999px; padding: 2px 9px;
  }
  .onsen-only { display: none; }
  body.cat-onsen .onsen-only { display: inline-block; }
  /* 詳細カード内「この施設内のスポット」 */
  .detail-children {
    margin-top: 12px;
    border-top: 1px solid var(--border);
    padding-top: 10px;
  }
  .dc-title { font-size: 12px; font-weight: 700; color: var(--muted); margin-bottom: 6px; }
  .dc-item {
    display: flex; justify-content: space-between; align-items: center; gap: 8px;
    width: 100%; text-align: left;
    font: inherit; font-size: 14px;
    background: var(--bg); border: 1px solid var(--border); border-radius: 10px;
    padding: 9px 12px; margin-bottom: 6px; cursor: pointer;
  }
  .dc-item .dc-genre { font-size: 11px; color: var(--muted); white-space: nowrap; }
  /* 写真ギャラリー(詳細カード内・横スワイプ) */
  .card-photos {
    display: flex; gap: 8px; overflow-x: auto;
    margin-top: 10px; padding-bottom: 4px;
    -webkit-overflow-scrolling: touch;
  }
  .card-photos img {
    height: 110px; border-radius: 10px; flex: 0 0 auto;
    cursor: pointer; background: var(--border);
  }
  /* 写真タップで拡大表示 */
  .lightbox {
    position: fixed; inset: 0; background: rgba(0,0,0,.85);
    z-index: 70; display: none; align-items: center; justify-content: center;
  }
  .lightbox.open { display: flex; }
  .lightbox img { max-width: 96vw; max-height: 92vh; border-radius: 8px; }
  .map-foot {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 8px;
    padding: 4px 10px 0;
  }
  .legend {
    font-size: 11px;
    color: var(--muted);
    display: flex;
    align-items: center;
    gap: 4px;
    white-space: nowrap;
  }
  .lg-dot {
    width: 10px; height: 10px;
    border-radius: 50% 50% 50% 0;
    transform: rotate(-45deg);
    display: inline-block;
    margin: 0 3px 0 6px;
  }
  .lg-dot:first-child { margin-left: 0; }
  .lg-red { background: #d63031; }
  .lg-blue { background: #2b5cc4; }
  .osm-credit {
    font-size: 10px;
    color: var(--muted);
    text-align: right;
  }
  .osm-credit a { color: var(--muted); }
</style>

<body>

<header>
  <h1>福岡グルメマップ</h1>
  <div class="cat-toggle">
    <button class="cat-btn active" data-cat="gourmet">🍜 お食事</button>
    <button class="cat-btn" data-cat="onsen">♨ 宿・温泉</button>
    <button class="cat-btn" data-cat="play">🎡 遊び場</button>
  </div>
  <div class="searchbar">
    <input id="q" type="search" placeholder="店名・エリア・ジャンルで検索" autocomplete="off" enterkeyhint="search">
    <button id="qClear" type="button" aria-label="検索をクリア">✕</button>
  </div>
  <div class="filters">
    <button class="filter-btn active" data-filter="all">すべて</button>
    <button class="filter-btn" data-filter="visited">訪問済み</button>
    <button class="filter-btn" data-filter="kids">子連れOK</button>
    <button class="filter-btn" data-filter="wish">下調べ</button>
    <button class="filter-btn onsen-only" data-filter="dayuse">日帰りOK</button>
    <button class="filter-btn onsen-only" data-filter="stay">泊まれる</button>
    <button class="filter-btn" id="areaBtn">市区で絞る</button>
  </div>
</header>

<div id="map"></div>
<div class="map-foot">
  <div class="legend">
    <span class="lg-dot lg-red"></span>行った店
    <span class="lg-dot lg-blue"></span>下調べ済み
  </div>
  <div class="osm-credit">地図データ: © <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a> contributors</div>
</div>

<div id="count"></div>
<div id="list"></div>

<footer style="text-align:center; padding:8px 16px 28px; font-size:10.5px; color:var(--muted); line-height:1.8;">
  ※当サイトはアフィリエイト広告を利用しています<br>
  <a href="../about.html" style="color:var(--muted);">運営者情報</a> ・ <a href="../privacy.html" style="color:var(--muted);">プライバシーポリシー</a>
</footer>

<div id="clusterBox">
  <div class="cl-head">
    <h2 id="clusterTitle"></h2>
    <span class="n" id="clusterCount"></span>
    <button class="cl-close" id="clusterClose" aria-label="閉じる">✕</button>
  </div>
  <div id="clusterList"></div>
</div>

<div id="detail"></div>

<div class="lightbox" id="lightbox"><img id="lightboxImg" alt=""></div>



<div class="sheet-back" id="areaBack">
  <div class="sheet" id="areaSheet">
    <div class="sheet-head">
      <h2>市区で絞る(複数選択OK)</h2>
      <div class="sheet-actions">
        <button id="areaClear">クリア</button>
        <button class="primary" id="areaApply">適用</button>
      </div>
    </div>
    <div id="areaListBox"></div>
  </div>
</div>

<script>
const DATA_URL = "../data/spots.json";

const state = {
  spots: [],
  filter: "all",
  category: "gourmet",
  q: "",
  areas: new Set(),
  areasDraft: new Set(),
  markers: [],
  selectedId: null
};

// 投稿から1週間は NEW 扱い
function isNew(spot) {
  if (!spot.posted) return false;
  const d = new Date(spot.posted + "T00:00:00+09:00");
  return (Date.now() - d.getTime()) <= 7 * 24 * 60 * 60 * 1000;
}

async function loadSpots() {
  try {
    const res = await fetch(DATA_URL);
    if (!res.ok) throw new Error("fetch failed: " + res.status);
    const json = await res.json();
    return Array.isArray(json) ? json : [];
  } catch (e) {
    console.error("spots.json の読み込みに失敗しました", e);
    return [];
  }
}

function isKidsOk(spot) {
  // 温泉は家族風呂・貸切風呂があれば周りに気を遣わず子連れで入れる(=子連れOK扱い)
  if (/家族風呂|家族湯|貸切風呂|貸切湯/.test((spot.genre || "") + (spot.verdict || ""))) return true;
  // 行きたい(未訪問)スポットは、ネットで設備の裏が取れたものだけ子連れOK扱いにする
  // (取り込み時に with:"family" を仮置きしているため、withでは判定しない)
  if (spot.wish) {
    const k = spot.kids || {};
    return ["stroller", "diaper", "tatami", "kidsChair", "kidsMenu"].some(key => k[key] === true);
  }
  return spot.with === "family" || (spot.kids !== null && spot.kids !== undefined);
}

// 泊まれる施設か(明示フラグ optional: spot.stay)
function canStay(s) {
  if (s.stay === true) return true;
  if (s.stay === false) return false;
  return /旅館|ホテル|宿|リゾート|ペンション|民宿|別邸/.test((s.genre || "") + (s.name || ""));
}
// 日帰り入浴ができるか(明示フラグ optional: spot.dayUse)
function canDayUse(s) {
  if (s.dayUse === true) return true;
  if (s.dayUse === false) return false;
  const v = s.verdict || "";
  // 「日帰り不可」等の否定表現が先に来る場合は除外
  if (/日帰り[^。]{0,12}(不可|いたしており|できません|なし|していません)/.test(v)) return false;
  if (/日帰り|立ち寄り湯|外来入浴/.test(v)) return true;
  if (/日帰り|スーパー銭湯|銭湯|温浴|スパ|健康ランド|公衆浴場|家族湯|家族風呂|貸切風呂|サウナ|砂むし/.test(s.genre || "")) return true;
  // 入浴料が書かれている＝外来利用できるとみなす(「大人1,500円」「小人700円」等)
  return /(大人|小人|子供|中学生|小学生)[^。]{0,10}[0-9,]{3,6}\s*円/.test(v);
}

// スポットの所属カテゴリ(お食事/宿・温泉/遊び場)  ※おでかけ要素は遊び場に集約
// 1スポットが複数タブに載ることがある(例: 一蘭の森=工場見学だがラーメンを食べに行く場所でもある)。
// その場合は cats:["play","gourmet"] のように配列で持たせる。cats が無ければ従来の category 単独。
const CAT_LABEL = { gourmet: "🍜 お食事", onsen: "♨ 宿・温泉", play: "🎡 遊び場" };
function spotCats(s) {
  if (Array.isArray(s.cats) && s.cats.length) return s.cats;
  if (s.category === "onsen") return ["onsen"];
  if (s.category === "play") return ["play"];
  return ["gourmet"];
}
// 主カテゴリ(バッジ判定など「1つに決めたい」場面用)
function spotCat(s) { return spotCats(s)[0]; }

// 検索は表記ゆれを吸収するため、カタカナ→ひらがな・大小文字・全半角を寄せて比較する
function normalize(s) {
  return (s || "").toLowerCase()
    .replace(/[ァ-ヶ]/g, c => String.fromCharCode(c.charCodeAt(0) - 0x60))
    .replace(/[！-～]/g, c => String.fromCharCode(c.charCodeAt(0) - 0xfee0))
    .replace(/[\s　・･ー\-()（）「」]/g, "");
}
function searchBlob(s) {
  return normalize([s.name, s.area, s.city, s.pref, s.genre, s.verdict].join(" "));
}
function matchQuery(s, q) {
  const terms = q.split(/[\s　]+/).filter(Boolean).map(normalize).filter(Boolean);
  if (!terms.length) return true;
  const blob = searchBlob(s);
  return terms.every(t => blob.includes(t));
}

function applyFilters(spots) {
  // 検索中はカテゴリ・絞り込みを無視して全件から探す(タブを跨いで見つけたいため)
  if (state.q.trim()) return spots.filter(s => matchQuery(s, state.q));
  return spots.filter(s => {
    if (!spotCats(s).includes(state.category)) return false;
    // すべて=赤(訪問済み)+青(行きたい)を同時表示。タブで絞り込み
    if (state.filter === "visited" && s.wish) return false;
    if (state.filter === "kids" && (!isKidsOk(s) || s.wish)) return false;
    if (state.filter === "wish" && !s.wish) return false;
    if (state.filter === "dayuse" && !canDayUse(s)) return false;
    if (state.filter === "stay" && !canStay(s)) return false;
    if (state.areas.size && !state.areas.has(s.city)) return false;
    return true;
  });
}

// 楽天トラベル(A8)アフィリエイトリンク。宿泊・温泉系のカードに表示
const AFF_RAKUTEN_TRAVEL = "https://rpx.a8.net/svt/ejp?a8mat=4BA7X5+1FSQEQ+2HOM+6L1YA&rakuten=y&a8ejpredirect=http%3A%2F%2Fhb.afl.rakuten.co.jp%2Fhgc%2F0eb4779e.5d30c5ba.0eb4779f.b871e4e3%2Fa26081745747_4BA7X5_1FSQEQ_2HOM_6L1YA%3Fpc%3Dhttp%253A%252F%252Ftravel.rakuten.co.jp%252F%26m%3Dhttp%253A%252F%252Ftravel.rakuten.co.jp%252F";
// 楽天トラベルは宿泊予約サイトなので、実際に泊まれる施設にだけボタンを出す。
// (日帰り専用のスーパー銭湯・家族湯に宿泊予約リンクを出すのは紹介になっておらず、
//  楽天アフィリエイト規約の「紹介目的以外の掲載」に触れるため)
function isStaySpot(spot) {
  return canStay(spot);
}

function webUrl(spot) {
  // 公式サイトが登録されていればそれを、無ければGoogleマップの該当スポットを開く
  if (spot.web) return spot.web;
  const q = encodeURIComponent(spot.name + " " + (spot.city || ""));
  if (spot.lat && spot.lng) {
    return `https://www.google.com/maps/search/?api=1&query=${q}&center=${spot.lat},${spot.lng}`;
  }
  return `https://www.google.com/maps/search/?api=1&query=${q}`;
}

function videoLinksHtml(spot, cls) {
  const video = spot.video;
  const items = [];
  if (video && video.youtube) items.push(`<a href="${video.youtube}" target="_blank" rel="noopener">YouTube</a>`);
  if (video && video.tiktok) items.push(`<a href="${video.tiktok}" target="_blank" rel="noopener">TikTok</a>`);
  if (video && video.instagram) items.push(`<a href="${video.instagram}" target="_blank" rel="noopener">Instagram</a>`);
  items.push(`<a class="web-btn" href="${webUrl(spot)}" target="_blank" rel="noopener">🌐 詳細</a>`);
  // 食べログは「詳細」とは別ボタンにする(詳細=公式サイト/地図、食べログ=口コミ・予約)
  if (spot.tabelog) {
    items.push(`<a class="tabelog-btn" href="${spot.tabelog}" target="_blank" rel="noopener">食べログ</a><span class="pr-badge">PR</span>`);
  }
  // アソビューのWEBチケット(生URL→LinkSwitchが自動変換)
  if (spot.asoview) {
    items.push(`<a class="ticket-btn" href="${spot.asoview}" target="_blank" rel="noopener">チケットを買う</a><span class="pr-badge">PR</span>`);
  }
  // 公式サイトの席予約。提携が無く報酬も発生しないのでPR表記は付けない
  if (spot.reserve) {
    items.push(`<a class="reserve-btn" href="${spot.reserve}" target="_blank" rel="noopener">席を予約</a>`);
  }
  if (isStaySpot(spot)) {
    items.push(`<a class="aff-rakuten" href="${AFF_RAKUTEN_TRAVEL}" target="_blank" rel="nofollow noopener">楽天トラベル</a><span class="pr-badge">PR</span>`);
  }
  return `<div class="${cls}">${items.join("")}</div>`;
}

function escapeHtml(str) {
  if (str === null || str === undefined) return "";
  return String(str)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;");
}

// ジャンル文字列から「のれん」の見た目(絵文字・色・札の文字)を決める
function norenStyle(spot) {
  const g = (spot.genre || "") + (spot.category || "");
  const has = (...words) => words.some(w => g.includes(w));
  if (spot.category === "onsen" || has("温泉", "銭湯", "スパ", "サウナ", "湯")) return { cls: "ph-onsen", emoji: "♨️", label: "湯" };
  if (has("ラーメン", "つけ麺", "豚骨")) return { cls: "ph-ramen", emoji: "🍜", label: "麺" };
  if (has("うどん", "そば", "蕎麦")) return { cls: "ph-ramen", emoji: "🍜", label: "麺" };
  if (has("カフェ", "喫茶", "パン", "スイーツ", "ドーナツ", "ケーキ", "デザート")) return { cls: "ph-cafe", emoji: "☕", label: "甘味" };
  if (has("居酒屋", "屋台", "酒場", "焼鳥", "焼き鳥", "串", "おでん", "餃子")) return { cls: "ph-izakaya", emoji: "🏮", label: "酒場" };
  if (has("焼肉", "ホルモン", "ステーキ", "ハンバーグ")) return { cls: "ph-izakaya", emoji: "🍖", label: "肉" };
  if (has("寿司", "鮨", "海鮮", "魚")) return { cls: "ph-food", emoji: "🍣", label: "海鮮" };
  if (has("モール", "ショッピング", "百貨店")) return { cls: "ph-mall", emoji: "🛍️", label: "モール" };
  if (has("ホテル", "旅館", "宿", "リゾート")) return { cls: "ph-hotel", emoji: "🏨", label: "宿" };
  if (has("公園", "遊", "ミュージアム", "こども", "施設", "テーマ", "動物", "水族館")) return { cls: "ph-play", emoji: "🎡", label: "遊び場" };
  return { cls: "ph-food", emoji: "🍴", label: "食事処" };
}

function cardHtml(spot) {
  const area = spot.area ? escapeHtml(spot.area) : "";
  const cityArea = [spot.city ? escapeHtml(spot.city) : "", area].filter(Boolean).join("・");
  const kidsOk = isKidsOk(spot);
  // 訪問済みだが動画がまだ無い店
  const v = spot.video || {};
  const noVideo = !spot.wish && !spot.memo && !v.youtube && !v.tiktok && !v.instagram;
  const ph = norenStyle(spot);
  const thumb = spot.thumb
    ? `<img class="card-thumb" src="thumbs/${escapeHtml(spot.thumb)}" alt="" loading="lazy">`
    : `<div class="card-thumb ph ${ph.cls}"><span class="ph-emoji">${ph.emoji}</span><span class="ph-label">${ph.label}</span></div>`;
  const parent = spot.in ? state.spots.find(p => p.id === spot.in) : null;
  return `
    ${thumb}
    <div class="card-body">
      <div class="card-top">
        <div class="card-name">${escapeHtml(spot.name)}</div>
        <div class="card-genre">${escapeHtml(spot.genre || "")}</div>
      </div>
      <div class="card-area">${cityArea}</div>
      ${spot.verdict ? `<div class="card-verdict">${escapeHtml(spot.verdict)}</div>` : ""}
      ${spot.bathAge ? `<div class="card-bath">♨ ${escapeHtml(spot.bathAge)}</div>` : (spot.category === "onsen" ? `<div class="card-bath">♨ 子供の年齢制限・オムツ可否: 記載無し(要問合せ)</div>` : "")}
      ${isNew(spot) ? `<span class="b-new">NEW</span>` : ""}${spot.wish ? `<span class="b-wish">下調べ済み</span>` : ""}${noVideo ? `<span class="b-prep">🎬 動画準備中</span>` : ""}${parent ? `<span class="b-in" data-jump="${escapeHtml(parent.id)}">📍${escapeHtml(parent.name)} 内</span>` : ""}${spotCats(spot).includes("onsen") && canStay(spot) ? `<span class="b-stay">🛏 泊まれる</span>` : ""}${spotCats(spot).includes("onsen") && canDayUse(spot) ? `<span class="b-day">♨ 日帰りOK</span>` : ""}${state.q.trim() ? `<span class="b-cat">${CAT_LABEL[spotCat(spot)]}</span>` : ""}${spotCats(spot).length > 1 ? `<span class="b-both">${spotCats(spot).includes("gourmet") ? "🍜お食事にも" : "🎡遊び場にも"}</span>` : ""}${kidsOk ? `<div class="card-kids">子連れOK</div>` : ""}
      ${videoLinksHtml(spot, "card-links")}
    </div>
  `;
}

function areaTabSpots(spots) {
  return spots.filter(s => {
    if (!spotCats(s).includes(state.category)) return false;
    if (state.filter === "visited" && s.wish) return false;
    if (state.filter === "kids" && (!isKidsOk(s) || s.wish)) return false;
    if (state.filter === "wish" && !s.wish) return false;
    if (state.filter === "dayuse" && !canDayUse(s)) return false;
    if (state.filter === "stay" && !canStay(s)) return false;
    return true;
  });
}

function populateAreaSelect(spots) {
  const tabSpots = areaTabSpots(spots);
  const prefBy = {};
  tabSpots.forEach(s => { if (s.city && !prefBy[s.city]) prefBy[s.city] = s.pref || "福岡県"; });
  const cities = Object.keys(prefBy);
  const WARDS = ["福岡市東区", "福岡市博多区", "福岡市中央区", "福岡市南区", "福岡市城南区", "福岡市早良区", "福岡市西区"];
  const PREFS = ["佐賀県", "長崎県", "大分県", "熊本県", "宮崎県", "鹿児島県", "山口県", "広島県", "岡山県", "愛媛県", "大阪府"];
  const rank = c => {
    const w = WARDS.indexOf(c);
    if (w >= 0) return w;
    if (prefBy[c] === "福岡県") return 100;
    const p = PREFS.indexOf(prefBy[c]);
    return 200 + (p >= 0 ? p : PREFS.length);
  };
  cities.sort((a, b) => rank(a) - rank(b) || a.localeCompare(b, "ja"));
  const countBy = {};
  tabSpots.forEach(s => { if (s.city) countBy[s.city] = (countBy[s.city] || 0) + 1; });
  // 選択中で消えた市区を落とす
  [...state.areas].forEach(a => { if (!cities.includes(a)) state.areas.delete(a); });
  state.areasDraft = new Set(state.areas);
  const box = document.getElementById("areaListBox");
  let html = ""; let lastGroup = "";
  cities.forEach(c => {
    const g = rank(c) < 100 ? "福岡市" : (prefBy[c] === "福岡県" ? "福岡県内" : prefBy[c]);
    if (g !== lastGroup) { html += `<div class="area-group">${g}</div>`; lastGroup = g; }
    const label = prefBy[c] === "福岡県" ? c : c;
    html += `<label class="area-item"><input type="checkbox" value="${escapeHtml(c)}" ${state.areasDraft.has(c) ? "checked" : ""}><span>${escapeHtml(label)}</span><span class="cnt">${countBy[c]}</span></label>`;
  });
  box.innerHTML = html || `<div class="memo-hint">このタブに市区データがありません</div>`;
  box.querySelectorAll("input[type=checkbox]").forEach(cb => {
    cb.addEventListener("change", () => {
      if (cb.checked) state.areasDraft.add(cb.value); else state.areasDraft.delete(cb.value);
    });
  });
  updateAreaBtn();
}

function updateAreaBtn() {
  const b = document.getElementById("areaBtn");
  b.textContent = state.areas.size ? `市区で絞る(${state.areas.size})` : "市区で絞る";
  b.classList.toggle("active", state.areas.size > 0);
}

function clearMarkers() {
  state.markers.forEach(m => m.marker.remove());
  state.markers = [];
}

// ===== 詳細カード(ピン/リスト共通の詳細表示) =====
function updatePinHighlight() {
  state.markers.forEach(({ spot, items, marker }) => {
    // まとめたピンは中に選択中の店が含まれていれば強調する
    const on = spot ? spot.id === state.selectedId
                    : !!(items && items.some(s => s.id === state.selectedId));
    marker.getElement().classList.toggle("pin-selected", on);
  });
}

function openDetail(spot) {
  const detail = document.getElementById("detail");
  // 写真ギャラリー(横スワイプ、タップで拡大)
  const photosHtml = (spot.photos && spot.photos.length) ? `
    <div class="card-photos">${spot.photos.map(p => `<img src="photos/${escapeHtml(p)}" loading="lazy" data-photo="${escapeHtml(p)}" alt="">`).join("")}</div>` : "";
  // この施設内に登録されているスポット(親→子リンク)
  // 情報が充実しているもの(動画あり>写真あり>訪問済み>ひとことあり)を上に並べる
  const childScore = c => {
    const v = c.video || {};
    let n = 0;
    if (v.youtube || v.tiktok || v.instagram) n += 8;
    if (c.photos && c.photos.length) n += 4;
    if (!c.wish) n += 2;
    if (c.verdict) n += 1;
    return n;
  };
  const children = state.spots.filter(s => s.in === spot.id)
    .sort((a, b) => childScore(b) - childScore(a) || (a.name || "").localeCompare(b.name || "", "ja"));
  const childrenHtml = children.length ? `
    <div class="detail-children">
      <div class="dc-title">この施設内のスポット</div>
      ${children.map(c => {
        const v = c.video || {};
        const mark = (v.youtube || v.tiktok || v.instagram) ? "🎬" : (c.photos && c.photos.length ? "📷" : "");
        return `<button class="dc-item" data-jump="${escapeHtml(c.id)}"><span>${mark}${escapeHtml(c.name)}</span><span class="dc-genre">${escapeHtml(c.genre || "")}</span></button>`;
      }).join("")}
    </div>` : "";
  // 関連スポット(同チェーンの動画がある店など)
  const relatedSpots = (spot.related || []).map(id => state.spots.find(s => s.id === id)).filter(Boolean);
  const relatedHtml = relatedSpots.length ? `
    <div class="detail-children">
      <div class="dc-title">関連スポット(同チェーン等)</div>
      ${relatedSpots.map(c => { const v = c.video || {}; const hasV = v.youtube || v.tiktok || v.instagram; return `<button class="dc-item" data-jump="${escapeHtml(c.id)}"><span>${escapeHtml(c.name)}${hasV ? " 🎬動画あり" : ""}</span><span class="dc-genre">${escapeHtml(c.genre || "")}</span></button>`; }).join("")}
    </div>` : "";
  detail.innerHTML = `
    <div class="detail-grip"></div>
    <button class="detail-close" id="detailClose">✕</button>
    <div class="card">${cardHtml(spot)}</div>
    ${photosHtml}
    ${childrenHtml}
    ${relatedHtml}
  `;
  detail.classList.add("open");
  document.getElementById("detailClose").addEventListener("click", closeDetail);
document.getElementById("clusterClose").addEventListener("click", () => {
  document.getElementById("clusterBox").classList.remove("open");
});
  bindJumpLinks(detail);
  detail.querySelectorAll("[data-photo]").forEach(el => {
    el.addEventListener("click", (e) => {
      e.stopPropagation();
      document.getElementById("lightboxImg").src = "photos/" + el.dataset.photo;
      document.getElementById("lightbox").classList.add("open");
    });
  });
}

document.getElementById("lightbox").addEventListener("click", () => {
  document.getElementById("lightbox").classList.remove("open");
  document.getElementById("lightboxImg").src = "";
});

// 親子リンク([data-jump])のクリックで対象スポットへ飛ぶ
function bindJumpLinks(root) {
  root.querySelectorAll("[data-jump]").forEach(el => {
    el.addEventListener("click", (e) => {
      e.stopPropagation();
      const target = state.spots.find(s => s.id === el.dataset.jump);
      if (target) jumpToSpot(target);
    });
  });
}

function jumpToSpot(spot) {
  // 検索中はカテゴリ横断で出しているので、タブ切り替えはしない
  if (state.q.trim()) { renderAll(); focusSpot(spot); window.scrollTo({ top: 0, behavior: "smooth" }); return; }
  // 別カテゴリのスポットならタブを切り替える
  const cat = spotCat(spot);
  if (cat !== state.category) {
    state.category = cat;
    document.querySelectorAll(".cat-btn").forEach(b => b.classList.toggle("active", b.dataset.cat === cat));
    populateAreaSelect(state.spots);
  }
  // 現在のフィルタで対象が表示されない場合は「すべて」に戻す
  if (!applyFilters(state.spots).some(s => s.id === spot.id)) {
    state.filter = "all";
    state.areas = new Set();
    updateAreaBtn();
    document.querySelectorAll(".filter-btn").forEach(b => b.classList.toggle("active", b.dataset.filter === "all"));
  }
  renderAll();
  focusSpot(spot);
  window.scrollTo({ top: 0, behavior: "smooth" });
}

function closeDetail() {
  document.getElementById("detail").classList.remove("open");
  state.selectedId = null;
  renderList();
  updatePinHighlight();
}

function focusSpot(spot) {
  state.selectedId = spot.id;
  renderList();
  updatePinHighlight();
  openDetail(spot);
  if (spot.lat !== null && spot.lng !== null && spot.lat !== undefined && spot.lng !== undefined && window._map) {
    window._map.flyTo({ center: [spot.lng, spot.lat], zoom: 15, essential: true });
  }
}

function renderList() {
  const list = document.getElementById("list");
  const countEl = document.getElementById("count");
  // NEW(投稿1週間以内)をリスト最上部に
  const filtered = applyFilters(state.spots).slice().sort((a, b) => (isNew(b) ? 1 : 0) - (isNew(a) ? 1 : 0));

  countEl.textContent = !state.spots.length ? ""
    : state.q.trim() ? `「${state.q.trim()}」の検索結果 ${filtered.length}件(全カテゴリから)`
    : `${filtered.length}件表示中(全${state.spots.length}件)`;

  if (!state.spots.length) {
    list.innerHTML = `<div class="empty">まだ登録されたお店がありません。<br>data/spots.json に追加すると、ここと地図に表示されます。</div>`;
    return;
  }
  if (!filtered.length) {
    list.innerHTML = state.q.trim()
      ? `<div class="empty">「${escapeHtml(state.q.trim())}」に一致するお店はありませんでした。<br>店名の一部・エリア名・ジャンルでも探せます。</div>`
      : `<div class="empty">条件に合うお店が見つかりませんでした。</div>`;
    return;
  }

  list.innerHTML = filtered.map(s => `
    <div class="card${s.id === state.selectedId ? " selected" : ""}" data-id="${escapeHtml(s.id)}">
      ${cardHtml(s)}
    </div>
  `).join("");

  list.querySelectorAll(".card").forEach(el => {
    el.addEventListener("click", () => {
      const spot = state.spots.find(s => s.id === el.dataset.id);
      if (spot) {
        focusSpot(spot);
        // リストから選んだら地図までスクロールで戻す(ハイライトを見せる)
        window.scrollTo({ top: 0, behavior: "smooth" });
      }
    });
  });
  bindJumpLinks(list);
}

// 同じ場所に集まったピンは1つにまとめ、中に件数を出す。
// 福岡空港やモールのように「1施設に何十軒も入る」場所で、
// ピンが積み重なってタップできなくなるのを防ぐ目的。
const CLUSTER_PX = 44;   // この画素数より近いピン同士はまとめる

function makePinEl(spot) {
  const el = document.createElement("div");
  el.className = "pin";
  el.style.background = spot.wish ? "#2b5cc4" : "#d63031";
  if (isNew(spot)) {
    el.classList.add("pin-new");
    const lab = document.createElement("span");
    lab.className = "pin-new-label";
    lab.textContent = "NEW";
    el.appendChild(lab);
  }
  return el;
}

function makeClusterEl(items) {
  const el = document.createElement("div");
  el.className = "pin-cluster";
  // 1件でも未訪問(青)が混ざれば青系、全部訪問済みなら赤系にして一目で分かるように
  const allVisited = items.every(s => !s.wish);
  el.classList.add(allVisited ? "pc-red" : "pc-blue");
  el.textContent = items.length;
  return el;
}

function renderMarkers() {
  clearMarkers();
  const map = window._map;
  if (!map) return;
  const filtered = applyFilters(state.spots).filter(s => s.lat !== null && s.lng !== null && s.lat !== undefined && s.lng !== undefined);

  // ① まず「同じ施設に入っている店」を1つの単位にまとめる。
  //    施設を最小単位として扱うので、いくらズームしてもここは分散させない
  //    (福岡空港のように1棟に何十軒も入る場所は、バラすと同じ施設だと分からなくなるため)
  const byParent = {};
  const singles = [];
  filtered.forEach(s => {
    if (s.in && state.spots.some(p => p.id === s.in)) {
      (byParent[s.in] = byParent[s.in] || []).push(s);
    } else singles.push(s);
  });
  const units = [];   // {items, lat, lng, facility}
  Object.keys(byParent).forEach(pid => {
    const kids = byParent[pid];
    if (kids.length === 1) { singles.push(kids[0]); return; }
    const par = state.spots.find(p => p.id === pid);
    units.push({
      items: kids, facility: par || null,
      lat: par ? par.lat : kids.reduce((a, s) => a + s.lat, 0) / kids.length,
      lng: par ? par.lng : kids.reduce((a, s) => a + s.lng, 0) / kids.length
    });
  });
  singles.forEach(s => units.push({ items: [s], facility: null, lat: s.lat, lng: s.lng }));

  // ② その上で、画面上で近い単位同士をまとめる(ズームすれば単位ごとにほどける)
  const pts = units.map(u => ({ u, pt: map.project([u.lng, u.lat]) }));
  const used = new Array(pts.length).fill(false);
  const groups = [];
  for (let i = 0; i < pts.length; i++) {
    if (used[i]) continue;
    const g = [pts[i]];
    used[i] = true;
    for (let j = i + 1; j < pts.length; j++) {
      if (used[j]) continue;
      const dx = pts[i].pt.x - pts[j].pt.x, dy = pts[i].pt.y - pts[j].pt.y;
      if (dx * dx + dy * dy < CLUSTER_PX * CLUSTER_PX) { g.push(pts[j]); used[j] = true; }
    }
    groups.push(g);
  }

  groups.forEach(g => {
    const us = g.map(x => x.u);
    const items = us.flatMap(u => u.items);
    const lng = us.reduce((a, u) => a + u.lng, 0) / us.length;
    const lat = us.reduce((a, u) => a + u.lat, 0) / us.length;

    if (items.length === 1) {
      const spot = items[0];
      const el = makePinEl(spot);
      const marker = new maplibregl.Marker({ element: el }).setLngLat([spot.lng, spot.lat]).addTo(map);
      el.addEventListener("click", (ev) => { ev.stopPropagation(); focusSpot(spot); });
      state.markers.push({ spot, marker });
      return;
    }
    // 単位が1つだけ = 同じ施設のまとまり。ズームしても割れないので、押したら必ずリストを出す
    const soleFacility = us.length === 1 && us[0].facility ? us[0].facility : null;
    const el = makeClusterEl(items);
    if (soleFacility) el.classList.add("pc-facility");
    const marker = new maplibregl.Marker({ element: el }).setLngLat([lng, lat]).addTo(map);
    el.addEventListener("click", (ev) => {
      ev.stopPropagation();
      if (soleFacility) showClusterList(items, soleFacility);
      else openCluster(items, [lng, lat]);
    });
    state.markers.push({ spot: null, items, marker });
  });
  updatePinHighlight();
}

// まとめたピンをタップしたとき。まだ広げられるならズームし、
// これ以上ズームしても離れない(同じ建物内など)ならリストを出す
function openCluster(items, center) {
  const map = window._map;
  const z = map.getZoom();
  const spread = Math.max(
    ...items.map(a => Math.max(...items.map(b => Math.abs(a.lat - b.lat) + Math.abs(a.lng - b.lng))))
  );
  if (z < 17.5 && spread > 0.0004) {
    map.flyTo({ center, zoom: Math.min(18, z + 2.5), essential: true });
    return;
  }
  showClusterList(items);
}

function showClusterList(items, facility) {
  const box = document.getElementById("clusterBox");
  const parent = facility || (items[0].in ? state.spots.find(s => s.id === items[0].in) : null);
  const sameParent = parent && items.every(s => s.in === parent.id);
  document.getElementById("clusterTitle").textContent =
    sameParent ? `${parent.name} 内のスポット` : "この場所のスポット";
  document.getElementById("clusterCount").textContent = `${items.length}件`;
  document.getElementById("clusterList").innerHTML = items
    // 動画あり > 訪問済み > 子連れOK を上に。同条件ならジャンル順
    .slice().sort((a, b) => {
      const sc = s => {
        const v = s.video || {};
        return ((v.youtube || v.tiktok || v.instagram) ? 4 : 0) + (!s.wish ? 2 : 0) + (isKidsOk(s) ? 1 : 0);
      };
      return sc(b) - sc(a) || (a.genre || "").localeCompare(b.genre || "", "ja");
    })
    .map(s => {
      const v = s.video || {};
      const tags = [
        s.wish ? `<span class="cl-tag t-wish">🔵 下調べ済み</span>`
               : `<span class="cl-tag t-visited">🔴 訪問済み</span>`,
        isKidsOk(s) ? `<span class="cl-tag t-kids">子連れOK</span>` : "",
        (v.youtube || v.tiktok || v.instagram) ? `<span class="cl-tag t-video">🎬 動画あり</span>` : ""
      ].join("");
      return `<button class="cl-item" data-cid="${escapeHtml(s.id)}">
        <span class="cl-top">
          <span class="cl-name">${escapeHtml(s.name)}</span>
          <span class="cl-genre">${escapeHtml(s.genre || "")}</span>
        </span>
        <span class="cl-tags">${tags}</span>
      </button>`;
    }).join("");
  box.querySelectorAll("[data-cid]").forEach(b => {
    b.addEventListener("click", () => {
      const sp = state.spots.find(x => x.id === b.dataset.cid);
      box.classList.remove("open");
      if (sp) focusSpot(sp);
    });
  });
  box.classList.add("open");
}

function renderAll() {
  // フィルタ変更で選択中の店が対象外になったら詳細カードを閉じる
  if (state.selectedId !== null && !applyFilters(state.spots).some(s => s.id === state.selectedId)) {
    document.getElementById("detail").classList.remove("open");
    state.selectedId = null;
  }
  renderMarkers();
  renderList();
}

function initMap(spots) {
  const withCoords = spots.filter(s => s.lat !== null && s.lng !== null && s.lat !== undefined && s.lng !== undefined);
  // ターゲットは福岡県民のため、初期表示は常に福岡県(福岡都市圏中心)
  const center = [130.45, 33.55];

  const map = new maplibregl.Map({
    container: "map",
    style: {
      version: 8,
      sources: {
        osm: {
          type: "raster",
          tiles: ["https://tile.openstreetmap.org/{z}/{x}/{y}.png"],
          tileSize: 256,
          attribution: "&copy; OpenStreetMap contributors"
        }
      },
      layers: [
        { id: "osm", type: "raster", source: "osm" }
      ]
    },
    center: center,
    zoom: 8.7
  });
  map.addControl(new maplibregl.NavigationControl({ showCompass: false }), "top-right");
  // 現在地ボタン(Googleマップ風。押すと現在地へ移動+青ドット表示)
  const geolocate = new maplibregl.GeolocateControl({
    positionOptions: { enableHighAccuracy: true },
    trackUserLocation: true,
    showUserLocation: true,
    fitBoundsOptions: { maxZoom: 13 }
  });
  map.addControl(geolocate, "top-right");
  window._map = map;

  // ズーム/移動のたびにまとめ直す(寄れば自然にピンがほどける)
  let _reMark = null;
  map.on("moveend", () => {
    clearTimeout(_reMark);
    _reMark = setTimeout(() => { if (state.spots.length) renderMarkers(); }, 120);
  });

  map.on("load", () => {
    renderAll();
    // 開いた時に現在地を中央へ(位置情報が許可されている場合のみ。拒否時は福岡全域表示のまま)
    try { geolocate.trigger(); } catch (e) {}
  });
  map.on("click", (e) => {
    // 地図の空きエリアタップで詳細カードを閉じる
    if (state.selectedId !== null) closeDetail();
  });
}


// ===== 市区パネル =====
document.getElementById("areaBtn").addEventListener("click", () => {
  populateAreaSelect(state.spots);
  document.getElementById("areaBack").classList.add("open");
});
document.getElementById("areaBack").addEventListener("click", (e) => {
  if (e.target.id === "areaBack") document.getElementById("areaBack").classList.remove("open");
});
document.getElementById("areaClear").addEventListener("click", () => {
  state.areasDraft = new Set();
  document.querySelectorAll("#areaListBox input[type=checkbox]").forEach(cb => cb.checked = false);
});
document.getElementById("areaApply").addEventListener("click", () => {
  state.areas = new Set(state.areasDraft);
  document.getElementById("areaBack").classList.remove("open");
  updateAreaBtn();
  renderAll();
});

// 検索ボックス。入力のたびに全件から絞り込む(件数が1000弱なので遅延不要)
const qInput = document.getElementById("q");
const qClear = document.getElementById("qClear");
function applyQuery() {
  state.q = qInput.value;
  qClear.classList.toggle("on", !!state.q);
  // 検索中はカテゴリ・絞り込みの見た目を無効化して、全件検索であることを示す
  document.querySelector(".cat-toggle").style.opacity = state.q.trim() ? .4 : "";
  document.querySelector(".filters").style.opacity = state.q.trim() ? .4 : "";
  renderAll();
}
qInput.addEventListener("input", applyQuery);
qInput.addEventListener("search", applyQuery);
qClear.addEventListener("click", () => { qInput.value = ""; applyQuery(); qInput.focus(); });

document.querySelectorAll(".cat-btn").forEach(btn => {
  btn.addEventListener("click", () => {
    document.querySelectorAll(".cat-btn").forEach(b => b.classList.remove("active"));
    btn.classList.add("active");
    state.category = btn.dataset.cat;
    document.body.classList.toggle("cat-onsen", state.category === "onsen");
    // 温泉タブ専用フィルタを選んだまま他タブへ移ったら「すべて」に戻す
    if (state.category !== "onsen" && (state.filter === "dayuse" || state.filter === "stay")) {
      state.filter = "all";
      document.querySelectorAll(".filter-btn").forEach(b => b.classList.toggle("active", b.dataset.filter === "all"));
    }
    populateAreaSelect(state.spots);
    renderAll();
  });
});

document.querySelectorAll(".filter-btn").forEach(btn => {
  btn.addEventListener("click", () => {
    document.querySelectorAll(".filter-btn").forEach(b => b.classList.remove("active"));
    btn.classList.add("active");
    state.filter = btn.dataset.filter;
    populateAreaSelect(state.spots);
    renderAll();
  });
});



(async function main() {
  const spots = await loadSpots();
  state.spots = spots;
  populateAreaSelect(spots);
  initMap(spots);
  if (!spots.length) {
    renderList();
  }
})();
</script>
