<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>福岡グルメマップ</title>
<link rel="apple-touch-icon" href="../icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="../icons/favicon-32.png">
<link rel="manifest" href="../manifest.json">
<meta name="apple-mobile-web-app-title" content="福岡子育てグルメ">
<meta name="theme-color" content="#d63031">
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">
<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<style>
  :root {
    --accent: #d63031;
    --accent-soft: #ffe3e3;
    --text: #222;
    --muted: #767676;
    --border: #e5e5e5;
    --bg: #fafafa;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    font-family: "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans JP", "Yu Gothic", Meiryo, sans-serif;
    color: var(--text);
    background: var(--bg);
    -webkit-text-size-adjust: 100%;
  }
  header {
    position: sticky; top: 0; z-index: 20;
    background: #fff;
    border-bottom: 1px solid var(--border);
    padding: 10px 12px 8px;
  }
  h1 {
    font-size: 15px;
    margin: 0 0 8px;
    font-weight: 700;
    color: var(--text);
  }
  .cat-toggle {
    display: flex;
    gap: 0;
    margin-bottom: 8px;
    border: 1px solid var(--border);
    border-radius: 10px;
    overflow: hidden;
    width: fit-content;
  }
  .cat-btn {
    border: none;
    background: #fff;
    color: var(--text);
    padding: 8px 16px;
    font-size: 13px;
    font-weight: 700;
    cursor: pointer;
  }
  .cat-btn.active {
    background: #2d3436;
    color: #fff;
  }
  /* ★イベント一覧への入口【2026-09-16追加】。カテゴリのタブではなく**リンク**なので
     緑にして「別の画面へ移る」ことが分かるようにする(events.html の主色と合わせる) */
  .cat-btn.cat-link {
    background: #0f6e5c;
    color: #fff;
    text-decoration: none;
    display: inline-block;
  }
  .b-new {
    display: inline-block;
    margin-right: 6px;
    font-size: 11px;
    font-weight: 800;
    background: #ffd32a;
    color: #6d4c00;
    border-radius: 999px;
    padding: 2px 9px;
    animation: newpulse 1.6s ease-in-out infinite;
  }
  /* 会期のある企画展。ピンはオレンジ+⏳、カードには残り日数を出す */
  /* 期間限定の帯。カードを開いた瞬間に「今だけ」が伝わるように先頭へ大きく出す */
  .ltd-band {
    display: flex;
    align-items: center;
    gap: 7px;
    flex-wrap: wrap;
    margin: 2px 0 7px;
    padding: 7px 10px;
    border-radius: 10px;
    background: linear-gradient(90deg, #fff6d5, #ffeaa7);
    border: 1.5px solid #f9ca24;
    box-shadow: 0 1px 4px rgba(249,202,36,.35);
  }
  .ltd-band.soon {
    background: linear-gradient(90deg, #ffe3e0, #ffc9c4);
    border-color: #e17055;
  }
  .ltd-icon { font-size: 15px; line-height: 1; }
  .ltd-main { font-size: 13px; font-weight: 800; color: #4a3600; }
  .ltd-band.soon .ltd-main { color: #7a2018; }
  .ltd-sub  { font-size: 11.5px; font-weight: 700; color: #7a6400; }
  /* おもちゃの中身など、期間の次に知りたい一言。行全体を折り返して出す */
  .ltd-note { flex-basis: 100%; font-size: 11.5px; color: #6b5800; line-height: 1.45; }
  .ltd-band.soon .ltd-note { color: #8a3a2e; }
  .ltd-band.soon .ltd-sub { color: #a33227; }
  .ltd-sub b { color: #c0392b; }
  .ltd-link {
    margin-left: auto;
    font-size: 11.5px;
    font-weight: 800;
    color: #6d4c00;
    text-decoration: underline;
  }
  .pin-limited-label {
    position: absolute;
    top: -7px; right: -7px;
    font-size: 12px;
    line-height: 1;
    pointer-events: none;
  }
  @keyframes newpulse {
    0%, 100% { opacity: 1; }
    50% { opacity: .55; }
  }
  .pin {
    width: 22px; height: 22px;
    border-radius: 50% 50% 50% 0;
    transform: rotate(-45deg);
    border: 2px solid #fff;
    box-shadow: 0 1px 3px rgba(0,0,0,.4);
    cursor: pointer;
  }
  /* まとめたピン(中に件数) */
  .pin-cluster {
    min-width: 34px; height: 34px;
    padding: 0 6px;
    border-radius: 999px;
    border: 2px solid #fff;
    box-shadow: 0 2px 6px rgba(0,0,0,.35);
    color: #fff;
    font-size: 14px;
    font-weight: 800;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
  }
  .pc-blue { background: #2b5cc4; }
  /* まとめピンは外周リングで赤(訪問済み)の割合を出し、中の丸に件数を書く */
  .pin-cluster { padding: 4px; box-sizing: border-box; }
  .pc-inner {
    width: 100%; height: 100%;
    border-radius: 999px;
    background: #2b5cc4;
    display: flex; align-items: center; justify-content: center;
    font-size: 13px; font-weight: 800; color: #fff;
    padding: 0 4px;
  }
  .pc-inner.pc-red { background: #d63031; }
  /* 同じ施設のまとまり。押すと必ずリストが出るので、丸ピンと形を変えて区別する */
  .pin-cluster.pc-facility {
    border-radius: 9px;
    min-width: 38px;
    height: 30px;
  }
  .pin-cluster.pc-facility::before { content: "🏢"; font-size: 11px; margin-right: 3px; }
  .pc-red  { background: #d63031; }
  /* まとめたピンの中身リスト(下から出るシート) */
  #clusterBox {
    position: fixed; left: 0; right: 0; bottom: 0;
    z-index: 60;
    background: #fff;
    border-radius: 16px 16px 0 0;
    box-shadow: 0 -4px 20px rgba(0,0,0,.2);
    max-height: 70vh;
    max-height: 70dvh;   /* iOSはvhがブラウザUIを含むので画面外にはみ出す */
    display: flex; flex-direction: column;
    transform: translateY(101%);
    transition: transform .22s ease;
  }
  #clusterBox.open { transform: translateY(0); }
  /* まとめピンのリストを出している間は下の一覧シートを隠す。隠さないと、リストの背の低いときに
     一覧の先頭カード(ボートレース福岡など無関係の店)が上にはみ出して見える(2026-10-21ユーザー指摘) */
  body.cl-open #bsheet { visibility: hidden; }
  .cl-head {
    display: flex; align-items: center; gap: 8px;
    padding: 12px 14px 8px;
    border-bottom: 1px solid var(--border);
    flex: 0 0 auto;
  }
  .cl-head h2 { font-size: 15px; margin: 0; flex: 1; font-weight: 700; }
  .cl-head .n { font-size: 12px; color: var(--muted); }
  .cl-close {
    border: none; background: #f0f0f0; color: var(--text);
    width: 30px; height: 30px; border-radius: 50%;
    font-size: 15px; cursor: pointer;
  }
  #clusterList {
    flex: 1 1 auto;
    min-height: 0;              /* これが無いとflex子が縮まずスクロールしない */
    overflow-y: auto;
    overscroll-behavior: contain;
    -webkit-overflow-scrolling: touch;
    padding: 2px 10px 24px;
  }
  .cl-item {
    display: block; width: 100%;
    text-align: left;
    padding: 10px 10px 9px;
    border: none; border-bottom: 1px solid var(--border);
    background: #fff;
    font-family: inherit; font-size: 14px; color: var(--text);
    cursor: pointer;
  }
  .cl-item:active { background: var(--accent-soft); }
  /* 施設そのもの(親)の行。子の店と見分けが付くように色と枠を変える
     ⚠タブに関係なく先頭に固定で出す(2026-09-21。お食事タブで親が消えていた) */
  .cl-item.cl-facility {
    background: #f4f8f7;
    border-bottom: 2px solid var(--accent);
    border-left: 4px solid var(--accent);
  }
  .cl-item.cl-facility .cl-name { font-weight: 700; }
  .cl-top { display: flex; gap: 10px; align-items: baseline; }
  .cl-name { flex: 1; font-weight: 600; line-height: 1.35; }
  .cl-genre { font-size: 11px; color: var(--muted); white-space: nowrap; }
  .cl-tags { margin-top: 5px; display: flex; gap: 5px; flex-wrap: wrap; }
  .cl-tag {
    font-size: 10.5px;
    border-radius: 999px;
    padding: 2px 8px;
    white-space: nowrap;
  }
  .t-visited { background: #ffe3e3; color: #b02525; }   /* 赤ピン=訪問済み */
  .t-wish    { background: #e3ecff; color: #2b5cc4; }   /* 青ピン=下調べ済み */
  .t-kids    { background: #e8772e; color: #fff; }   /* 子連れ歓迎 */
  .t-ltd     { background: #fff6d5; color: #8a6d00; font-weight: 800; }
  .t-fk      { background: #d9f2ee; color: #0b5348; font-weight: 800; }
  .t-video   { background: #fff3e3; color: #b05a00; }
  .t-photo   { background: #eef3fb; color: #3a5c8c; }
  .t-open    { background: var(--accent); color: #fff; font-weight: 700; }
  /* 九州ふっこう応援割の帯。コラボ(金)と区別できるよう青緑系にする */
  .fk-band {
    display: flex; align-items: center; gap: 7px; flex-wrap: wrap;
    margin: 2px 0 7px; padding: 7px 10px; border-radius: 10px;
    background: linear-gradient(90deg, #e3f7f4, #c9efe9);
    border: 1.5px solid #14a085;
    box-shadow: 0 1px 4px rgba(20,160,133,.3);
  }
  .fk-icon { font-size: 15px; line-height: 1; }
  .fk-main { font-size: 13px; font-weight: 800; color: #0b5348; }
  .fk-rate {
    font-size: 13px; font-weight: 900; color: #fff; background: #0E9384;
    border-radius: 999px; padding: 1px 9px;
  }
  .fk-sub  { flex-basis: 100%; font-size: 11.5px; font-weight: 700; color: #12695c; line-height: 1.45; }
  .fk-note { flex-basis: 100%; font-size: 11.5px; color: #12695c; line-height: 1.45; }
  /* 「対象施設だが枠が尽きていると割引は出ない」の注意。見落とされると
     予約できると誤解させるので、帯の中でも一段目立たせる(白地+橙の縁) */
  .fk-caution {
    flex-basis: 100%; font-size: 11.5px; font-weight: 700; color: #8a4b00;
    line-height: 1.5; background: #fff8ee; border: 1px solid #f0b871;
    border-radius: 8px; padding: 5px 8px;
  }
  .fk-caution b { color: #7a3f00; }
  .fk-links { flex-basis: 100%; font-size: 11.5px; font-weight: 700; color: #12695c; }
  .fk-links a { color: #0b5348; text-decoration: underline; }
  /* 応援割のピン。赤(訪問済み)/青(下調べ)は変えず、青緑のリングと🏨だけ重ねる */
  .pin-fukko {
    box-shadow: 0 0 0 3px #0E9384, 0 1px 5px rgba(0,0,0,.45);
  }
  /* ★子連れ大歓迎(4段目)のピンに星(2026-10-27 お客さんにも公開) */
  .pin-top-label {
    display: block; position: absolute; top: -14px; left: -10px; transform: rotate(45deg);
    font-size: 13px; line-height: 1; filter: drop-shadow(0 0 1px #fff);
  }
  .pin-fukko-label {
    position: absolute; top: -15px; left: 9px; transform: rotate(45deg);
    background: #0E9384; color: #fff; font-size: 10px; font-weight: 800;
    border-radius: 6px; padding: 0 3px;
  }
  .pin-new {
    animation: pinpulse 1.6s ease-in-out infinite;
  }
  /* 開催中のコラボ・期間限定。元のピンの色(赤=訪問済み/青=下調べ)は変えず、
     金のリングとバッジだけを重ねる。会期が切れたらリングとバッジだけ消える */
  .pin-campaign {
    box-shadow: 0 0 0 3px #f9ca24, 0 1px 5px rgba(0,0,0,.45);
  }
  .pin-campaign-label {
    position: absolute;
    top: -15px;
    left: 9px;
    transform: rotate(45deg);
    background: #f9ca24;
    color: #5b4300;
    font-size: 10px;
    font-weight: 800;
    border-radius: 6px;
    padding: 0 3px;
    line-height: 14px;
    pointer-events: none;
    white-space: nowrap;
  }
  /* 会期が終わったら消えてよい単発イベント(企画展など)はピン本体を持たず、
     金リング+バッジだけで示す */
  .pin-eventonly {
    background: #fffbe6 !important;
    border-color: #f9ca24;
  }
  @keyframes pinpulse {
    0%, 100% { box-shadow: 0 1px 3px rgba(0,0,0,.4), 0 0 0 0 rgba(255,211,42,.9); }
    50% { box-shadow: 0 1px 3px rgba(0,0,0,.4), 0 0 0 9px rgba(255,211,42,0); }
  }
  .pin-new-label {
    position: absolute;
    top: -14px;
    left: 10px;
    transform: rotate(45deg);
    background: #ffd32a;
    color: #6d4c00;
    font-size: 9px;
    font-weight: 800;
    border-radius: 6px;
    padding: 0 4px;
    line-height: 14px;
    pointer-events: none;
  }
  .card-bath {
    margin-top: 6px;
    font-size: 12px;
    color: #b05a00;
    background: #fff3e3;
    border-radius: 8px;
    padding: 4px 8px;
    display: inline-block;
  }
  .searchbar {
    position: relative;
    margin-bottom: 8px;
  }
  .searchbar input {
    width: 100%;
    padding: 9px 34px 9px 12px;
    font-size: 15px;   /* 16px未満だとiOSで拡大されるので注意 */
    font-family: inherit;
    color: var(--text);
    background: #fff;
    border: 1px solid var(--border);
    border-radius: 10px;
    -webkit-appearance: none;
  }
  .searchbar input:focus {
    outline: none;
    border-color: var(--accent);
    box-shadow: 0 0 0 2px var(--accent-soft);
  }
  .searchbar input::-webkit-search-cancel-button { display: none; }
  #qClear {
    position: absolute;
    top: 50%; right: 6px;
    transform: translateY(-50%);
    display: none;
    border: none;
    background: transparent;
    color: var(--muted);
    font-size: 15px;
    padding: 4px 6px;
    cursor: pointer;
  }
  #qClear.on { display: block; }
  /* 検索中は全カテゴリを横断するので、どのタブの結果かを示す */
  .b-cat {
    display: inline-block;
    margin-top: 6px;
    margin-right: 6px;
    font-size: 11px;
    background: #f0efe8;
    color: #6b6552;
    border-radius: 999px;
    padding: 2px 9px;
  }
  .filters {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
    align-items: center;
  }
  .filter-btn {
    border: 1px solid var(--border);
    background: #fff;
    color: var(--text);
    padding: 7px 14px;
    border-radius: 999px;
    font-size: 13px;
    white-space: nowrap;
    cursor: pointer;
  }
  /* 対象年齢(2026-10-01) */
  /* 年齢の行は遊び場・宿温泉タブだけに出す(2026-10-12)。お食事タブは年齢タグが2%しか付いておらず、
     押すとほぼ全滅して使い物にならないため。タグが3割程度付いたら解禁する */
  .agefilters { display: none; }
  body.cat-play .agefilters, body.cat-onsen .agefilters { display: contents; }
  /* ★顧客向けの1行目【2026-10-14】: 子連れOK + 年齢 + 🔍。折り返さず、はみ出したら横スクロール */
  .filters.mainrow { flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; -webkit-overflow-scrolling: touch; }
  .filters.mainrow::-webkit-scrollbar { display: none; }
  /* ★子連れボタンを「押せるボタン」に見せる(2026-10-27ユーザー要望「アイコンに見える」)。
     立体の影+押したら沈む+右に「切替」の小札(押すたびに 歓迎→可まで→すべて と変わることを示す) */
  .kids-btn {
    font-weight: 700; font-size: 14px; padding: 8px 10px 8px 14px;
    display: inline-flex; align-items: center; gap: 8px;
    box-shadow: 0 3px 0 rgba(0,0,0,.18), 0 3px 8px rgba(0,0,0,.12);
    transition: transform .05s, box-shadow .05s;
  }
  .kids-btn::after {
    content: "切替 ▾"; font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 999px;
    background: rgba(255,255,255,.3); border: 1px solid rgba(255,255,255,.55);
  }
  .kids-btn:not(.active)::after { background: #f1f2f6; border-color: #dfe4ea; color: #57606f; }
  .filter-btn.kids-btn.active { background: #e8772e; border-color: #c9621f; color: #fff; }
  .filter-btn.kids-btn.kids-lv1 { background: #f39c5a; border-color: #d9803d; }   /* 可まで広げている段 */
  .kids-btn:active { transform: translateY(3px); box-shadow: 0 0 0 rgba(0,0,0,.18), 0 1px 3px rgba(0,0,0,.12); }
  .icon-btn {
    margin-left: auto; flex: 0 0 auto;
    width: 36px; height: 34px; border-radius: 999px;
    border: 1px solid var(--border); background: #fff; font-size: 16px; cursor: pointer;
  }
  .icon-btn.on { background: #2d3436; border-color: #2d3436; }
  #searchbar { display: none; margin: 8px 0 0; }
  header.search-open #searchbar, body.admin #searchbar { display: block; }
  .filters.subrow { display: none; margin-top: 6px; }
  body.cat-onsen .filters.subrow, body.admin .filters.subrow { display: flex; }
  .admin-only { display: none; }
  body.admin h1.admin-only { display: block; }
  body.admin span.admin-only { display: contents; }
  .admin-tag { font-size: 11px; font-weight: 400; color: #fff; background: #0f6e5c; border-radius: 6px; padding: 1px 6px; margin-left: 6px; }
  .area-btn { border: 1px solid var(--border); background: #fff; color: var(--text); padding: 7px 14px; border-radius: 999px; font-size: 13px; white-space: nowrap; cursor: pointer; }
  .area-btn.active { background: var(--accent); border-color: var(--accent); color: #fff; }
  .b-age.unk { background: #f1f1f1; color: #8a8a8a; }
  .age-label { font-size: 12px; color: var(--muted); margin-right: 2px; }
  .age-btn { border: 1px solid var(--border); background: #fff; color: var(--text); padding: 6px 12px;
             border-radius: 999px; font-size: 12.5px; white-space: nowrap; cursor: pointer; }
  .age-btn.active { background: #2f7d5b; border-color: #2f7d5b; color: #fff; }
  .b-age { display: inline-block; font-size: 11px; background: #e8f4ee; color: #2f6b50; border-radius: 999px;
           padding: 2px 8px; margin: 0 4px 4px 0; }
  .filter-btn.active {
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
  }
  #map {
    width: 100%;
    height: 54vh;   /* 上部を2段に減らしたぶん地図を広く(46vh→54vh・2026-10-14) */
    min-height: 260px;
  }
  #count {
    font-size: 12px;
    color: var(--muted);
    padding: 8px 14px 0;
  }
  #list {
    padding: 8px 10px 40px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  /* ★検索結果の行【2026-10-23ユーザー要望】
     「検索ボタンを押してもピンが立つだけで何が起きたか分からない」→ 検索中はカードではなく
     1行ずつの結果リストをシートに出し、タップでその店へ地図が飛ぶ。カードより密にして見渡せるように */
  .sr-lead { font-size: 12px; color: var(--muted); padding: 2px 4px 0; }
  body.searching #a2hs { display: none; }   /* 検索中はホーム画面案内を出さず、結果を上に詰める */
  .sr-item {
    display: flex; align-items: center; gap: 10px;
    width: 100%; text-align: left;
    background: #fff; border: 1px solid var(--border); border-radius: 10px;
    padding: 10px 12px; cursor: pointer; font: inherit; color: var(--text);
  }
  .sr-item.selected { border-color: var(--accent); box-shadow: 0 0 0 2px rgba(230,96,60,.18); }
  .sr-pin { flex: 0 0 auto; font-size: 18px; line-height: 1; }
  .sr-main { flex: 1 1 auto; min-width: 0; }
  .sr-name { font-weight: 700; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .sr-name mark { background: #fff3b0; color: inherit; padding: 0 1px; border-radius: 2px; }
  .sr-sub { font-size: 12px; color: var(--muted); margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .sr-tags { display: flex; gap: 4px; flex-wrap: wrap; margin-top: 4px; }
  .sr-tag { font-size: 10px; padding: 1px 6px; border-radius: 999px; background: #f1f1f1; color: #555; }

  .lightbox {

  /* ===== ★統合ボトムシート【2026-10-14】 =====
     ページはスクロールさせず、header + 地図(残り全部) + 下に固定のシート。
     シートの高さは JS(Sheet)が peek/half/full に応じて px で入れる */
  html, body { height: 100%; }
  body { height: 100dvh; overflow: hidden; display: flex; flex-direction: column; }
  header { position: static; flex: 0 0 auto; }
  #map { flex: 1 1 auto; height: auto; min-height: 200px; }
  #bsheet {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 30;
    background: #fff;
    border-radius: 16px 16px 0 0;
    box-shadow: 0 -4px 24px rgba(0,0,0,.18);
    display: flex; flex-direction: column;
    height: 180px;
    transition: height .22s ease;
    padding-bottom: env(safe-area-inset-bottom);
  }
  .bs-head {
    flex: 0 0 auto;
    padding: 8px 14px 6px;
    touch-action: none;            /* つまみの上では画面スクロールではなくドラッグ */
    cursor: grab;
    user-select: none; -webkit-user-select: none;
    border-bottom: 1px solid var(--border);
  }
  .bs-grip { width: 40px; height: 4px; border-radius: 2px; background: #cfcfcf; margin: 0 auto 8px; }
  .bs-title { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--muted); }
  .bs-title #count { flex: 1; padding: 0; }
  .bs-hint { font-size: 11px; color: var(--accent); font-weight: 700; white-space: nowrap; }
  .bs-hint-down, .bs-detail-title { display: none; }
  #bsheet[data-state="full"] .bs-hint-up { display: none; }
  #bsheet[data-state="full"] .bs-hint-down { display: inline; }
  .bs-head .legend { margin-top: 4px; }
  .bs-body {
    flex: 1 1 auto; min-height: 0;
    overflow-y: auto;
    overscroll-behavior: contain;
    -webkit-overflow-scrolling: touch;
    padding: 0 10px 8px;
  }
  #bsheet[data-state="peek"] .bs-body { overflow: hidden; }
  /* ★一覧モードも「つまみ+件数の帯」まで畳める min 段【2026-10-25ユーザー要望「初期画面のリストにおいても下にスライドすれば最小に」】
     peek(先頭1枚)の下にもう1段。中身と凡例を隠して地図を全部見せる */
  #bsheet[data-state="min"] .bs-body { visibility: hidden; }
  #bsheet[data-state="min"] .legend { display: none; }
